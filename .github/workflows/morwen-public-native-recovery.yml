name: Morwen public runner private Front trial (W132 G2 crown then shoulder, F06/F01)
on:
  pull_request:
    paths:
      - '.github/workflows/morwen-public-native-recovery.yml'
      - 'tools/production_qa/morwen_public_recovery*'
      - 'tools/production_qa/test_morwen_public_recovery.py'
      - 'tools/production_qa/morwen_public_front*'
      - 'tools/production_qa/test_morwen_public_front_trial.py'
      - 'tools/production_qa/test_morwen_public_front_adapt.py'
      - 'tools/production_qa/morwen_w128*'
      - 'tools/production_qa/test_morwen_w128_guide.py'
      - 'tools/production_qa/morwen_label_boxes.swift'
      - 'tools/production_qa/morwen_w125_save_return.py'
  push:
    branches: [main]
    paths: ['.github/workflows/morwen-public-native-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: morwen-vroid-macos-probe
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate isolated recovery without credentials
        run: |
          set -euo pipefail
          bash -n tools/production_qa/morwen_public_recovery_startup.sh
          python3 -m py_compile tools/production_qa/morwen_public_recovery.py
          python3 tools/production_qa/test_morwen_public_recovery.py
          bash -n tools/production_qa/morwen_public_front_trial.sh
          python3 -m py_compile tools/production_qa/morwen_public_front_trial.py
          python3 tools/production_qa/test_morwen_public_front_trial.py
          bash -n tools/production_qa/morwen_public_front_visibility.sh
          python3 -m py_compile tools/production_qa/morwen_public_front_adapt.py
          python3 tools/production_qa/test_morwen_public_front_adapt.py
          bash -n tools/production_qa/morwen_w128_trial.sh
          bash -n tools/production_qa/morwen_w128_new_guide.sh
          python3 -m py_compile tools/production_qa/morwen_w128_trial.py tools/production_qa/morwen_w128_guide.py tools/production_qa/morwen_w125_save_return.py
          test "$(git hash-object tools/production_qa/morwen_w125_save_return.py)" = f927d3f5e510bb9c76607178a086cf26d4476a59
          python3 -m venv "$RUNNER_TEMP/w128-venv"
          "$RUNNER_TEMP/w128-venv/bin/pip" install --only-binary=:all: 'Pillow==12.3.0' 'numpy>=2.0,<3'
          "$RUNNER_TEMP/w128-venv/bin/python" tools/production_qa/test_morwen_w128_guide.py
  recover:
    if: github.repository == 'celticmusic-nagoya/the-windbound-oath' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '315379131' && github.run_attempt == 1 && vars.MORWEN_PRIVATE_TRANSFER_APPROVED == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    environment: two-private-preservation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb
          path: qualified-vroid
          persist-credentials: false
      - name: Verify qualified controls and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/morwen-private-recovery"
          mkdir -m 700 "$RUNNER_TEMP/morwen-private-recovery/evidence"
          test "$(git -C qualified-vroid rev-parse HEAD)" = 3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb
          test "$(git -C qualified-vroid hash-object tools/production_qa/macos_gui.swift)" = 025f55ba45c67369f52d99f32be5b7b679b29f7c
          test "$(git hash-object tools/private-preservation/release_transport.py)" = a9c2d1a28e649b76608129636b294f6e2b45c97a
          bash -n tools/production_qa/morwen_public_recovery_startup.sh
          python3 tools/production_qa/test_morwen_public_recovery.py
          swiftc qualified-vroid/tools/production_qa/macos_gui.swift -o "$RUNNER_TEMP/two-gui"
      - name: Verify active-job exclusion (bounded full rescan) and restore exact durable W108 with pinned W128 helpers
        env:
          GH_TOKEN: ${{ github.token }}
          DEST_TOKEN: ${{ secrets.TWO_HANDOFF_RELEASE_WRITE_TOKEN }}
          MORWEN_PRIVATE_TRANSFER_APPROVED: ${{ vars.MORWEN_PRIVATE_TRANSFER_APPROVED }}
        run: python3 tools/production_qa/morwen_w128_trial.py prepare
      - name: Install the previously qualified signed VRoid build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/morwen-private-recovery"
          (
            curl --fail --location --proto '=https' --max-time 420 --output "$RUNNER_TEMP/vroid.dmg" 'https://download.vroid.com/dist/2cbXSb76Bf/VRoidStudio-v2.16.0-mac.dmg'
            echo "d3d8900b6397e9ed7cea640c679b07dfff011eb9fc393533e26419f5fcf546f6  $RUNNER_TEMP/vroid.dmg" | shasum -a 256 -c
            hdiutil verify "$RUNNER_TEMP/vroid.dmg"
            mkdir -p "$RUNNER_TEMP/vroid-mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/vroid-mount" "$RUNNER_TEMP/vroid.dmg"
            app="$(find "$RUNNER_TEMP/vroid-mount" -maxdepth 2 -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute -vv "$app"
            ditto "$app" "$RUNNER_TEMP/VRoidStudio.app"
            hdiutil detach "$RUNNER_TEMP/vroid-mount"
          ) > evidence/install.log 2>&1 || { echo SIGNED_INSTALL_BLOCKED; exit 1; }
          echo SIGNED_INSTALL_PASS
      - name: Recheck live owner and exclusion before isolated native trial
        env:
          GH_TOKEN: ${{ github.token }}
          DEST_TOKEN: ${{ secrets.TWO_HANDOFF_RELEASE_WRITE_TOKEN }}
          MORWEN_PRIVATE_TRANSFER_APPROVED: ${{ vars.MORWEN_PRIVATE_TRANSFER_APPROVED }}
        run: python3 tools/production_qa/morwen_w128_trial.py fence
      - name: Reopen and add independent new guide G2 with measured F06/F01 strokes (W128)
        id: front_trial
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/morwen-private-recovery"
          bash "$GITHUB_WORKSPACE/tools/production_qa/morwen_w128_trial.sh" > evidence/gui.log 2>&1 || { echo W128_BLOCKED_PRIVATE_EVIDENCE_STAGE_$(cat evidence/W128-status.txt 2>/dev/null | tr -cd 'A-Z0-9_' || true); exit 1; }
          echo W128_SAVED_REOPENED_NOT_ADOPTED_STAGE_$(cat evidence/W128-status.txt | tr -cd 'A-Z0-9_')
      - name: Preserve only in existing private Release transport and read back
        env:
          GH_TOKEN: ${{ github.token }}
          DEST_TOKEN: ${{ secrets.TWO_HANDOFF_RELEASE_WRITE_TOKEN }}
          MORWEN_PRIVATE_TRANSFER_APPROVED: ${{ vars.MORWEN_PRIVATE_TRANSFER_APPROVED }}
        run: python3 tools/production_qa/morwen_w128_trial.py preserve
      - name: Preserve failed trial evidence only in private quarantine
        if: failure() && steps.front_trial.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          DEST_TOKEN: ${{ secrets.TWO_HANDOFF_RELEASE_WRITE_TOKEN }}
          MORWEN_PRIVATE_TRANSFER_APPROVED: ${{ vars.MORWEN_PRIVATE_TRANSFER_APPROVED }}
        run: python3 tools/production_qa/morwen_w128_trial.py quarantine

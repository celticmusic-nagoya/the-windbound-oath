name: Morwen Eyelid 06 Blender Diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - feature/morwen-eyelid-sculpt-06
    paths:
      - '.github/workflows/morwen-eyelid-blender-06.yml'
      - 'tools/blender/morwen_production/eyelid_sculpt/**'
permissions:
  contents: read
env:
  BPY_WHEEL_SHA256: 5850cd39369e4cd8c67ed067d39ec1e57426103ddc709436e13209b56665c6a0
  MORWEN_OUT: render_output/morwen_eyelid_retopo_05
  PYTHONHASHSEED: '0'
jobs:
  geometry-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          python -m pip download --no-deps --only-binary=:all: bpy==5.3.0 -d wheels
          echo "${BPY_WHEEL_SHA256}  $(ls wheels/bpy-5.3.0-*.whl)" | sha256sum -c -
          python -m pip install --no-deps wheels/bpy-5.3.0-*.whl
          grep -v '^bpy==' tools/blender/morwen_production/head_landmark/requirements-lock.txt > /tmp/req.txt
          python -m pip install -r /tmp/req.txt
      - name: Retrieve pinned CC0 VRM source
        run: |
          python - <<'PY'
          import hashlib, io, urllib.request, zipfile
          from pathlib import Path
          url = "https://opengameart.org/sites/default/files/base_female.zip"
          out = Path("render_output/morwen_vroid_review"); out.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=90) as res:
              raw = res.read()
          assert hashlib.sha256(raw).hexdigest() == "bf2717cff70b40a278df56e137dbb699c6499551096fa4c005e9aeca1de68eb3"
          vrm = zipfile.ZipFile(io.BytesIO(raw)).read("Base_Female.vrm")
          assert hashlib.sha256(vrm).hexdigest() == "1995f174f6c8f2211f3c56c9e5fe4f9daf27ee5e648f129479582a259238149b"
          (out / "Base_Female.vrm").write_bytes(vrm)
          PY
      - name: Rebuild source EYELID-05 model
        run: |
          python tools/blender/morwen_production/eyelid_retopo/measure_eye_targets_05.py
          python tools/blender/morwen_production/eyelid_retopo/run_eyelid_05.py
      - name: Inspect saved lid mesh without editing
        env:
          EYELID_06_DIAGNOSTIC_JSON: render_output/morwen_eyelid_retopo_05/EYELID_06_GEOMETRY_DIAGNOSTIC.json
        run: |
          python - <<'PY'
          import bpy
          import runpy
          from pathlib import Path
          p=Path("render_output/morwen_eyelid_retopo_05/MORWEN_EYELID_05_CANDIDATE.blend").resolve()
          assert p.is_file(), "EYELID-05 candidate .blend missing"
          bpy.ops.wm.open_mainfile(filepath=str(p))
          runpy.run_path("tools/blender/morwen_production/eyelid_sculpt/inspect_lid_geometry_06.py", run_name="__main__")
          PY
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-eyelid-06-geometry-diagnostic
          path: |
            render_output/morwen_eyelid_retopo_05/EYELID_06_GEOMETRY_DIAGNOSTIC.json
            render_output/morwen_eyelid_retopo_05/EYELID_05_REPORT.json
          if-no-files-found: warn
          retention-days: 7

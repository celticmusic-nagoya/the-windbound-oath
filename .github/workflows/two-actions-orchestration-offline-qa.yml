name: TWO Actions orchestration offline unit QA
on:
  workflow_dispatch:
  push:
    branches: [feature/lind-cliff-rock-art-study-20261118]
    paths: ['.github/workflows/two-actions-orchestration-offline-qa.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: two-actions-offline-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile read-only orchestration utilities
        run: |
          python3 -m py_compile tools/production_qa/classify_actions_jobs.py tools/production_qa/audit_actions_ledger.py tools/production_qa/collect_actions_snapshot.py tools/production_qa/reconcile_actions_snapshot.py tools/production_qa/verify_actions_artifact.py tools/production_qa/inspect_actions_artifact_metadata.py tools/production_qa/download_actions_artifact.py tools/production_qa/reserve_actions_job_ref.py tools/production_qa/assess_actions_reservation_recovery.py tools/production_qa/review_actions_reservation_snapshot.py
      - name: Run exactly ten offline unit test modules once each
        run: |
          set -euo pipefail
          for name in classify_actions_jobs audit_actions_ledger collect_actions_snapshot reconcile_actions_snapshot verify_actions_artifact inspect_actions_artifact_metadata download_actions_artifact reserve_actions_job_ref assess_actions_reservation_recovery review_actions_reservation_snapshot; do
            python3 -m unittest discover -s tools/production_qa -p "test_${name}.py" -v
          done
  authenticated-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe actual repository runs without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/two-observation
          python3 tools/production_qa/collect_actions_snapshot.py --repo "$GITHUB_REPOSITORY" --pages 2 > /tmp/two-observation/snapshot.json
          python3 -c 'import json,os; p=json.load(open("/tmp/two-observation/snapshot.json")); assert any(r["run_id"]==int(os.environ["GITHUB_RUN_ID"]) for r in p["runs"]), "current run not observed"; print("AUTHENTICATED_OBSERVATION_PASS",len(p["runs"]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-authenticated-observation-${{ github.run_id }}
          path: /tmp/two-observation/
          retention-days: 7
  technical-render:
    needs: [offline-unit-tests, authenticated-observation]
    if: github.ref == 'refs/heads/feature/lind-cliff-rock-art-study-20261118' && github.event_name == 'push'
    concurrency:
      group: lind-blender-integration-refs/heads/feature/lind-cliff-rock-art-study-20261118
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch shared Blender installer from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: shared-main
          persist-credentials: false
      - name: Install SHA-verified Blender 5.2.4
        timeout-minutes: 12
        run: |
          test "$(git -C shared-main hash-object tools/production_qa/install_blender_524.sh)" = ef35cadf85a9d6210232627d86c95650a594219f
          bash shared-main/tools/production_qa/install_blender_524.sh /tmp/two-blender/app
          /tmp/two-blender/app/blender --version | head -n 3
      - name: Generate isolated technical fixture
        run: |
          mkdir -p /tmp/lind-ai-technical
          /tmp/two-blender/app/blender -b --factory-startup --disable-autoexec --python tools/map_blender/ai_guard/create_fixture.py -- --out /tmp/lind-ai-technical/fixture.blend
          sha256sum /tmp/lind-ai-technical/fixture.blend | tee /tmp/lind-ai-technical/source-before.sha256
      - name: Prepare allowlisted feedback
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/lind-ai-technical')
          base = dict(schema='two-render-patch-v1', asset_id='technical-fixture',
                      method_family='lighting-fixture', root_cause='test-exposure')
          (root/'baseline.json').write_text(json.dumps({**base, 'adjustments': {'exposure_delta': 0.0}}))
          (root/'corrected.json').write_text(json.dumps({**base, 'adjustments': {'exposure_delta': 0.1}}))
          PY
      - name: Render baseline and corrected candidate
        run: |
          python3 tools/map_blender/ai_guard/run_blender_safe.py --blender /tmp/two-blender/app/blender --source /tmp/lind-ai-technical/fixture.blend --proposal /tmp/lind-ai-technical/baseline.json --output /tmp/lind-ai-technical/baseline.png --timeout 240
          python3 tools/map_blender/ai_guard/run_blender_safe.py --blender /tmp/two-blender/app/blender --source /tmp/lind-ai-technical/fixture.blend --proposal /tmp/lind-ai-technical/corrected.json --output /tmp/lind-ai-technical/corrected.png --timeout 240
          sha256sum -c /tmp/lind-ai-technical/source-before.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/tmp/lind-ai-technical')
          for name in ('baseline.png','corrected.png'):
              p = root/name
              assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), name
              print(name, p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())
          assert (root/'baseline.png').read_bytes() != (root/'corrected.png').read_bytes(), 'correction did not change output'
          print('TECHNICAL_RENDER_LOOP_PASS')
          PY
      - name: Upload evidence regardless of failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lind-ai-technical-render-evidence-${{ github.run_id }}
          path: /tmp/lind-ai-technical/
          retention-days: 7
          if-no-files-found: warn

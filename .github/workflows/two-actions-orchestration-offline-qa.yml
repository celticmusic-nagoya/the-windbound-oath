name: TWO Actions orchestration offline unit QA
on:
  workflow_dispatch:
  push:
    branches: [feature/lind-cliff-rock-art-study-20261118]
    paths: ['.github/workflows/two-actions-orchestration-offline-qa.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: two-actions-offline-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile read-only orchestration utilities
        run: |
          python3 -m py_compile tools/production_qa/classify_actions_jobs.py tools/production_qa/audit_actions_ledger.py tools/production_qa/collect_actions_snapshot.py tools/production_qa/reconcile_actions_snapshot.py tools/production_qa/verify_actions_artifact.py tools/production_qa/inspect_actions_artifact_metadata.py tools/production_qa/download_actions_artifact.py tools/production_qa/reserve_actions_job_ref.py tools/production_qa/assess_actions_reservation_recovery.py tools/production_qa/review_actions_reservation_snapshot.py
      - name: Run exactly ten offline unit test modules once each
        run: |
          set -euo pipefail
          for name in classify_actions_jobs audit_actions_ledger collect_actions_snapshot reconcile_actions_snapshot verify_actions_artifact inspect_actions_artifact_metadata download_actions_artifact reserve_actions_job_ref assess_actions_reservation_recovery review_actions_reservation_snapshot; do
            python3 -m unittest discover -s tools/production_qa -p "test_${name}.py" -v
          done
  authenticated-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe actual repository runs without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/two-observation
          python3 tools/production_qa/collect_actions_snapshot.py --repo "$GITHUB_REPOSITORY" --pages 2 > /tmp/two-observation/snapshot.json
          python3 -c 'import json,os; p=json.load(open("/tmp/two-observation/snapshot.json")); assert any(r["run_id"]==int(os.environ["GITHUB_RUN_ID"]) for r in p["runs"]), "current run not observed"; print("AUTHENTICATED_OBSERVATION_PASS",len(p["runs"]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-authenticated-observation-${{ github.run_id }}
          path: /tmp/two-observation/
          retention-days: 7

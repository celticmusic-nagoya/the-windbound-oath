name: Phase 2 Automated QA

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  run-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Validation Script
        run: |
          if [ -f "assets/candidates/phase2/validate_delivery2.py" ]; then
            python assets/candidates/phase2/validate_delivery2.py
          else
            echo "Validation script not found, skipping specialized QA."
          fi

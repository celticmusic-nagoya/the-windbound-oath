name: Adopt approved Bram transparent PNG (one-time)
on:
  push:
    branches: [feature/bram-approved-alpha0-replacement]
    paths: [.github/workflows/adopt-bram-alpha0-once.yml]
permissions:
  contents: write
jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify director PNG and update canonical asset and WebP
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from PIL import Image
          src=Path('assets/companions/bram/bram_fullbody_original_alpha0.png')
          expected='d22fa6d79f10ed01fefb7b8b4bd6cd362f4e7a42dfa80f3d12e6c1d34ec0e9bf'
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          assert digest==expected, ('Approved uploaded PNG does not match director-approved file',digest)
          im=Image.open(src).convert('RGBA')
          assert im.size==(1024,1536)
          a=im.getchannel('A')
          assert a.getextrema()==(0,255), 'Alpha-0 background missing'
          master=Path('assets/companions/bram/master/bram-full-body.png')
          shutil.copyfile(src,master)
          web=Path('web/companions/bram.webp')
          web.parent.mkdir(parents=True,exist_ok=True)
          im.save(web,'WEBP',quality=92,method=6)
          manifest=Path('assets/companions/MANIFEST.json')
          data=json.loads(manifest.read_text())
          for entry in data['assets']:
            if entry['path']==str(master):
              entry.update(status='approved',sha256=digest,bytes=src.stat().st_size,dimensions=[1024,1536],alpha=True)
          data['notes']=[n for n in data['notes'] if 'Bram visual approval not explicitly recorded' not in n]
          data['notes'].append('Bram approved transparent PNG replaces previous master image; original is retained in Git history')
          data['status']='approved asset update (Bram)'
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('approved PNG SHA256:',digest)
          print('master SHA256:',hashlib.sha256(master.read_bytes()).hexdigest())
          print('webp SHA256:',hashlib.sha256(web.read_bytes()).hexdigest())
          print('webp bytes:',web.stat().st_size)
          print('alpha extrema:',a.getextrema())
          PY
      - name: Commit approved replacements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/companions/bram/master/bram-full-body.png assets/companions/MANIFEST.json web/companions/bram.webp
          git diff --cached --quiet || (git commit -m "assets(bram): adopt director-approved alpha0 master and web derivative" && git pull --rebase origin feature/bram-approved-alpha0-replacement && git push origin HEAD:feature/bram-approved-alpha0-replacement)

name: 3D Attempt Ledger QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/qa_3d_attempt_ledger.py'
      - 'tools/map_blender/_qa/**'
      - 'tests/test_qa_3d_attempt_ledger.py'
      - '.github/workflows/3d-attempt-ledger-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test ledger validation
        run: python -m unittest discover -s tests -p 'test_qa_3d_attempt_ledger.py' -v
      - name: Check Aidan ledger
        run: python tools/qa_3d_attempt_ledger.py tools/map_blender/_qa/aidan_home_attempt_ledger.json

          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          src=root/'v86-in'; dest=root/'v85-review-only'
          manifest={n.strip().removeprefix('./'):h for h,n in (l.split(None,1) for l in (src/'SHA256SUMS').read_text().splitlines())}

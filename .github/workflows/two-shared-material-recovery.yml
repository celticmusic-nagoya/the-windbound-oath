name: TWO shared material recovery
on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json'
      - 'tools/map_blueprint/shared_materials_v01/material_cache.py'
      - 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'
      - 'tools/map_blueprint/shared_materials_v01/native_forest_v52.py'
      - 'tools/map_blueprint/shared_materials_v01/intake_hero_tree_v55.py'
      - 'tools/map_blueprint/shared_materials_v01/native_sanctuary_v57.py'
      - 'tools/map_blueprint/shared_materials_v01/native_sanctuary_v58.py'
      - 'tools/map_blueprint/shared_materials_v01/intake_ruin_refs_v59.py'
      - 'tools/map_blueprint/shared_materials_v01/native_terrace_audit_v61.py'
      - 'tools/map_blueprint/shared_materials_v01/native_terrace_conflict_v63.py'
      - 'tools/map_blueprint/shared_materials_v01/intake_ruin_materials_v64.py'
      - 'tools/map_blueprint/shared_materials_v01/native_terrain_color_v69.py'
      - 'tools/map_blueprint/shared_materials_v01/native_irish_floor_v71.py'
      - 'tools/map_blueprint/shared_materials_v01/intake_irish_floor_v71.py'
      - 'tools/map_blueprint/shared_materials_v01/render_irish_floor_v72.py'
      - 'tools/map_blueprint/shared_materials_v01/native_irish_floor_v73.py'
      - 'tools/map_blueprint/shared_materials_v01/native_far_forest_v75.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_floor_v76.py'
      - 'tools/map_blueprint/shared_materials_v01/native_woodland_relief_v78.py'
      - 'tools/map_blueprint/shared_materials_v01/native_far_relief_v77.py'
      - 'tools/map_blueprint/shared_materials_v01/native_enclosed_canopy_v79.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v80.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v81.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_visibility.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_altar_layers.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_stone_material.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_ivy_study.py'
      - 'tools/map_blueprint/shared_materials_v01/native_oak_lod_candidate.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_stone_atlas_fix.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_floor_repair.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v83_sanctuary_integration.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v84_pbr_export.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v85_light_study.py'
      - 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v86_trail_fill.py'
      - '.github/workflows/two-shared-material-recovery.yml'
  workflow_dispatch:
    inputs:
      source_set:
        description: Locked source set to recover
        type: choice
        options: [river-gravel, ireland-river, ireland-dem, native-floor, native-art, native-density, native-pilot, fern-alpha, fern-bark, stump, forest]
        default: river-gravel
permissions:
  contents: read
  actions: read
concurrency:
  group: two-shared-material-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed intake inputs only
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          if [[ "$ACTION" == synchronize ]]; then
            git cat-file -e "$BEFORE^{commit}" || { echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0; }
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_woodland_relief_v78.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V81 isolated sanctuary/trail candidate only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v86_trail_fill.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v85_light_study.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v84_pbr_export.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v83_sanctuary_integration.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_floor_repair.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_stone_atlas_fix.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_oak_lod_candidate.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_ivy_study.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_stone_material.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_altar_layers.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v82_visibility.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v81.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V80 isolated moss-forest root/LOD candidate only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_forest_v80.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V79 isolated enclosed canopy candidate only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_enclosed_canopy_v79.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V77 isolated far relief and lower background PBR.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_far_relief_v77.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V76 isolated material A/B only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_moss_floor_v76.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V75 isolated fixed-vista feasibility only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_far_forest_v75.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V73 isolated material/LOD feasibility only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_irish_floor_v73.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V72 render-only recovery.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/render_irish_floor_v72.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V71 isolated composition and source intake only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_irish_floor_v71.py' 'tools/map_blueprint/shared_materials_v01/intake_irish_floor_v71.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V69 isolated terrain color correction only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_terrain_color_v69.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V64 ruin material intake only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/intake_ruin_materials_v64.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V63 exact conflict only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_terrace_conflict_v63.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V61 read-only native interface survey.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_terrace_audit_v61.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V59 2D references only.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/intake_ruin_refs_v59.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V58 isolated scenery study, no default recovery.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_sanctuary_v58.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V57 independent composition, no default recovery.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_sanctuary_v57.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V55 source intake is independent, avoid default river-gravel recovery.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/intake_hero_tree_v55.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            # V52 native virtual audit is independent; do not recover materials again for its isolated change.
            if ! git diff --quiet "$BEFORE" HEAD -- 'tools/map_blueprint/shared_materials_v01/native_forest_v52.py' && git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' 'tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py' '.github/workflows/two-shared-material-recovery.yml'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Recover only selected locked sources
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'river-gravel') != 'native-pilot' && (inputs.source_set || 'river-gravel') != 'native-density' && (inputs.source_set || 'river-gravel') != 'native-art' && (inputs.source_set || 'river-gravel') != 'native-floor' && (inputs.source_set || 'river-gravel') != 'ireland-dem' && (inputs.source_set || 'river-gravel') != 'ireland-river'
        env:
          SOURCE_SET: ${{ inputs.source_set || 'river-gravel' }}
        shell: bash
        run: |
          case "$SOURCE_SET" in
            river-gravel) python tools/map_blueprint/shared_materials_v01/intake_river_gravel_v35.py "$RUNNER_TEMP/two-material-cache" "$RUNNER_TEMP/material-recovery.json"; exit $? ;;
            fern-alpha) python 'tools/map_blueprint/shared_materials_v01/intake_fern_bark.py' "$RUNNER_TEMP/two-material-cache" "$RUNNER_TEMP/material-recovery.json" alpha; exit $? ;;
            fern-bark) python 'tools/map_blueprint/shared_materials_v01/intake_fern_bark.py' "$RUNNER_TEMP/two-material-cache" "$RUNNER_TEMP/material-recovery.json"; exit $? ;;
            stump) assets=(--asset ph_tree_stump_01) ;;
            forest) assets=(--asset ph_forrest_ground_01 --asset ph_grassy_cobblestone --asset ph_rock_moss_set_01) ;;
            *) exit 2 ;;
          esac
          python 'tools/map_blueprint/shared_materials_v01/material_cache.py' --catalog 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' "${assets[@]}" --out "$RUNNER_TEMP/two-material-cache" --report "$RUNNER_TEMP/material-recovery.json"
      - name: Preserve exact source candidate files and report
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'river-gravel') != 'native-pilot' && (inputs.source_set || 'river-gravel') != 'native-density' && (inputs.source_set || 'river-gravel') != 'native-art' && (inputs.source_set || 'river-gravel') != 'native-floor' && (inputs.source_set || 'river-gravel') != 'ireland-dem' && (inputs.source_set || 'river-gravel') != 'ireland-river'
        uses: actions/upload-artifact@v4
        with:
          name: two-shared-material-${{ inputs.source_set || 'river-gravel' }}-candidates
          path: |
            ${{ runner.temp }}/two-material-cache
            ${{ runner.temp }}/material-recovery.json
          retention-days: 14
          if-no-files-found: error

      - name: Native pilot exact artifact intake
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'river-gravel') == 'native-pilot'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v16-input" "$RUNNER_TEMP/v16-output"
          recover() {
            local id="$1" expected="$2" f="$RUNNER_TEMP/v16-$1.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$f"
            printf '%s  %s\n' "$expected" "$f" | sha256sum -c -
            unzip -tq "$f"
            mkdir -p "$RUNNER_TEMP/v16-input/$id"
            unzip -q "$f" -d "$RUNNER_TEMP/v16-input/$id"
          }
          recover 14626151525 821dbac2f1f5a441e6aba89e527b97692eaf79db23f7c50eb466cd978728ae90
          recover 15017224941 cd1a49b078fc92c23f02e1b05e33ac6ba351c035a30e71eeb3870bb200436564
          recover 15023498109 1a83910660fe9c7ed3fa32ec4c18b00b99210fb056b7a8644bc93c6587376898
          recover 15023783357 620d6f222d3b4613f7140c47342b973fe603125de4cc387492d47269f3420343
          recover 15024936587 05cb8bcc0edf09943b21e6af6207e2eb1825b3c9c2268754f210f070b5218a0d
          echo 'V16_FIVE_ARCHIVES_SHA_PASS' > "$RUNNER_TEMP/v16-output/intake.txt"
      - name: Install approved Blender and render isolated subset
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'river-gravel') == 'native-pilot'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"

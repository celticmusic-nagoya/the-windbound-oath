name: TWO shared material recovery
on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json'
      - 'tools/map_blueprint/shared_materials_v01/material_cache.py'
      - '.github/workflows/two-shared-material-recovery.yml'
  workflow_dispatch:
    inputs:
      source_set:
        description: Locked source set to recover
        type: choice
        options: [ireland-dem, native-floor, native-art, native-density, native-pilot, fern-alpha, fern-bark, stump, forest]
        default: ireland-dem
permissions:
  contents: read
  actions: read
concurrency:
  group: two-shared-material-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed intake inputs only
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          if [[ "$ACTION" == synchronize ]]; then
            git cat-file -e "$BEFORE^{commit}" || { echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0; }
            if git diff --quiet "$BEFORE" HEAD -- 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' 'tools/map_blueprint/shared_materials_v01/material_cache.py' '.github/workflows/two-shared-material-recovery.yml'; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Recover only selected locked sources
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') != 'native-pilot' && (inputs.source_set || 'ireland-dem') != 'native-density' && (inputs.source_set || 'ireland-dem') != 'native-art' && (inputs.source_set || 'ireland-dem') != 'native-floor' && (inputs.source_set || 'ireland-dem') != 'ireland-dem'
        env:
          SOURCE_SET: ${{ inputs.source_set || 'ireland-dem' }}
        shell: bash
        run: |
          case "$SOURCE_SET" in
            fern-alpha) python 'tools/map_blueprint/shared_materials_v01/intake_fern_bark.py' "$RUNNER_TEMP/two-material-cache" "$RUNNER_TEMP/material-recovery.json" alpha; exit $? ;;
            fern-bark) python 'tools/map_blueprint/shared_materials_v01/intake_fern_bark.py' "$RUNNER_TEMP/two-material-cache" "$RUNNER_TEMP/material-recovery.json"; exit $? ;;
            stump) assets=(--asset ph_tree_stump_01) ;;
            forest) assets=(--asset ph_forrest_ground_01 --asset ph_grassy_cobblestone --asset ph_rock_moss_set_01) ;;
            *) exit 2 ;;
          esac
          python 'tools/map_blueprint/shared_materials_v01/material_cache.py' --catalog 'docs/production/region_master/SHARED_PHOTO_MATERIAL_CATALOG_V01.json' "${assets[@]}" --out "$RUNNER_TEMP/two-material-cache" --report "$RUNNER_TEMP/material-recovery.json"
      - name: Preserve exact source candidate files and report
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') != 'native-pilot' && (inputs.source_set || 'ireland-dem') != 'native-density' && (inputs.source_set || 'ireland-dem') != 'native-art' && (inputs.source_set || 'ireland-dem') != 'native-floor' && (inputs.source_set || 'ireland-dem') != 'ireland-dem'
        uses: actions/upload-artifact@v4
        with:
          name: two-shared-material-${{ inputs.source_set || 'ireland-dem' }}-candidates
          path: |
            ${{ runner.temp }}/two-material-cache
            ${{ runner.temp }}/material-recovery.json
          retention-days: 14
          if-no-files-found: error

      - name: Native pilot exact artifact intake
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-pilot'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v16-input" "$RUNNER_TEMP/v16-output"
          recover() {
            local id="$1" expected="$2" f="$RUNNER_TEMP/v16-$1.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$f"
            printf '%s  %s\n' "$expected" "$f" | sha256sum -c -
            unzip -tq "$f"
            mkdir -p "$RUNNER_TEMP/v16-input/$id"
            unzip -q "$f" -d "$RUNNER_TEMP/v16-input/$id"
          }
          recover 14626151525 821dbac2f1f5a441e6aba89e527b97692eaf79db23f7c50eb466cd978728ae90
          recover 15017224941 cd1a49b078fc92c23f02e1b05e33ac6ba351c035a30e71eeb3870bb200436564
          recover 15023498109 1a83910660fe9c7ed3fa32ec4c18b00b99210fb056b7a8644bc93c6587376898
          recover 15023783357 620d6f222d3b4613f7140c47342b973fe603125de4cc387492d47269f3420343
          recover 15024936587 05cb8bcc0edf09943b21e6af6207e2eb1825b3c9c2268754f210f070b5218a0d
          echo 'V16_FIVE_ARCHIVES_SHA_PASS' > "$RUNNER_TEMP/v16-output/intake.txt"
      - name: Install approved Blender and render isolated subset
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-pilot'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --python-exit-code 1 --python tools/map_blueprint/shared_materials_v01/native_forest_v16.py -- "$RUNNER_TEMP/v16-input" "$RUNNER_TEMP/v16-output"
      - name: Preserve native pilot and render evidence
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-pilot'
        uses: actions/upload-artifact@v4
        with:
          name: two-forest-v16-native-pilot
          path: ${{ runner.temp }}/v16-output
          retention-days: 14
          if-no-files-found: error

      - name: Recover verified pilot for native density study
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-density'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v18-input" "$RUNNER_TEMP/v18-output"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15026419458/zip" > "$RUNNER_TEMP/v18-pilot.zip"
          printf '%s  %s\n' 9ec037afa4b944dbbe73ace584445ca6de663ac12239e4493d760a55e445b7d0 "$RUNNER_TEMP/v18-pilot.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/v18-pilot.zip"
          unzip -q "$RUNNER_TEMP/v18-pilot.zip" -d "$RUNNER_TEMP/v18-input"
          echo 'V18_NATIVE_PILOT_ARCHIVE_SHA_PASS' > "$RUNNER_TEMP/v18-output/intake.txt"
      - name: Execute approved Blender density and lighting study
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-density'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          model="$(find "$RUNNER_TEMP/v18-input" -type f -name forest_v16_native_pilot.blend)"
          test -f "$model"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --python-exit-code 1 --python tools/map_blueprint/shared_materials_v01/native_forest_density_v18.py -- "$model" tools/map_blueprint/shared_materials_v01/v15c_vegetation_transforms_v18.txt "$RUNNER_TEMP/v18-output"
      - name: Preserve V18 native density and lighting evidence
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-density'
        uses: actions/upload-artifact@v4
        with:
          name: two-forest-v18-native-density
          path: ${{ runner.temp }}/v18-output
          retention-days: 14
          if-no-files-found: error

      - name: Recover V18 native checkpoint
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-art'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v19-input" "$RUNNER_TEMP/v19-output"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15028119073/zip" > "$RUNNER_TEMP/v19.zip"
          printf '%s  %s\n' f3c4e792e7d99cfe0ce1bece45d80d935655be269e3303dc5c99547d5702e864 "$RUNNER_TEMP/v19.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/v19.zip"
          unzip -q "$RUNNER_TEMP/v19.zip" -d "$RUNNER_TEMP/v19-input"
          echo V19_CHECKPOINT_ARCHIVE_SHA_PASS > "$RUNNER_TEMP/v19-output/intake.txt"
          # Read-only recovery of the existing official source from its immutable commit.
          # Failure here blocks canon comparison, not independent material evaluation.
          cg="$RUNNER_TEMP/v19-official-cg.png"
          if git show dc17dd4846f35ea1f5dea25168eec9ddb50a3838:assets/sources/lind-world-20261116/original.png > "$cg" 2>/dev/null && printf '%s  %s\n' abbb3997b63ea5d86eea01f68bd220f0713baf4e90afaaa37684ec2687dc0620 "$cg" | sha256sum -c -; then
            cp "$cg" "$RUNNER_TEMP/v19-output/official_cg_verified.png"
            echo OFFICIAL_CG_SHA_PASS > "$RUNNER_TEMP/v19-output/official_cg_status.txt"
          else
            echo OFFICIAL_CG_BYTES_UNVERIFIED > "$RUNNER_TEMP/v19-output/official_cg_status.txt"
          fi
      - name: Execute V19B corrected native forest art study
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-art'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --python-exit-code 1 --python tools/map_blueprint/shared_materials_v01/native_forest_art_v19.py -- "$RUNNER_TEMP/v19-input/forest_v18_native_density.blend" "$RUNNER_TEMP/v19-output"
      - name: Preserve V19 native art evidence
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-art'
        uses: actions/upload-artifact@v4
        with:
          name: two-forest-v19b-native-art
          path: ${{ runner.temp }}/v19-output
          retention-days: 14
          if-no-files-found: error

      - name: Recover V19B native checkpoint and floor sources
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-floor'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v21-input" "$RUNNER_TEMP/v21-output"
          recover() {
            local id="$1" expected="$2" f="$RUNNER_TEMP/v21-$1.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$f"
            printf '%s  %s\n' "$expected" "$f" | sha256sum -c -
            unzip -tq "$f"
            mkdir -p "$RUNNER_TEMP/v21-input/$id"
            unzip -q "$f" -d "$RUNNER_TEMP/v21-input/$id"
          }
          recover 15029479327 f3dfb34f87557391372a7732d32602c125648e8eeaa481505dc936e27350578e
          recover 14626151525 821dbac2f1f5a441e6aba89e527b97692eaf79db23f7c50eb466cd978728ae90
          recover 15017224941 cd1a49b078fc92c23f02e1b05e33ac6ba351c035a30e71eeb3870bb200436564
          recover 15023498109 1a83910660fe9c7ed3fa32ec4c18b00b99210fb056b7a8644bc93c6587376898
          echo V21_FOUR_ARCHIVES_SHA_PASS > "$RUNNER_TEMP/v21-output/intake.txt"
      - name: Native V21 forest floor reconstruction and diagnostic renders
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-floor'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --python-exit-code 1 --python tools/map_blueprint/shared_materials_v01/native_forest_floor_v21.py -- "$RUNNER_TEMP/v21-input/15029479327/forest_v19_native_art.blend" "$RUNNER_TEMP/v21-input" tools/map_blueprint/shared_materials_v01/floor_transforms_v21.txt "$RUNNER_TEMP/v21-output"
      - name: Preserve V21 native floor evidence
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'native-floor'
        uses: actions/upload-artifact@v4
        with:
          name: two-forest-v21-native-floor
          path: ${{ runner.temp }}/v21-output
          retention-days: 14
          if-no-files-found: error

      - name: Acquire remaining southwest Irish terrain reference raster
        if: steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'ireland-dem'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v23-output"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gdal python3-numpy
          /usr/bin/python3 tools/map_blueprint/shared_materials_v01/ireland_dem_v24_southwest.py "$RUNNER_TEMP/v23-output"
      - name: Preserve exact DSM source and measured reference outputs
        if: always() && steps.scope.outputs.run == 'true' && (inputs.source_set || 'ireland-dem') == 'ireland-dem'
        uses: actions/upload-artifact@v4
        with:
          name: two-ireland-dem-v24-southwest
          path: ${{ runner.temp }}/v23-output
          retention-days: 14
          if-no-files-found: error

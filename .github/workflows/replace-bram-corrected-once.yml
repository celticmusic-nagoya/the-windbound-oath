name: Replace Bram with corrected approved PNG (one-time)
on:
  push:
    branches: [feature/bram-alpha0-corrected-20261106]
    paths: [.github/workflows/replace-bram-corrected-once.yml]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and replace master; delete superseded uploads
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          from PIL import Image
          src=Path('assets/companions/bram/赤髭のドワーフ戦士と巨大戦槌 (1).png')
          sha='9a77b5644a016237463d4dd308aaf957b9fda88a51dfc20e14508dc7ac7669da'
          print('UPLOADED_SHA256:',hashlib.sha256(src.read_bytes()).hexdigest(),flush=True)
          assert hashlib.sha256(src.read_bytes()).hexdigest()==sha, 'Incorrect uploaded file'
          im=Image.open(src).convert('RGBA')
          assert im.size==(1024,1535)
          assert im.getchannel('A').getextrema()==(0,255)
          master=Path('assets/companions/bram/master/bram-full-body.png')
          shutil.copyfile(src,master)
          web=Path('web/companions/bram.webp')
          im.save(web,'WEBP',quality=94,method=6)
          assert Image.open(web).convert('RGBA').getchannel('A').getextrema()==(0,255)
          manifest=Path('assets/companions/MANIFEST.json')
          data=json.loads(manifest.read_text())
          for entry in data['assets']:
            if entry['path']==str(master):
              entry.update(status='approved',sha256=sha,bytes=src.stat().st_size,dimensions=[1024,1535],alpha=True)
          data['notes']=[n for n in data.get('notes',[]) if 'Bram approved transparent PNG replaces previous master image' not in n]
          data['notes'].append('Bram canonical master replaced with director-corrected 1024x1535 transparent PNG; superseded upload removed from working tree')
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          old=Path('assets/companions/bram/bram_fullbody_original_alpha0.png')
          if old.exists(): old.unlink()
          src.unlink()
          print('CORRECT_APPROVED_SHA256:',sha)
          print('MASTER_SHA256:',hashlib.sha256(master.read_bytes()).hexdigest())
          print('WEBP_SHA256:',hashlib.sha256(web.read_bytes()).hexdigest())
          print('WEBP_SIZE:',web.stat().st_size)
          PY
      - name: Commit replacement and deletion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/companions/bram assets/companions/MANIFEST.json web/companions/bram.webp
          git diff --cached --quiet || (git commit -m "assets(bram): replace incorrect art and delete superseded uploads" && git pull --rebase origin feature/bram-alpha0-corrected-20261106 && git push origin HEAD:feature/bram-alpha0-corrected-20261106)

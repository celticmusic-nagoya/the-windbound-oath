name: Map Asset Intake QA
on:
  push:
    branches: [feature/map-pipeline-01]
    paths:
      - 'tools/map_blender/qa_asset_intake.py'
      - 'tests/test_map_asset_intake.py'
      - '.github/workflows/map-asset-intake-qa.yml'
  pull_request:
    paths:
      - 'tools/map_blender/qa_asset_intake.py'
      - 'tests/test_map_asset_intake.py'
      - '.github/workflows/map-asset-intake-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run intake tests
        run: python3 -m unittest discover -s tests -p 'test_map_asset_intake.py' -v

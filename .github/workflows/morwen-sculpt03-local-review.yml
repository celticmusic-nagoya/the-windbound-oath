name: Morwen sculpt03 local topology review (NOT final sculpt)
on:
  push:
    branches: [feature/morwen-sculpt03-retopo-plan]
    paths:
      - 'assets/candidates/morwen-sculpt03/**'
      - 'tools/morwen_sculpt03/review_eyelid_prototype.py'
      - '.github/workflows/morwen-sculpt03-local-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          python -m pip install 'bpy==4.3.0' 'numpy<3'
      - name: Review the exact committed partial candidate without saving edits
        run: python tools/morwen_sculpt03/review_eyelid_prototype.py
      - name: Upload editable partial master and actual render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-sculpt03-local-topology-${{ github.sha }}
          path: |
            assets/candidates/morwen-sculpt03/
            qa_output/morwen-sculpt03/review/
            docs/qa/morwen-sculpt03/
          retention-days: 14
          if-no-files-found: error

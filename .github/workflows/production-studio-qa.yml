name: Production Studio QA
on:
  pull_request:
    paths:
      - 'tools/production-studio/**'
      - '.github/workflows/production-studio-qa.yml'
permissions:
  contents: read
concurrency:
  group: studio-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/production-studio
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          paths=subprocess.check_output(['git','diff','--name-only','-z',os.environ['BASE_SHA']+'...'+os.environ['HEAD_SHA']]).decode().split('\0')
          paths=[p for p in paths if p]
          allowed={'.github/workflows/production-studio-qa.yml','.github/workflows/production-studio-sync-preview.yml','.github/workflows/production-studio-prepare-pages.yml','.github/workflows/production-studio-publish.yml','.github/workflows/production-studio-discovery-audit.yml'}
          bad=[p for p in paths if not (p.startswith('tools/production-studio/') or p in allowed)]
          assert not bad,bad
          print('PASS: complete PR scope',len(paths),'files')
          PY
      - name: Retention and Python preflight
        run: |
          python -m py_compile artifact-sync.py retention.py test_retention.py test_selection_pins.py discover-gallery.py merge-gallery.py
          python -m unittest -v test_retention test_selection_pins
          python -m py_compile pack_review_images.py test_pack_review_images.py
          python -m unittest -v test_pack_review_images
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Verify live production metadata refresh
        run: node --test test_recent_review_artifacts.cjs
      - run: node studio-smoke.mjs
      - name: Verify local audio comparison and playback
        run: node audio-compare-smoke.mjs
      - name: Verify live WIP and mobile touch navigation
        run: node live-wip-smoke.mjs
      - name: Verify committed Pages files
        run: STUDIO_ROOT="$PWD" node gallery-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-qa
          path: |
            tools/production-studio/qa-output/
            tools/production-studio/gallery-qa/
          if-no-files-found: warn
      - name: Stage isolated browser distribution
        run: |
          mkdir -p dist
          cp index.html studio.css studio-ux.css studio.js handoff-readiness.js model-inspector.js model-viewer.js artifact-verify.js zip-preview.js gallery-sync.js recent-review-artifacts.js audio-compare.js gallery-manifest.json README.md dist/
          cp -r vendor published dist/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > distribution-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-browser-distribution
          path: |
            tools/production-studio/dist/
            tools/production-studio/distribution-sha256.txt
          if-no-files-found: error

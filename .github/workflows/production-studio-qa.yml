name: Production Studio QA
on:
  pull_request:
    paths:
      - 'tools/production-studio/**'
      - '.github/workflows/production-studio-qa.yml'
permissions:
  contents: read
concurrency:
  group: studio-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/production-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node studio-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-qa
          path: tools/production-studio/qa-output/
          if-no-files-found: warn
      - name: Stage isolated browser distribution
        run: |
          mkdir -p dist/node_modules/three
          cp index.html studio.css studio.js model-inspector.js model-viewer.js artifact-verify.js zip-preview.js README.md dist/
          cp -r node_modules/three/build node_modules/three/examples dist/node_modules/three/
          cp node_modules/three/LICENSE dist/node_modules/three/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > distribution-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-browser-distribution
          path: |
            tools/production-studio/dist/
            tools/production-studio/distribution-sha256.txt
          if-no-files-found: error

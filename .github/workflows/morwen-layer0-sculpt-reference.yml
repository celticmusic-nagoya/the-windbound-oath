name: Morwen Layer 0 packed Blender sculpt reference scene
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths:
      - .github/workflows/morwen-layer0-sculpt-reference.yml
      - tools/morwen_authored_sculpt/build_layer0_reference_scene.py
      - tools/production_qa/install_blender_530.sh
      - tools/morwen_authored_sculpt/build_face_surface_530.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/morwen-layer0-sculpt-reference.yml
      - tools/morwen_authored_sculpt/build_layer0_reference_scene.py
permissions:
  contents: read
jobs:
  build-reference-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify source PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin feature/morwen-rebuild-01
          mkdir -p /tmp/morwen-ref
          for n in 7809 7807 7810 7808; do
            git show FETCH_HEAD:tools/blender/production_mesh_08/references/${n}.png > /tmp/morwen-ref/${n}.png
          done
          echo 'b0a5d9f6c77c4a73a9f8bcca3dd2d8acad62403f374e04ebb2b0cb9b1b1199ed  /tmp/morwen-ref/7809.png' | sha256sum -c -
          echo '9f4873cf331f55b72510159412bd0bfc4c606499f792626e03cffcdace7bf737  /tmp/morwen-ref/7807.png' | sha256sum -c -
          echo 'b9d6d6667be8d9bbed1538a42cbaea0e51bab68371366962e43463fbe394976f  /tmp/morwen-ref/7810.png' | sha256sum -c -
          echo '69f23ce23cf9c56228e1e4d9a23fbab6b6607456a35239c853718a84da2298fa  /tmp/morwen-ref/7808.png' | sha256sum -c -
      - name: Install pinned Blender 5.2.4
        run: bash tools/production_qa/install_blender_524.sh /tmp/two-blender/app
      - name: Create and reopen packed reference blend
        shell: bash
        run: |
          set -euo pipefail
          /tmp/two-blender/app/blender -b --factory-startup --python tools/morwen_authored_sculpt/build_layer0_reference_scene.py -- /tmp/morwen-ref /tmp/morwen-ref-out
          /tmp/two-blender/app/blender -b /tmp/morwen-ref-out/morwen_layer0_sculpt_reference_setup.blend --python-expr "import bpy; assert len([o for o in bpy.data.objects if o.type=='MESH'])==0; assert len([o for o in bpy.data.objects if o.type=='EMPTY' and o.data])==4; assert all(o.data.packed_file for o in bpy.data.objects if o.type=='EMPTY' and o.data)"
          sha256sum /tmp/morwen-ref-out/morwen_layer0_sculpt_reference_setup.blend > /tmp/morwen-ref-out/SHA256SUMS
      - name: Install verified Blender 5.3.0 independently
        run: bash tools/production_qa/install_blender_530.sh /tmp/two-blender-530/app
      - name: Verify packed canonical Layer 0 reference opens in Blender 5.3.0
        shell: bash
        run: |
          set -euo pipefail
          /tmp/two-blender-530/app/blender -b /tmp/morwen-ref-out/morwen_layer0_sculpt_reference_setup.blend --python-exit-code 1 --python-expr '
          import bpy,hashlib,json,pathlib
          expected={"REF_FRONT":"b0a5d9f6c77c4a73a9f8bcca3dd2d8acad62403f374e04ebb2b0cb9b1b1199ed","REF_RIGHT":"9f4873cf331f55b72510159412bd0bfc4c606499f792626e03cffcdace7bf737","REF_BACK":"b9d6d6667be8d9bbed1538a42cbaea0e51bab68371366962e43463fbe394976f","REF_LEFT":"69f23ce23cf9c56228e1e4d9a23fbab6b6607456a35239c853718a84da2298fa"}
          assert tuple(bpy.app.version)==(5,3,0)
          for name,sha in expected.items():
           ob=bpy.data.objects.get(name)
           assert ob and ob.type=="EMPTY" and ob.data and ob.data.packed_file
           assert ob.get("source_sha256")==sha
           assert tuple(ob.data.size)==(384,1024)
          assert not any(o.type=="MESH" for o in bpy.data.objects)
          out=pathlib.Path("/tmp/morwen-ref-out")
          (out/"blender530_reference_compat_qa.json").write_text(json.dumps({"blender":bpy.app.version_string,"canonical_reference_count":4,"mesh_count":0,"status":"REFERENCE_ONLY_COMPAT_PASS_NOT_SCULPT"},indent=2))
          print("MORWEN_LAYER0_BLENDER_530_REFERENCE_PASS")
          '
      - name: Create editable new quad-grid facial sculpt candidate in Blender 5.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/morwen_authored_sculpt/build_face_surface_530.py
          /tmp/two-blender-530/app/blender -b --factory-startup --python-exit-code 1 --python tools/morwen_authored_sculpt/build_face_surface_530.py -- /tmp/morwen-ref-out/morwen_layer0_sculpt_reference_setup.blend /tmp/morwen-face-out
          test -s /tmp/morwen-face-out/morwen_face_surface_530_candidate.blend
          test -s /tmp/morwen-face-out/face_front.png
          test -s /tmp/morwen-face-out/face_right.png
          test -s /tmp/morwen-face-out/face_three_quarter.png
          /tmp/two-blender-530/app/blender -b /tmp/morwen-face-out/morwen_face_surface_530_candidate.blend --python-exit-code 1 --python-expr 'import bpy; assert bpy.data.objects.get("MORWEN_FACE_PLANES_CANDIDATE_NOT_ADOPTED"); print("MORWEN_NEW_FACE_REOPEN_PASS")'
      - name: Upload actual editable facial study and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-530-new-face-surface-study-unapproved
          path: /tmp/morwen-face-out/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Blender source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-layer0-packed-reference-blend
          path: /tmp/morwen-ref-out/
          retention-days: 14
          if-no-files-found: warn

name: Morwen canonical silhouette reference audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/character_blender/audit_morwen_reference_silhouette.py'
      - '.github/workflows/morwen-reference-silhouette-audit.yml'
permissions:
  contents: read
jobs:
  reference-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image metadata reader
        run: python -m pip install 'Pillow==11.3.0'
      - name: Validate source hashes and measure Layer0 alpha silhouettes
        run: python tools/character_blender/audit_morwen_reference_silhouette.py "$RUNNER_TEMP/morwen_reference_silhouette_audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-canonical-silhouette-reference-audit
          path: ${{ runner.temp }}/morwen_reference_silhouette_audit.json
          retention-days: 14
          if-no-files-found: warn

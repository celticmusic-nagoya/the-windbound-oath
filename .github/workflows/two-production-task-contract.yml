name: TWO production task contract
on:
  pull_request:
    paths:
      - 'tools/qa/two_task_*.py'
      - '.github/workflows/two-production-task-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: key
        run: |
          python3 -m unittest discover -s tools/qa -p 'two_task_*.py' -v
          python3 - <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/qa')
          from two_task_key import task_key
          paths = sorted(str(p) for p in Path('tools/qa').glob('two_task_*.py'))
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          workflow = Path('.github/workflows/two-production-task-contract.yml')
          key = task_key(dict(asset='production-os', stage='contract-test', method='stdlib', inputs=hashes, toolchain={'python': hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest()}, settings={'workflow': hashlib.sha256(workflow.read_bytes()).hexdigest()}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('key=' + key + '\n')
          PY
  serialized-contract:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: two-production-task-${{ needs.identity.outputs.key }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/qa -p 'two_task_*.py' -v

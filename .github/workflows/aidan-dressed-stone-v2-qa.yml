name: Aidan Dressed Stone V2 QA
on:
  push:
    branches: [feature/aidan-architecture-v3-01]
    paths:
      - 'tools/map_blender/aidan_dressed_stone_v2.py'
      - 'tools/map_blender/aidan_dressed_stone_v2_qa.py'
      - '.github/workflows/aidan-dressed-stone-v2-qa.yml'
  pull_request:
    branches: [feature/aidan-roof-geometry-01]
    paths:
      - 'tools/map_blender/aidan_dressed_stone_v2.py'
      - 'tools/map_blender/aidan_dressed_stone_v2_qa.py'
      - '.github/workflows/aidan-dressed-stone-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dressed-stone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile tools/map_blender/aidan_dressed_stone_v2.py tools/map_blender/aidan_dressed_stone_v2_qa.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb libegl1 libgl1-mesa-dri libglx-mesa0
          blender --version
      - name: Generate and verify dressed stone candidates
        env:
          AIDAN_DRESSED_OUTPUT: ${{ runner.temp }}/aidan-dressed-qa
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_dressed_stone_v2_qa.py 2>&1 | tee dressed-stone.log
          test -s "${AIDAN_DRESSED_OUTPUT}/manifest.json"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path(os.environ["AIDAN_DRESSED_OUTPUT"])
          m=json.loads((p/"manifest.json").read_text())
          assert m["status"]=="CANDIDATE_NOT_ART_APPROVED"
          assert len(m["samples"])==3
          assert all(x["volume_m3"]>0 for x in m["samples"])
          assert hashlib.sha256((p/m["image"]).read_bytes()).hexdigest()==m["sha256"]
          print("PASS: independent geometry and image checks, art not approved")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-dressed-stone-v2-candidate
          path: |
            ${{ runner.temp }}/aidan-dressed-qa/
            dressed-stone.log
          if-no-files-found: warn
          retention-days: 7

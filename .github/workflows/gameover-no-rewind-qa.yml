name: GAMEOVER-01 no-rewind QA
on:
  pull_request:
    paths:
      - 'js/gameover-policy.js'
      - 'js/gameover-screen.js'
      - 'js/prologue-combat.js'
      - 'js/battle-loading.js'
      - 'js/title-screen.js'
      - 'index.html'
      - 'tests/gameover-*.js'
      - 'tests/gameover-*.cjs'
      - '.github/workflows/gameover-no-rewind-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/gameover-policy.js
          node --check js/gameover-screen.js
          node --check js/prologue-combat.js
          node --check js/battle-loading.js
      - name: Defeat policy and integration regression
        run: node --test tests/gameover-policy.test.js tests/gameover-no-rewind.test.cjs tests/gameover-title-return.test.js

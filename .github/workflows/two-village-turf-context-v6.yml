name: TWO isolated village conforming turf V6
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tools/map_blender/lind/home/village_turf_context_v6.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-village-turf-context-v6
  cancel-in-progress: false
jobs:
  context:
    if: github.event.pull_request.number == 364 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/map_blender/lind/home/village_turf_context_v6.py
      - uses: actions/checkout@v4
        with:
          ref: dd47929f3e100b3cfcabbe48a614e699da1c5ea9
          path: engine
          persist-credentials: false
          sparse-checkout: |
            tools/blueprint_engine
            tools/production_qa
      - name: Restore exact V5 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v5" "$RUNNER_TEMP/out"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15099170569/zip" > "$RUNNER_TEMP/v5.zip"
          printf '%s  %s\n' 3d0784759920c2b6a8249351d128ba3ce1dc635d41544349829c1591577f234b "$RUNNER_TEMP/v5.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/v5.zip"
          unzip -q "$RUNNER_TEMP/v5.zip" -d "$RUNNER_TEMP/v5"
          python3 -m py_compile 'tools/map_blender/lind/home/village_turf_context_v6.py'
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash engine/tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 --python 'tools/map_blender/lind/home/village_turf_context_v6.py' -- "$RUNNER_TEMP/v5/village_home_context_v5_UNAPPROVED.blend" "$RUNNER_TEMP/out" "$PWD/engine"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-village-turf-context-v6
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14
  cliff-readback:
    if: github.event.pull_request.number == 364 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read existing ridge push evidence without dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cliff"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=6e477b8c07d82c54a0f551486d7eb6b8c9207dbc&per_page=100" --jq '[.workflow_runs[]|{id,name,event,status,conclusion,head_sha,html_url}]' > "$RUNNER_TEMP/cliff/runs.json"
          python3 - "$RUNNER_TEMP/cliff" <<'PY'
          import json,sys,subprocess,os
          from pathlib import Path
          p=Path(sys.argv[1]); runs=json.loads((p/'runs.json').read_text())
          for r in runs:
              if 'two-cliff-ridge-v3' not in r['name']:continue
              result=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{r['id']}/artifacts"])
              (p/f"artifacts-{r['id']}.json").write_bytes(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: two-cliff-ridge-push-readback
          path: ${{ runner.temp }}/cliff
          if-no-files-found: error
          retention-days: 7

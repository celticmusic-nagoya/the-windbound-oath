name: LIND Independent Oriented OBJ Topology Gate
on:
  pull_request:
    paths:
      - 'tools/map_blender/lind/validate_oriented_cliff_obj.py'
      - '.github/workflows/lind-oriented-cliff-obj-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oriented-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Generate existing macro OBJ unchanged
        run: |
          python3 -m py_compile tools/map_blender/lind/validate_oriented_cliff_obj.py
          python3 tools/map_blender/lind/build_cliff_macro_topology_stdlib.py --out out/lind-oriented-qa
      - name: Independently check orientation, volume and connectedness
        run: |
          python3 tools/map_blender/lind/validate_oriented_cliff_obj.py --obj out/lind-oriented-qa/lind_macro_support_normalized.obj --out out/lind-oriented-qa/oriented_metrics.json
      - name: Upload diagnostics including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lind-oriented-obj-qa
          path: out/lind-oriented-qa/
          retention-days: 14

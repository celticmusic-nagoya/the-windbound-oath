name: Morwen Rig Source Metadata QA
on:
  pull_request:
    paths:
      - 'data/morwen-design-canonical.json'
      - 'scripts/qa_morwen_rig_source.py'
      - 'tests/test_qa_morwen_rig_source.py'
      - '.github/workflows/morwen-rig-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_qa_morwen_rig_source.py' -v
      - name: Canon metadata gate
        run: python scripts/qa_morwen_rig_source.py

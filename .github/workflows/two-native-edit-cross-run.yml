name: Shared measurable native edit cross-run qualification
on:
  push:
    branches: [infra/shared-native-session-20261122]
    paths: [tools/production_qa/native_edit_qa/phase.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: two-native-edit-cross-run
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: tools/production_qa
      PULSE_SERVER: unix:/tmp/two-no-pulse-socket
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/production_qa
      - name: Resume fixed checkpoint on private Git transport
        if: github.event_name == 'push' && github.ref == 'refs/heads/infra/shared-native-session-20261122'
        env:
          TWO_CHECKPOINT_TOKEN: ${{ secrets.TWO_CHECKPOINT_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          phase=tools/production_qa/native_edit_qa/phase.json
          if [[ "$(jq -er .mode "$phase")" != shared-resume ]]; then exit 0; fi
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = celticmusic-nagoya/the-windbound-oath
          test -n "$TWO_CHECKPOINT_TOKEN"
          root="$RUNNER_TEMP/two-native"
          mkdir -p "$root/work"
          env -u TWO_CHECKPOINT_TOKEN bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/two-blender"
          export BLENDER_530="$RUNNER_TEMP/two-blender/blender"
          export PYTHONPATH="$GITHUB_WORKSPACE/tools/production_qa"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=''
          export GIT_CONFIG_KEY_1=credential.https://github.com/celticmusic-nagoya/the-windbound-oath-handoff.git.helper
          export GIT_CONFIG_VALUE_1='!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$TWO_CHECKPOINT_TOKEN"; fi; }; f'
          git -C "$root/work" init -q
          git -C "$root/work" config user.email qa@example.invalid
          git -C "$root/work" config user.name 'Shared qualification'
          cd "$root/work"
          python "$PYTHONPATH/native_edit_qa/run_qa.py" shared-resume "$root"
      - name: Execute one isolated qualification phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          repo="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo" --jq .visibility)" = public
          phase=tools/production_qa/native_edit_qa/phase.json
          mode=$(jq -er .mode "$phase")
          if [[ "$mode" == shared-resume ]]; then exit 0; fi
          root="$RUNNER_TEMP/two-native"
          mkdir -p "$root" "$root/work"
          if [[ "$mode" == restore ]]; then
            test "$(jq -r .resume_pending "$phase")" = true
            export TWO_RESUME_PENDING=1
            id=$(jq -er .artifact "$phase")
            run=$(jq -er .run "$phase")
            digest=$(jq -er .sha256 "$phase")
            test "$(gh api "$repo/actions/artifacts/$id" --jq '[.workflow_run.id,.expired,.digest]|@tsv')" = "$(printf '%s\tfalse\tsha256:%s' "$run" "$digest")"
            gh api "$repo/actions/artifacts/$id/zip" > "$root/in.zip" 2>/dev/null
            echo "$digest  $root/in.zip" | sha256sum -c
            unzip -p "$root/in.zip" checkpoint.bundle > "$root/checkpoint.bundle"
            unzip -p "$root/in.zip" seed.json > "$root/seed.json"
          else
            test "$mode" = seed
          fi
          bash tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/two-blender"
          export BLENDER_530="$RUNNER_TEMP/two-blender/blender"
          export PYTHONPATH="$GITHUB_WORKSPACE/tools/production_qa"
          git -C "$root/work" init -q
          git -C "$root/work" config user.email qa@example.invalid
          git -C "$root/work" config user.name 'Shared qualification'
          cd "$root/work"
          python "$GITHUB_WORKSPACE/tools/production_qa/native_edit_qa/run_qa.py" "$mode" "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: two-measurable-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/two-native/*.json
            ${{ runner.temp }}/two-native/*.bundle
            ${{ runner.temp }}/two-native/factory-*/preview.png
          if-no-files-found: error

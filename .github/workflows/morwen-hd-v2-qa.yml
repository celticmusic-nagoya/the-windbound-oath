name: Morwen HD canonical v2 QA
on:
  pull_request:
    paths:
      - 'assets/official/characters/morwen/hd-v2/**'
      - 'data/morwen-hd-canonical-v2.json'
      - 'js/field/morwen-hd-canonical.js'
      - 'dev/morwen-hd-v2-preview/**'
      - 'scripts/qa_morwen_hd_v2.py'
      - 'tests/field/morwen_hd_canonical.test.js'
      - '.github/workflows/morwen-hd-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0 numpy
      - run: python scripts/qa_morwen_hd_v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/field/morwen_hd_canonical.test.js

          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/tools/production_qa/morwen_rebuild_trial.py?ref=41ce803f607dca8744e15c45f1c671ee69c6bea3" > "$RUNNER_TEMP/skirt-recipe.py"

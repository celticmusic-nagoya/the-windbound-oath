          cat > "$RUNNER_TEMP/skirt-verify.py" <<'PY'
          import hashlib,struct,zlib,sys
          from pathlib import Path
          b=Path(sys.argv[1]).read_bytes()
          assert b[:8]==b'\x89PNG\r\n\x1a\n' and len(b)<64_000_000
          pos=8; ids=[]; hdr=None; end=False
          while pos<len(b):
              n=struct.unpack('>I',b[pos:pos+4])[0]; tag=b[pos+4:pos+8]; d=b[pos+8:pos+8+n]
              assert len(d)==n and zlib.crc32(tag+d)==struct.unpack('>I',b[pos+8+n:pos+12+n])[0]
              pos+=12+n
              if tag==b'IHDR':
                  assert hdr is None;hdr=struct.unpack('>IIBBBBB',d)
                  assert hdr==(1024,512,8,6,0,0,0),hdr
              elif tag==b'IDAT':ids.append(d)
              elif tag==b'IEND':end=True;break
          assert hdr and ids and end and pos==len(b)
          stride=4096; expect=(stride+1)*512
          dec=zlib.decompressobj();raw=dec.decompress(b''.join(ids),expect+1)
          assert len(raw)==expect and dec.eof and not dec.unused_data and not dec.unconsumed_tail
          prev=bytearray(stride);out=[]
          for y in range(512):
              start=y*(stride+1);f=raw[start];row=bytearray(raw[start+1:start+1+stride]);assert f<=4
              for i in range(stride):
                  a=row[i-4] if i>=4 else 0;b=prev[i];c=prev[i-4] if i>=4 else 0
                  if f==1:q=a
                  elif f==2:q=b
                  elif f==3:q=(a+b)//2
                  elif f==4:

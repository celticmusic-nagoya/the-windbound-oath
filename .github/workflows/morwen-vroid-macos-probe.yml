name: Morwen VRoid macOS compatibility probe
on:
  workflow_dispatch:
    inputs:
      poll_probe:
        description: Read-only two-command reception test in the same macOS job
        type: boolean
        default: false
      native_probe:
        description: Disposable iris control qualification and bounded framing survey (not artistic correction)
        type: boolean
        default: false
      frame_probe:
        description: Read-only framing recovery from default camera; no edit or repeated iris test
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: morwen-vroid-macos-probe
  cancel-in-progress: false
jobs:
  reopen:
    if: github.repository == 'celticmusic-nagoya/the-windbound-oath' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb
          persist-credentials: false
      - name: Record checkout and compile existing GUI controls
        env:
          NATIVE_PROBE: ${{ inputs.native_probe }}
          FRAME_PROBE: ${{ inputs.frame_probe }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$NATIVE_PROBE" = true ] && [ "$FRAME_PROBE" = true ]; then exit 1; fi
          mkdir -p evidence
          git rev-parse HEAD > evidence/checkout-sha.txt
          grep -qx 3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb evidence/checkout-sha.txt
          bash -n tools/production_qa/morwen_readonly_capture.sh
          if grep -nF '\\n' tools/production_qa/morwen_readonly_capture.sh; then
            echo 'BLOCKED_MALFORMED_CHECKSUM_ESCAPE' >&2
            exit 1
          fi
          bash -n tools/production_qa/morwen_vroid_session.sh
          swiftc tools/production_qa/macos_gui.swift -o "$RUNNER_TEMP/two-gui"
          if [ "$NATIVE_PROBE" = true ] || [ "$FRAME_PROBE" = true ]; then
          cat > "$RUNNER_TEMP/face-row.swift" <<'SWIFT'
          import Foundation
          import Vision
          import AppKit
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = false
          let args = CommandLine.arguments
          try VNImageRequestHandler(url: URL(fileURLWithPath: args[1])).perform([request])
          let rows = request.results ?? []
          let labels = rows.filter {
              $0.boundingBox.minX > 0.71 && $0.boundingBox.midX < 0.91
                  && $0.topCandidates(1).first?.string
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                      .range(of: args[2], options: [.regularExpression, .caseInsensitive]) != nil
          }
          guard labels.count == 1, let label = labels.first else { exit(2) }
          let fields = rows.filter {
              $0.boundingBox.midX > 0.92
                  && abs($0.boundingBox.midY - label.boundingBox.midY) < 0.018
                  && $0.topCandidates(1).first?.string.range(
                      of: #"^[−-]?\d+\.\d{3}$"#, options: .regularExpression
                  ) != nil
          }
          guard fields.count == 1, let field = fields.first,
                let value = field.topCandidates(1).first?.string else { exit(2) }
          let png = try Data(contentsOf: URL(fileURLWithPath: args[1]))
          guard let image = NSBitmapImageRep(data: png) else { exit(2) }
          let w = image.pixelsWide, h = image.pixelsHigh
          let fieldY = 1 - field.boundingBox.midY
          let expectedY = Int(fieldY * Double(h)) + Int(Double(h) * 0.031)
          guard expectedY >= 9, expectedY + 9 < h else { exit(2) }
          var xs: [Int] = [], ys: [Int] = []
          for y in (expectedY - 9)...(expectedY + 9) {
              for x in Int(Double(w) * 0.72)...Int(Double(w) * 0.981) {
                  guard let c = image.colorAt(x: x, y: y)?.usingColorSpace(NSColorSpace.deviceRGB) else { continue }
                  if c.blueComponent > 0.78 && c.redComponent < 0.22
                      && c.greenComponent > 0.30 && c.greenComponent < 0.82 {
                      xs.append(x)
                      ys.append(y)
                  }
              }
          }
          guard let minX = xs.min(), let maxX = xs.max(), maxX - minX <= 35,
                let minY = ys.min(), let maxY = ys.max() else { exit(2) }
          print(value.replacingOccurrences(of: "−", with: "-"),
                Double(minX + maxX) / (2 * Double(w)),
                Double(minY + maxY) / (2 * Double(h)))
          SWIFT
          swiftc "$RUNNER_TEMP/face-row.swift" -o "$RUNNER_TEMP/face-row"
          cat > "$RUNNER_TEMP/frame-margin.swift" <<'SWIFT'
          import Cocoa
          import Foundation
          guard let image = NSBitmapImageRep(data: try Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))),
                image.pixelsWide == 1024, image.pixelsHigh == 768 else { exit(2) }
          let x0 = 298, x1 = 725, y0 = 104, y1 = 705
          var xmin = x1, xmax = x0, ymin = y1, ymax = y0, count = 0
          for y in y0...y1 {
              for x in x0...x1 {
                  guard let c = image.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { exit(2) }
                  let v = [c.redComponent, c.greenComponent, c.blueComponent].map { $0 * 255 }
                  if v.max()! - v.min()! > 18 || v.reduce(0,+)/3 < 205 {
                      xmin = min(xmin,x); xmax = max(xmax,x); ymin = min(ymin,y); ymax = max(ymax,y); count += 1
                  }
              }
          }
          let margin = min(xmin-x0,x1-xmax,ymin-y0,y1-ymax)
          print("bbox", xmin, ymin, xmax, ymax, "foreground_pixels", count, "margin", margin)
          // Foreground heuristic only; independent review of orientation and body crop required.
          exit(count >= 1500 && ymax-ymin >= 120 && margin >= 12 ? 0 : 1)
          SWIFT
          swiftc "$RUNNER_TEMP/frame-margin.swift" -o "$RUNNER_TEMP/frame-margin"
          fi
      - name: Restore native checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Resume the indexed face checkpoint; fail closed on unavailable or expired artifact.
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14729674867" --jq 'select(.expired == false) | .id' | grep -qx 14729674867
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14729674867/zip" > "$RUNNER_TEMP/checkpoint.zip"
          echo "08cd55927436dc25d8bfb3ec01c620a43b19976bb577f0d4433fb483121241dc  $RUNNER_TEMP/checkpoint.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os, zipfile, pathlib, hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"checkpoint.zip") as z:
              item=z.getinfo("model.vroid")
              assert 0 < item.file_size < 100_000_000
              data=z.read(item)
              assert hashlib.sha256(data).hexdigest()=="9aba397dc080af510cc299cde1459accc83f468fa6bfa139229fe7e720887574"
              (p/"Morwen-resume.vroid").write_bytes(data)
          PY
      - name: Download official DMG and inspect signature
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/vroid.dmg" ]; then
            curl --fail --location --proto '=https' --max-time 420 --output "$RUNNER_TEMP/vroid.dmg" 'https://download.vroid.com/dist/2cbXSb76Bf/VRoidStudio-v2.16.0-mac.dmg'
          fi
          shasum -a 256 "$RUNNER_TEMP/vroid.dmg" | tee evidence/dmg-sha256.txt
          echo "d3d8900b6397e9ed7cea640c679b07dfff011eb9fc393533e26419f5fcf546f6  $RUNNER_TEMP/vroid.dmg" | shasum -a 256 -c
          hdiutil verify "$RUNNER_TEMP/vroid.dmg" > evidence/dmg-verify.txt 2>&1
          mkdir -p "$RUNNER_TEMP/vroid-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/vroid-mount" "$RUNNER_TEMP/vroid.dmg"
          app="$(find "$RUNNER_TEMP/vroid-mount" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app" > evidence/signature-verify.txt 2>&1
          codesign -dv --verbose=4 "$app" > evidence/signature-details.txt 2>&1
          spctl --assess --type execute -vv "$app" > evidence/gatekeeper.txt 2>&1
          ditto "$app" "$RUNNER_TEMP/VRoidStudio.app"
          hdiutil detach "$RUNNER_TEMP/vroid-mount"
      - name: Launch signed application and collect evidence
        timeout-minutes: 22
        env:
          NATIVE_PROBE: ${{ inputs.native_probe }}
          FRAME_PROBE: ${{ inputs.frame_probe }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/VRoidStudio.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist" > evidence/version.txt
          exe="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          file "$app/Contents/MacOS/$exe" > evidence/binary.txt
          test "$(uname -m)" = arm64
          # LaunchServices registers the app with the GUI session.
          stat -f '%Su' /dev/console > evidence/console-user.txt
          open -a "$app" --args -logFile "$RUNNER_TEMP/vroid-player.log"
          sleep 15
          osascript -e "tell application id \"net.pixiv.vroid.macosx\" to activate" > evidence/activate.txt 2>&1 || true
          sleep 45
          screencapture -x evidence/screen-60s.png || true
          sleep 30
          # Finder-only startup is not an editor failure; bounded activation recovery.
          if ! osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true' | grep -qi VRoid; then
            osascript -e 'tell application id "net.pixiv.vroid.macosx" to activate' || true
            sleep 20
          fi
          # Verify the welcome screen text before issuing a bounded input event.
          swift -e 'import Cocoa; import CoreGraphics; print(CGPreflightPostEventAccess()); print(CGDisplayPixelsWide(CGMainDisplayID()), CGDisplayPixelsHigh(CGMainDisplayID()))' > evidence/input-access.txt 2>&1
          screencapture -x evidence/before-input.png
          swift -e 'import Vision; import Foundation; let r = VNRecognizeTextRequest(); try VNImageRequestHandler(url:URL(fileURLWithPath:CommandLine.arguments[1])).perform([r]); for o in r.results ?? [] { print(o.topCandidates(1).first?.string ?? "") }' evidence/before-input.png > evidence/welcome-text.txt
          if grep -qx true evidence/input-access.txt && grep -qx '1024 768' evidence/input-access.txt && grep -Fxq 'Get Started' evidence/welcome-text.txt; then
            swift -e 'import CoreGraphics; import Foundation; let p = CGPoint(x:512,y:578); let s = CGEventSource(stateID:.combinedSessionState); CGEvent(mouseEventSource:s,mouseType:.mouseMoved,mouseCursorPosition:p,mouseButton:.left)?.post(tap:.cgSessionEventTap); usleep(500000); for t in [CGEventType.leftMouseDown,.leftMouseUp] { if let e = CGEvent(mouseEventSource:s,mouseType:t,mouseCursorPosition:p,mouseButton:.left) { e.setIntegerValueField(.mouseEventClickState,value:1); e.post(tap:.cgSessionEventTap) }; usleep(250000) }'
            sleep 20
            screencapture -x evidence/after-get-started.png
            if cmp -s evidence/before-input.png evidence/after-get-started.png; then
              echo NO_SCREEN_CHANGE > evidence/gui-action.txt
            else
              echo SCREEN_CHANGED_REVIEW_REQUIRED > evidence/gui-action.txt
            fi
          else
            echo INPUT_ACCESS_OR_DISPLAY_BLOCKED > evidence/gui-action.txt
          fi
          # Director explicitly authorized the agreement on 2026-11-20.
          if [ -s evidence/after-get-started.png ] && grep -qx true evidence/input-access.txt; then
            swift -e 'import Vision; import Foundation; import CoreGraphics; let r = VNRecognizeTextRequest(); try VNImageRequestHandler(url:URL(fileURLWithPath:CommandLine.arguments[1])).perform([r]); let a = r.results ?? []; let strings = a.compactMap { $0.topCandidates(1).first?.string }; print(strings.joined(separator:" | ")); guard strings.contains(where:{$0.contains("Terms of Use")}), strings.contains(where:{$0.contains("Privacy Policy")}), strings.contains(where:{$0.contains("Guidelines")}), let o = a.first(where:{$0.topCandidates(1).first?.string == "Agree"}) else { print("AGREEMENT_SCREEN_NOT_VERIFIED"); exit(0) }; let p = CGPoint(x:o.boundingBox.midX * CGFloat(CGDisplayPixelsWide(CGMainDisplayID())),y:(1-o.boundingBox.midY)*CGFloat(CGDisplayPixelsHigh(CGMainDisplayID()))); let s = CGEventSource(stateID:.combinedSessionState); CGEvent(mouseEventSource:s,mouseType:.mouseMoved,mouseCursorPosition:p,mouseButton:.left)?.post(tap:.cgSessionEventTap); usleep(500000); for t in [CGEventType.leftMouseDown,.leftMouseUp] { if let e = CGEvent(mouseEventSource:s,mouseType:t,mouseCursorPosition:p,mouseButton:.left) { e.setIntegerValueField(.mouseEventClickState,value:1); e.post(tap:.cgSessionEventTap) }; usleep(250000) }; print("AGREEMENT_CLICK_SENT_REVIEW_REQUIRED")' evidence/after-get-started.png > evidence/agreement-status.txt
            sleep 25
            screencapture -x evidence/after-agreement.png
          fi
          cat > "$RUNNER_TEMP/vroid-click.swift" <<'SWIFT'
          import Vision
          import Foundation
          import CoreGraphics
          let r = VNRecognizeTextRequest()
          try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1])).perform([r])
          let a = r.results ?? []
          let labels = a.compactMap { $0.topCandidates(1).first?.string }
          print(labels.joined(separator:" | "))
          guard labels.contains(where:{$0.contains(CommandLine.arguments[3])}), let o = a.first(where:{ let t = $0.topCandidates(1).first?.string.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""; return t == CommandLine.arguments[2] || (CommandLine.arguments[2] == "Open" && t == "• Open") }) else { print("SCREEN_NOT_VERIFIED"); exit(2) }
          let d = CGDisplayBounds(CGMainDisplayID())
          let offset: CGFloat = CommandLine.arguments[2] == "Fem" ? -116 : 0
          let p = CGPoint(x:d.minX + o.boundingBox.midX*d.width,y:d.minY+(1-o.boundingBox.midY)*d.height+offset*d.height/768)
          let s = CGEventSource(stateID:.combinedSessionState)
          CGEvent(mouseEventSource:s,mouseType:.mouseMoved,mouseCursorPosition:p,mouseButton:.left)?.post(tap:.cgSessionEventTap)
          usleep(500000)
          for t in [CGEventType.leftMouseDown,.leftMouseUp] { if let e = CGEvent(mouseEventSource:s,mouseType:t,mouseCursorPosition:p,mouseButton:.left) { e.setIntegerValueField(.mouseEventClickState,value:1); e.post(tap:.cgSessionEventTap) }; usleep(250000) }
          SWIFT
          # Preserve immutable input before attempting any GUI action.
          cp "$RUNNER_TEMP/Morwen-resume.vroid" evidence/input-model.vroid
          shasum -a 256 evidence/input-model.vroid > evidence/input-model-sha256.txt
          echo NATIVE_REOPEN_NOT_VERIFIED > evidence/reopen-status.txt
          gui="$RUNNER_TEMP/two-gui"
          capture_state() {
            "$gui" screenshot "evidence/$1.png" && "$gui" ocr "evidence/$1.png" > "evidence/$1.txt"
          }
          dialog_visible() {
            grep -Eiq 'Cancel' "evidence/$1.txt" && grep -Eiq 'Open|Choose' "evidence/$1.txt"
          }
          mkdir -p "$HOME/Documents"
          test ! -e "$HOME/Documents/Morwen-resume.vroid"
          cp "$RUNNER_TEMP/Morwen-resume.vroid" "$HOME/Documents/Morwen-resume.vroid"
          cmp "$RUNNER_TEMP/Morwen-resume.vroid" "$HOME/Documents/Morwen-resume.vroid"
          chmod a-w "$HOME/Documents/Morwen-resume.vroid"
          reopen_native() {
            local attempt before after
            for attempt in 1 2 3; do
              before="home-attempt-$attempt"
              after="open-result-$attempt"
              capture_state "$before" || continue
              if dialog_visible "$before"; then return 0; fi
              if grep -Fq 'Recently Edited' "evidence/$before.txt"; then
                if [ "$attempt" -le 2 ]; then
                  "$gui" click-label "evidence/$before.png" Open 'Recently Edited' > "evidence/open-click-$attempt.txt" 2>&1 || true
                else
                  # Different method after two observations: standard macOS Open shortcut.
                  "$gui" key 31 cmd || true
                fi
              else
                # Escape is reversible; never accept an unknown dialog.
                "$gui" key 53 || true
              fi
              sleep 4
              capture_state "$after" || continue
              if dialog_visible "$after"; then return 0; fi
              if ! grep -Fq 'Recently Edited' "evidence/$after.txt"; then
                "$gui" key 53 || true
                sleep 2
                capture_state "recovery-$attempt" || true
              fi
            done
            return 1
          }
          if [ -s evidence/after-agreement.png ] && grep -qx true evidence/input-access.txt; then
            swift "$RUNNER_TEMP/vroid-click.swift" evidence/after-agreement.png Skip 'Welcome to VRoid Studio' > evidence/skip-status.txt || true
            sleep 5
            if reopen_native; then
              capture_state open-dialog
              # The observed chooser defaults to Documents; avoid clipboard and Go to Folder.
              if grep -Fqi 'Documents' evidence/open-dialog.txt; then
                "$gui" click-label evidence/open-dialog.png 'Morwen-resume.vroid' 'Cancel' > evidence/file-click.txt 2>&1 || true
                sleep 2
                capture_state open-selected
                if dialog_visible open-selected && grep -Fqi 'Morwen-resume' evidence/open-selected.txt; then
                  "$gui" key 36
                  sleep 35
                  capture_state resumed-editor
                  if grep -Eiq 'Face|Hairstyle|Body|Outfit' evidence/resumed-editor.txt && ! dialog_visible resumed-editor; then
                    echo NATIVE_REOPEN_REVIEW_REQUIRED > evidence/reopen-status.txt
                  fi
                fi
              fi
            else
              echo BLOCKED_OPEN_SCREEN_NOT_VERIFIED > evidence/reopen-status.txt
            fi
          fi
          screencapture -x evidence/final-recovery-screen.png || true
          grep -qx NATIVE_REOPEN_REVIEW_REQUIRED evidence/reopen-status.txt
          MORWEN_READONLY_NATIVE="$HOME/Documents/Morwen-resume.vroid"
          MORWEN_EXPECTED_SHA256=9aba397dc080af510cc299cde1459accc83f468fa6bfa139229fe7e720887574
          if [ "$FRAME_PROBE" = true ]; then
            test "$NATIVE_PROBE" != true
            test "$(shasum -a 256 "$MORWEN_READONLY_NATIVE" | cut -d ' ' -f1)" = "$MORWEN_EXPECTED_SHA256"
            # Avoid old rear-only zoom +25. Read-only camera moves, no saving.
            "$gui" vroid-shortcut face
            "$gui" vroid-shortcut front
            sleep 2
            echo "direction attempt action bbox_xmin bbox_ymin bbox_xmax bbox_ymax foreground margin" > evidence/frame-recovery-ledger.txt
            all=1
            for direction in front left4 left8 right4; do
              "$gui" vroid-shortcut front
              case "$direction" in
                left4) for n in 1 2 3 4; do "$gui" vroid-shortcut turn-left; done ;;
                left8) for n in 1 2 3 4 5 6 7 8; do "$gui" vroid-shortcut turn-left; done ;;
                right4) for n in 1 2 3 4; do "$gui" vroid-shortcut turn-right; done ;;
              esac
              action=default; last_y=0; pan_used=0; accepted=0
              for attempt in 0 1 2 3 4 5; do
                sleep 2
                tag="reframe-$direction-$attempt"
                capture_state "$tag"
                grep -Fq 'Morwen-resume.vroid' "evidence/$tag.txt"
                grep -Fq 'Face Sets' "evidence/$tag.txt"
                if dialog_visible "$tag"; then exit 1; fi
                result=$("$RUNNER_TEMP/frame-margin" "evidence/$tag.png") && good=1 || good=0
                read -r label xmin ymin xmax ymax foreground count margin_label margin <<< "$result"
                test "$label" = bbox && test "$margin_label" = margin || exit 1
                for value in "$xmin" "$ymin" "$xmax" "$ymax" "$count" "$margin"; do
                  [[ "$value" =~ ^[0-9]+$ ]] || exit 1
                done
                printf '%s %s %s %s %s %s %s %s %s\n' "$direction" "$attempt" "$action" "$xmin" "$ymin" "$xmax" "$ymax" "$count" "$margin" >> evidence/frame-recovery-ledger.txt
                if [ "$good" = 1 ]; then
                  cp "evidence/$tag.png" "evidence/frame-selected-$direction.png"
                  accepted=1
                  break
                fi
                [ "$attempt" -lt 5 ] || break
                # If clipped below but ample space above, move camera upward once.
                # A failed or reversed pan changes method to keyboard zoom, not repeated scrolling.
                if [ "$pan_used" = 0 ] && [ "$ymax" -ge 693 ] && [ "$ymin" -ge 235 ]; then
                  last_y="$ymin"
                  "$gui" pan 0.50 0.57 0.50 0.37 0.5
                  pan_used=1
                  action=pan_up
                elif [ "$action" = pan_up ] && [ "$ymin" -gt "$((last_y+10))" ]; then
                  "$gui" pan 0.50 0.37 0.50 0.57 0.5
                  action=undo_reversed_pan
                else
                  "$gui" vroid-shortcut zoom-out
                  action=keyboard_zoom_out
                fi
              done
              if [ "$accepted" != 1 ]; then all=0; fi
            done
            "$gui" vroid-shortcut front
            test "$(shasum -a 256 "$MORWEN_READONLY_NATIVE" | cut -d ' ' -f1)" = "$MORWEN_EXPECTED_SHA256"
            shasum -a 256 evidence/reframe-*.png > evidence/frame-recovery-sha256.txt
            if [ "$all" = 1 ]; then
              echo FOUR_MARGIN_CANDIDATES_REVIEW_REQUIRED > evidence/frame-recovery-status.txt
            else
              echo BLOCKED_MARGIN_NOT_ESTABLISHED > evidence/frame-recovery-status.txt
              exit 1
            fi
          else
            MORWEN_CAPTURE_MODE=rear-only
            source tools/production_qa/morwen_readonly_capture.sh
          fi
          if [ "$NATIVE_PROBE" = true ]; then
            row="$RUNNER_TEMP/face-row"
            sed '/^case "\$MODE" in/,$d' tools/production_qa/morwen_vroid_session.sh > "$RUNNER_TEMP/session-helpers.sh"
            bash -n "$RUNNER_TEMP/session-helpers.sh"
            source "$RUNNER_TEMP/session-helpers.sh"
            echo FRAME_MARGIN_NOT_ESTABLISHED_REVIEW_REQUIRED > evidence/frame-probe-status.txt
            for attempt in 1 2 3 4; do
              "$gui" vroid-shortcut face
              "$gui" vroid-shortcut front
              "$gui" zoom 0.50 0.42 -6 0
              sleep 2
              good=1
              for direction in front left4 left8 right4; do
                "$gui" vroid-shortcut front
                case "$direction" in
                  left4) for n in 1 2 3 4; do "$gui" vroid-shortcut turn-left; done ;;
                  left8) for n in 1 2 3 4 5 6 7 8; do "$gui" vroid-shortcut turn-left; done ;;
                  right4) for n in 1 2 3 4; do "$gui" vroid-shortcut turn-right; done ;;
                esac
                sleep 2
                tag="frame-$attempt-$direction"
                capture_state "$tag"
                if ! grep -Fq 'Morwen-resume.vroid' "evidence/$tag.txt" || ! grep -Fq 'Face Sets' "evidence/$tag.txt"; then
                  echo BLOCKED_UNKNOWN_VIEWPORT > evidence/frame-probe-status.txt
                  exit 1
                fi
                printf "%s " "$tag" >> evidence/frame-margin.txt
                "$RUNNER_TEMP/frame-margin" "evidence/$tag.png" >> evidence/frame-margin.txt || good=0
              done
              if [ "$good" = 1 ]; then
                echo "MARGIN_HEURISTIC_PASS_REVIEW_REQUIRED attempt=$attempt" > evidence/frame-probe-status.txt
                break
              fi
            done
            "$gui" vroid-shortcut front
            shasum -a 256 evidence/frame-*.png > evidence/frame-probe-sha256.txt
            test "$(shasum -a 256 "$MORWEN_READONLY_NATIVE" | cut -d ' ' -f1)" = "$MORWEN_EXPECTED_SHA256"
            face_cat "$CAT_IRIS"
            capture_state native-probe-before
            read -r initial sx sy <<< "$("$row" evidence/native-probe-before.png '^Iris Size \(X\)$')"
            read -r protected_y _ _ <<< "$("$row" evidence/native-probe-before.png '^Iris Size \(Y\)$')"
            if [ "$initial" != 0.141 ] || [ "$protected_y" != 0.194 ]; then
              echo BLOCKED_BASELINE_VALUE_MISMATCH > evidence/native-probe-status.txt
              exit 1
            fi
            chmod u+w "$MORWEN_READONLY_NATIVE"
            echo DISPOSABLE_CALIBRATION_MUTATION_ATTEMPTED > evidence/native-probe-status.txt
            slider_by probe-iris-x '^Iris Size \(X\)$' 0.017
            capture_state native-probe-after
            read -r changed _ _ <<< "$("$row" evidence/native-probe-after.png '^Iris Size \(X\)$')"
            read -r y_after _ _ <<< "$("$row" evidence/native-probe-after.png '^Iris Size \(Y\)$')"
            python3 - "$initial" "$changed" "$protected_y" "$y_after" <<'PY'
          import sys
          from decimal import Decimal
          a,b,y,z = map(Decimal,sys.argv[1:])
          assert Decimal("0.002") < b-a <= Decimal("0.15") and y == z, "unexpected response"
          PY
            native_save
            reopen_copy
            face_cat "$CAT_IRIS"
            capture_state native-probe-reopened
            read -r reopened _ _ <<< "$("$row" evidence/native-probe-reopened.png '^Iris Size \(X\)$')"
            read -r y_reopened _ _ <<< "$("$row" evidence/native-probe-reopened.png '^Iris Size \(Y\)$')"
            if [ "$changed" != "$reopened" ] || [ "$protected_y" != "$y_reopened" ]; then
              echo BLOCKED_REOPEN_VALUE_MISMATCH > evidence/native-probe-status.txt
              exit 1
            fi
            test "$(shasum -a 256 evidence/input-model.vroid | cut -d ' ' -f1)" = "$MORWEN_EXPECTED_SHA256"
            python3 - "$initial" "$changed" "$reopened" "$protected_y" "$y_after" "$y_reopened" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          p=pathlib.Path("evidence")
          a,b,c,y,z,q=map(float,sys.argv[1:])
          def sha(f): return hashlib.sha256(f.read_bytes()).hexdigest()
          with zipfile.ZipFile(p/"input-model.vroid") as src, zipfile.ZipFile(p/"model.vroid") as dst:
              assert src.testzip() is None and dst.testzip() is None
              assert src.read("v1model/data.bin") != dst.read("v1model/data.bin")
          assert sha(p/"model.vroid") != sha(p/"input-model.vroid")
          record=dict(status="DISPOSABLE_CONTROL_RESPONSE_REOPEN_VERIFIED_NOT_ADOPTED",
                      before=a,after=b,reopened=c,protected_iris_y=[y,z,q],
                      native_sha256=sha(p/"model.vroid"),source_sha256=sha(p/"input-model.vroid"),
                      screenshots={k:sha(p/(k+".png")) for k in ("native-probe-before","native-probe-after","native-probe-reopened")})
          (p/"native-probe.json").write_text(json.dumps(record,indent=2))
          PY
            echo CONTROL_RESPONSE_REOPEN_VERIFIED_NOT_ART_QA > evidence/native-probe-status.txt
          fi
      - name: Checkout trusted shared engines for control receipt
        if: inputs.native_probe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: shared-main
          persist-credentials: false
          sparse-checkout: |
            tools/production_qa
            tools/blueprint_engine
      - name: Validate reopened control evidence with shared engines
        if: inputs.native_probe
        env:
          PYTHONPATH: ${{ github.workspace }}/shared-main/tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          from blueprint_engine.residual import evaluate
          from session_plan import ready,sha
          p=pathlib.Path("evidence").resolve()
          record=json.loads((p/"native-probe.json").read_text())
          assert record["status"]=="DISPOSABLE_CONTROL_RESPONSE_REOPEN_VERIFIED_NOT_ADOPTED"
          assert sha(p/"model.vroid")==record["native_sha256"]
          assert sha(p/"input-model.vroid")==record["source_sha256"]=="9aba397dc080af510cc299cde1459accc83f468fa6bfa139229fe7e720887574"
          assert record["native_sha256"]!=record["source_sha256"]
          assert record["protected_iris_y"]==[0.194]*3
          assert record["before"]==0.141 and record["after"]==record["reopened"]
          assert 0.002 < record["after"]-record["before"] <= 0.15
          assert all(sha(p/(k+".png"))==v for k,v in record["screenshots"].items())
          target=dict(values={"iris_x":record["after"]},tolerances={"iris_x":0.002},uncertainty={"iris_x":0.001})
          report=evaluate(target,dict(actual={"iris_x":record["reopened"]},uncertainty={"iris_x":0.001}))
          assert report["overall"]=="PASS"
          fingerprint=hashlib.sha256((p/"native-probe.json").read_bytes()).hexdigest()
          stages=[dict(id="isolated_control_receipt",deps=[],seconds=1,qualified=True,fingerprint=fingerprint)]
          completed={"isolated_control_receipt":dict(path="model.vroid",sha256=record["native_sha256"],reopened=True,fingerprint=fingerprint)}
          assert ready(stages,completed,p,10,1)==[]
          report["scope"]="CONTROL_REOPEN_TEST_ONLY; NO_FACTORY_CAS_OR_ART_ACCEPTANCE"
          (p/"shared-engine-control-qa.json").write_text(json.dumps(report,indent=2))
          PY
      - name: Receive two read-only probe instructions in this session
        if: inputs.poll_probe && !inputs.frame_probe
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, subprocess, time
          run, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          # Allow instructions queued during this exact manually dispatched run, not only after GUI startup.
          # No command can change the native file; acceptance is a read-only receipt.
          meta = json.loads(subprocess.check_output(
              ["gh", "api", "--method", "GET", "repos/celticmusic-nagoya/the-windbound-oath/actions/runs/"+run],
              timeout=15, text=True))
          if (str(meta.get("id")) != run or str(meta.get("run_attempt")) != attempt
              or meta.get("event") != "workflow_dispatch" or meta.get("head_branch") != "main"
              or meta.get("head_sha") != os.environ["GITHUB_SHA"]):
              raise SystemExit("Run identity not verified")
          cutoff = meta["created_at"] if attempt == "1" else meta["run_started_at"]
          started = dt.datetime.fromisoformat(cutoff.replace("Z", "+00:00"))
          if started > dt.datetime.now(dt.timezone.utc):
              raise SystemExit("Run timestamp in future")
          since = (started - dt.timedelta(seconds=1)).isoformat().replace("+00:00", "Z")
          prefix = f"TWO-MORWEN-POLL-PROBE v2 run={run} attempt={attempt} head=3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb seq="
          wanted = {prefix + str(i): i for i in (1, 2)}
          for body in wanted:
              print("SEND EXACTLY:", body, flush=True)
          accepted, seen = {}, set()
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline and len(accepted) < 2:
              raw = subprocess.check_output(
                  ["gh", "api", "--method", "GET", "repos/celticmusic-nagoya/the-windbound-oath/issues/427/comments",
                   "-f", "since="+since, "-F", "per_page=100", "--paginate", "--slurp"],
                  timeout=min(15, max(1, deadline-time.monotonic())), text=True)
              for page in json.loads(raw):
                  for item in page:
                      cid = item.get("id")
                      if type(cid) is not int or cid <= 0 or cid in seen:
                          continue
                      seen.add(cid)
                      if item.get("user", {}).get("id") != 315379131 or item.get("author_association") != "OWNER":
                          continue
                      created = item.get("created_at", "")
                      if created != item.get("updated_at") or created < cutoff:
                          continue
                      seq = wanted.get(item.get("body"))
                      if seq and seq not in accepted:
                          accepted[seq] = cid
                          print(f"READ_ONLY_RECEIVED seq={seq} comment={cid}", flush=True)
              if len(accepted) < 2:
                  time.sleep(min(10, max(0, deadline-time.monotonic())))
          receipt = {"run": run, "attempt": attempt, "accepted": accepted,
                     "cutoff": cutoff, "scope": "READ_ONLY_NO_NATIVE_EDIT_NO_PRODUCTION_CAS",
                     "status": "PASS" if len(accepted) == 2 else "BLOCKED"}
          pathlib.Path("evidence/poll-probe.txt").write_text(json.dumps(receipt, sort_keys=True))
          if len(accepted) != 2:
              raise SystemExit("Two live probe instructions not received")
          PY
      - name: Label disposable native output
        if: always() && inputs.native_probe
        shell: bash
        run: |
          set -euo pipefail
          if [ -f evidence/model.vroid ]; then
            if [ -s evidence/shared-engine-control-qa.json ] && grep -qx CONTROL_RESPONSE_REOPEN_VERIFIED_NOT_ART_QA evidence/native-probe-status.txt; then
              mv evidence/model.vroid evidence/calibration-only-reopened-not-adopted.vroid
            else
              mv evidence/model.vroid evidence/quarantine-unverified-not-adopted.vroid
            fi
          fi
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-isolated-vroid-reopen-review
          path: |
            evidence/*.png
            evidence/*.txt
            evidence/*.json
            evidence/calibration-only-reopened-not-adopted.vroid
            evidence/quarantine-unverified-not-adopted.vroid
          retention-days: 7

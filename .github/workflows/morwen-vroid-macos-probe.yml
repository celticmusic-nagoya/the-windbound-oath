                  else:q=0
                  row[i]=(row[i]+q)&255
              out.append(bytes(row));prev=row
          h=hashlib.sha256(b''.join(out)).hexdigest();print(h)
          assert h=='cc42bb0faf2881a1e258389b99b48a959495fdb2bd062611326ed24bed4a13fd'
          PY
          python3 "$RUNNER_TEMP/skirt-verify.py" "$RUNNER_TEMP/uv-grid.png" | tee evidence/skirt-generated-pixel-sha.txt

          import Cocoa
          import Foundation
          guard let im=NSBitmapImageRep(data:try Data(contentsOf:URL(fileURLWithPath:CommandLine.arguments[1]))) else { exit(2) }
          let w=im.pixelsWide,h=im.pixelsHigh
          guard w>0,h>0,w<=4096,h<=4096 else { exit(2) }
          var rows=[[Int]](repeating:[0,0,0],count:h)
          var cols=[[Int]](repeating:[0,0,0],count:w)
          for y in 0..<h {
              for x in 0..<w {
                  guard let c=im.colorAt(x:x,y:y)?.usingColorSpace(.deviceRGB) else { exit(2) }
                  let a=c.alphaComponent
                  if a>=0.5 {
                      rows[y][0]+=1; cols[x][0]+=1
                      let v=(c.redComponent+c.greenComponent+c.blueComponent)/3
                      if v<0.25 { rows[y][1]+=1;cols[x][1]+=1 }

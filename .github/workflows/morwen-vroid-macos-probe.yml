name: Morwen VRoid macOS compatibility probe
run-name: Morwen VRoid / ${{ inputs.mode }}${{ inputs.request_id != '' && format(' request:{0}', inputs.request_id) || '' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose one mode (parallel_batch runs isolated module work)"
        type: choice
        required: true
        default: wardrobe_guide
        options:
          - wardrobe_guide
          - wardrobe_import
          - parallel_ac
          - wardrobe_export
          - parallel_next
          - face_candidate
          - parallel_batch
          - hair_review
          - hair_candidate
          - front_frame
          - reopen_only
          - native_calibration
          - communication_test
      expected_main:
        description: Internal launch guard; empty for manual runs
        type: string
        default: ''
      request_id:
        description: Internal comment ID; empty for manual runs
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: morwen-vroid-macos-probe
  cancel-in-progress: false
jobs:
  reopen:
    if: >-
      github.repository == 'celticmusic-nagoya/the-windbound-oath' &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/codex/morwen-volatile-import-calibrated-20261125' &&
        inputs.mode == 'wardrobe_import' && inputs.expected_main == '' &&
        inputs.request_id == '' && github.run_attempt == 1))
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: ${{ fromJSON(inputs.mode == 'parallel_batch' && '["A-face-body","B-hair","C-wardrobe"]' || (inputs.mode == 'parallel_next' && '["B-hair","C-wardrobe"]' || ((inputs.mode == 'wardrobe_export' || inputs.mode == 'wardrobe_import' || inputs.mode == 'wardrobe_guide') && '["C-wardrobe"]' || (inputs.mode == 'parallel_ac' && '["A-face-body","C-wardrobe"]' || '["reopen"]')))) }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      LANE: ${{ matrix.lane }}
      HAIR_STRAND: ${{ inputs.mode == 'parallel_next' && 'Hair 7' || 'Hair 3' }}
    steps:
      - name: Verify automatic launch identity before checkout
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          REQUEST_ID: ${{ inputs.request_id }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_MAIN" ] || [ -n "$REQUEST_ID" ]; then
            test "$EXPECTED_MAIN" = "$GITHUB_SHA"
            [[ "$REQUEST_ID" =~ ^[1-9][0-9]{0,14}$ ]]
            test "$GITHUB_RUN_ATTEMPT" = 1
            case "$MODE" in hair_candidate|hair_review|parallel_batch|parallel_next|face_candidate|wardrobe_export|parallel_ac|wardrobe_import|wardrobe_guide) ;; *) exit 1 ;; esac
          fi
      - uses: actions/checkout@v4
        with:
          ref: 3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb
          persist-credentials: false
      - name: Record checkout and compile existing GUI controls
        env:
          MODE: ${{ inputs.mode }}
          NATIVE_PROBE: ${{ inputs.mode == 'native_calibration' }}
          FRAME_PROBE: ${{ inputs.mode == 'front_frame' || inputs.mode == 'hair_review' }}
          HAIR_REVIEW: ${{ inputs.mode == 'hair_review' || inputs.mode == 'parallel_batch' || inputs.mode == 'parallel_next' || inputs.mode == 'face_candidate' || inputs.mode == 'wardrobe_export' || inputs.mode == 'parallel_ac' || inputs.mode == 'wardrobe_import' || inputs.mode == 'wardrobe_guide' }}
          FACE_PROBE: ${{ inputs.mode == 'face_candidate' || (inputs.mode == 'parallel_ac' && matrix.lane == 'A-face-body') }}
          PARALLEL: ${{ inputs.mode == 'parallel_batch' || inputs.mode == 'wardrobe_export' || inputs.mode == 'wardrobe_import' || inputs.mode == 'wardrobe_guide' || ((inputs.mode == 'parallel_next' || inputs.mode == 'parallel_ac') && matrix.lane == 'C-wardrobe') }}
          NEXT_BATCH: ${{ inputs.mode == 'parallel_next' || inputs.mode == 'wardrobe_export' || inputs.mode == 'parallel_ac' || inputs.mode == 'wardrobe_import' || inputs.mode == 'wardrobe_guide' }}
          WARDROBE_IMPORT: ${{ inputs.mode == 'wardrobe_import' }}
          WARDROBE_GUIDE: ${{ inputs.mode == 'wardrobe_guide' }}
          HAIR_PROBE: ${{ inputs.mode == 'hair_candidate' || (inputs.mode == 'parallel_next' && matrix.lane == 'B-hair') }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in wardrobe_guide|wardrobe_import|parallel_ac|wardrobe_export|face_candidate|parallel_next|parallel_batch|hair_review|hair_candidate|front_frame|reopen_only|native_calibration|communication_test) ;; *) echo BLOCKED_UNKNOWN_MODE; exit 1 ;; esac
          mkdir -p evidence
          printf "%s\n" "$MODE" > evidence/selected-mode.txt
          git rev-parse HEAD > evidence/checkout-sha.txt
          grep -qx 3757fdd6ee6b41e4bc0aba12705ef1d431fea6fb evidence/checkout-sha.txt
          bash -n tools/production_qa/morwen_readonly_capture.sh
          if grep -nF '\\n' tools/production_qa/morwen_readonly_capture.sh; then
            echo 'BLOCKED_MALFORMED_CHECKSUM_ESCAPE' >&2
            exit 1
          fi
          bash -n tools/production_qa/morwen_vroid_session.sh
          swiftc tools/production_qa/macos_gui.swift -o "$RUNNER_TEMP/two-gui"
          if [ "$NATIVE_PROBE" = true ] || [ "$FRAME_PROBE" = true ] || [ "$HAIR_PROBE" = true ] || [ "$FACE_PROBE" = true ]; then
          cat > "$RUNNER_TEMP/face-row.swift" <<'SWIFT'
          import Foundation
          import Vision
          import AppKit
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = false
          let args = CommandLine.arguments
          try VNImageRequestHandler(url: URL(fileURLWithPath: args[1])).perform([request])
          let rows = request.results ?? []
          let labels = rows.filter {
              $0.boundingBox.minX > 0.71 && $0.boundingBox.midX < 0.91
                  && $0.topCandidates(1).first?.string
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                      .range(of: args[2], options: [.regularExpression, .caseInsensitive]) != nil
          }
          guard labels.count == 1, let label = labels.first else { exit(2) }
          let fields = rows.filter {
              $0.boundingBox.midX > 0.92
                  && abs($0.boundingBox.midY - label.boundingBox.midY) < 0.018
                  && $0.topCandidates(1).first?.string.range(
                      of: #"^[−-]?\d+\.\d{3}$"#, options: .regularExpression
                  ) != nil
          }
          guard fields.count == 1, let field = fields.first,
                let value = field.topCandidates(1).first?.string else { exit(2) }
          let png = try Data(contentsOf: URL(fileURLWithPath: args[1]))
          guard let image = NSBitmapImageRep(data: png) else { exit(2) }
          let w = image.pixelsWide, h = image.pixelsHigh
          let fieldY = 1 - field.boundingBox.midY
          let expectedY = Int(fieldY * Double(h)) + Int(Double(h) * 0.031)
          guard expectedY >= 9, expectedY + 9 < h else { exit(2) }
          var xs: [Int] = [], ys: [Int] = []
          for y in (expectedY - 9)...(expectedY + 9) {
              for x in Int(Double(w) * 0.72)...Int(Double(w) * 0.981) {
                  guard let c = image.colorAt(x: x, y: y)?.usingColorSpace(NSColorSpace.deviceRGB) else { continue }
                  if c.blueComponent > 0.78 && c.redComponent < 0.22
                      && c.greenComponent > 0.30 && c.greenComponent < 0.82 {
                      xs.append(x)
                      ys.append(y)
                  }
              }
          }
          guard let minX = xs.min(), let maxX = xs.max(), maxX - minX <= 35,
                let minY = ys.min(), let maxY = ys.max() else { exit(2) }
          print(value.replacingOccurrences(of: "−", with: "-"),
                Double(minX + maxX) / (2 * Double(w)),
                Double(minY + maxY) / (2 * Double(h)))
          SWIFT
          swiftc "$RUNNER_TEMP/face-row.swift" -o "$RUNNER_TEMP/face-row"
          cat > "$RUNNER_TEMP/frame-margin.swift" <<'SWIFT'
          import Cocoa
          import Foundation
          guard let image = NSBitmapImageRep(data: try Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))),
                image.pixelsWide == 1024, image.pixelsHigh == 768 else { exit(2) }
          let x0 = 298, x1 = 725, y0 = 104, y1 = 705
          var xmin = x1, xmax = x0, ymin = y1, ymax = y0, count = 0
          for y in y0...y1 {
              for x in x0...x1 {
                  guard let c = image.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { exit(2) }
                  let v = [c.redComponent, c.greenComponent, c.blueComponent].map { $0 * 255 }
                  if v.max()! - v.min()! > 18 || v.reduce(0,+)/3 < 205 {
                      xmin = min(xmin,x); xmax = max(xmax,x); ymin = min(ymin,y); ymax = max(ymax,y); count += 1
                  }
              }
          }
          let margin = min(xmin-x0,x1-xmax,ymin-y0,y1-ymax)
          print("bbox", xmin, ymin, xmax, ymax, "foreground_pixels", count, "margin", margin)
          // Foreground heuristic only; independent review of orientation and body crop required.
          exit(count >= 1500 && ymax-ymin >= 120 && margin >= 12 ? 0 : 1)
          SWIFT
          swiftc "$RUNNER_TEMP/frame-margin.swift" -o "$RUNNER_TEMP/frame-margin"
          fi
          if [ "$HAIR_PROBE" = true ]; then
            cat > "$RUNNER_TEMP/hair-row.swift" <<'SWIFT'
          import Cocoa
          import Foundation
          import Vision
          let args=CommandLine.arguments
          guard args.count==3, ["^Width$","^Thickness$"].contains(args[2]) else { exit(2) }
          let url=URL(fileURLWithPath:args[1])
          guard let im=NSBitmapImageRep(data:try Data(contentsOf:url)), im.pixelsWide==1024, im.pixelsHigh==768 else { exit(2) }
          let req=VNRecognizeTextRequest()
          req.recognitionLevel = .accurate
          req.usesLanguageCorrection = false
          try VNImageRequestHandler(url:url).perform([req])
          let rows=req.results ?? []
          func label(_ o:VNRecognizedTextObservation)->String {
              o.topCandidates(1).first?.string.trimmingCharacters(in:.whitespacesAndNewlines) ?? ""
          }
          func blue(_ x:Int,_ y:Int)->Bool {
              guard let c=im.colorAt(x:x,y:y)?.usingColorSpace(.deviceRGB) else { return false }
              return c.blueComponent>0.78 && c.redComponent<0.22 && c.greenComponent>0.30 && c.greenComponent<0.82
          }
          // Selection must be the unique visible Hair 3 row, highlighted blue.
          let target=ProcessInfo.processInfo.environment["HAIR_STRAND"] ?? "Hair 3"
          guard ["Hair 3","Hair 7"].contains(target) else { exit(2) }
          let strands=rows.filter { label($0)==target && $0.boundingBox.midX<0.28 }
          guard strands.count==1, let strand=strands.first else { exit(2) }
          let sy=Int((1-strand.boundingBox.midY)*768)
          guard (target=="Hair 3" ? (340...370).contains(sy) : (460...490).contains(sy)) else { exit(2) }
          var selected=0
          for yy in (sy-4)...(sy+4) { for xx in 65...90 { if blue(xx,yy) { selected+=1 } } }
          guard selected>=200 else { exit(2) }
          // Geometry only: explicit section anchor above the row, no texture controls exposed.
          let headers=rows.filter { label($0).contains("Hair Parameters") && $0.boundingBox.midX>0.74 }
          guard headers.count==1, let head=headers.first,
                !rows.contains(where:{ ["Highlights Position","Offset"].contains(label($0)) && $0.boundingBox.midX>0.74 }) else { exit(2) }
          let hits=rows.filter {
              $0.boundingBox.minX>0.71 && $0.boundingBox.midX<0.91 &&
              $0.boundingBox.midY<head.boundingBox.midY &&
              label($0).range(of:args[2],options:.regularExpression) != nil
          }
          guard hits.count==1, let hit=hits.first else { exit(2) }
          let fields=rows.filter {
              $0.boundingBox.midX>0.92 && abs($0.boundingBox.midY-hit.boundingBox.midY)<0.026 &&
              label($0).range(of:#"^[−-]?\d+\.\d{2,3}$"#,options:.regularExpression) != nil
          }
          guard fields.count==1, let field=fields.first else { exit(2) }
          let value=label(field).replacingOccurrences(of:"−",with:"-")
          let fy=Int((1-field.boundingBox.midY)*768)
          // Actual hair-panel sliders are ~32px beneath their numerical readout.
          guard fy>=120 && fy+42<650 else { exit(2) }
          var xs:[Int]=[], ys:[Int]=[]
          for yy in (fy+22)...(fy+42) { for xx in 780...995 { if blue(xx,yy) { xs.append(xx);ys.append(yy) } } }
          guard let lo=xs.min(),let hi=xs.max(),let top=ys.min(),let bot=ys.max(),
                hi-lo>=8,hi-lo<=32,bot-top>=8,bot-top<=24 else { exit(2) }
          print(value,Double(lo+hi)/2048,Double(top+bot)/1536)
          SWIFT
            swiftc "$RUNNER_TEMP/hair-row.swift" -o "$RUNNER_TEMP/hair-row"
            cat > "$RUNNER_TEMP/hair-save-guard.swift" <<'SWIFT'
          import Cocoa
          import Foundation
          import Vision
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let im = NSBitmapImageRep(data: try Data(contentsOf: url)),
                im.pixelsWide == 1024, im.pixelsHigh == 768 else { exit(2) }
          let req = VNRecognizeTextRequest()
          try VNImageRequestHandler(url: url).perform([req])
          for (label, y) in [("Front",364),("Back",399)] {
              let hits = (req.results ?? []).filter { o in
                  (o.topCandidates(1).first?.string.trimmingCharacters(in:.whitespacesAndNewlines).replacingOccurrences(of:"*",with:"").trimmingCharacters(in:.whitespacesAndNewlines) == label) &&
                  abs((1.0-Double(o.boundingBox.midY))*768.0-Double(y)) < 9.0 &&
                  abs(Double(o.boundingBox.minX)*1024.0-366.0) < 15.0
              }
              guard hits.count == 1 else { exit(2) }
          }
          func state(_ y: Int) -> String {
              var blue = 0, white = 0
              for yy in (y-5)...(y+5) {
                  for x in 343...353 {
                      guard let c = im.colorAt(x:x,y:yy)?.usingColorSpace(.deviceRGB) else { return "unknown" }
                      if c.blueComponent>0.72 && c.redComponent<0.30 && c.greenComponent>0.24 && c.greenComponent<0.85 { blue += 1 }
                      if c.redComponent>0.9 && c.greenComponent>0.9 && c.blueComponent>0.9 { white += 1 }
                  }
              }
              if blue>=20 { return "checked" }
              if white>=100 && blue==0 { return "unchecked" }
              return "unknown"
          }
          let front=state(364), back=state(399)
          print("Front",front,"Back",back)
          exit(front=="checked" && back=="unchecked" ? 0 : 1)
          SWIFT
            swiftc "$RUNNER_TEMP/hair-save-guard.swift" -o "$RUNNER_TEMP/hair-save-guard"
          fi
      - name: Verify hair save guard on actual archived dialog before VRoid startup
        if: inputs.mode == 'hair_candidate' || (inputs.mode == 'parallel_next' && matrix.lane == 'B-hair')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/15002346250/zip" > "$RUNNER_TEMP/save-fixture.zip"
          echo "550a10b9e1e8d518ef5c5f78ace91e91a4e3953da249d904088f0c275c8e2ca7  $RUNNER_TEMP/save-fixture.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os,zipfile,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"save-fixture.zip") as z:
              assert z.testzip() is None
              data=z.read("hair-save-dialog.png")
              assert hashlib.sha256(data).hexdigest()=="45b87217661b28e5834e1ecb49209233c1a992a5160ee5ddcde526475b48b48b"
              (p/"save-fixture.png").write_bytes(data)
          PY
          "$RUNNER_TEMP/hair-save-guard" "$RUNNER_TEMP/save-fixture.png" | tee evidence/hair-save-preflight.txt
          grep -qx 'Front checked Back unchecked' evidence/hair-save-preflight.txt
      - name: Preflight Hair 7 locator against exact positive and negative images
        if: inputs.mode == 'parallel_next' && matrix.lane == 'B-hair'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/15006373919/zip" > "$RUNNER_TEMP/hair7-fixture.zip"
          echo "ee214f69d25ae600c23f0a4063d137fd5de628f956072d5a418bc24379037e94  $RUNNER_TEMP/hair7-fixture.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os,zipfile,hashlib,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"hair7-fixture.zip") as z:
              assert z.testzip() is None
              for n,h in {"hair-7-geometry.png":"0a48567b4f834c6b5cddef833fbcbb85098c3516fb9de9612e3e93b9915533ab","hair-6-geometry.png":"36151a158820aab2cf740243e4f7e177b90d64e90207be29f4452e8d3d54bba8"}.items():
                  data=z.read(n)
                  assert hashlib.sha256(data).hexdigest()==h
                  (p/n).write_bytes(data)
          PY
          test "$("$RUNNER_TEMP/hair-row" "$RUNNER_TEMP/hair-7-geometry.png" '^Width$' | cut -d ' ' -f1)" = 0.03
          test "$("$RUNNER_TEMP/hair-row" "$RUNNER_TEMP/hair-7-geometry.png" '^Thickness$' | cut -d ' ' -f1)" = 0.04
          if "$RUNNER_TEMP/hair-row" "$RUNNER_TEMP/hair-6-geometry.png" '^Width$'; then exit 1; fi
          echo HAIR7_FIXTURE_PASS > evidence/hair7-preflight.txt
      - name: Compile skirt alpha inspection before VRoid startup
        if: (inputs.mode == 'parallel_next' || inputs.mode == 'wardrobe_export' || inputs.mode == 'parallel_ac' || inputs.mode == 'wardrobe_import' || inputs.mode == 'wardrobe_guide') && matrix.lane == 'C-wardrobe'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/skirt-alpha.swift" <<'SWIFT'
          import Cocoa
          import Foundation
          let dir=URL(fileURLWithPath:CommandLine.arguments[1])
          let files=try FileManager.default.contentsOfDirectory(at:dir,includingPropertiesForKeys:nil).filter{$0.pathExtension.lowercased()=="png"}
          guard files.count==1,let im=NSBitmapImageRep(data:try Data(contentsOf:files[0])) else { exit(2) }
          var rows:[[Int]]=[]
          for y in 0..<im.pixelsHigh {
              var lo=im.pixelsWide
              var hi = -1
              for x in 0..<im.pixelsWide {
                  guard let c=im.colorAt(x:x,y:y) else { exit(2) }
                  if c.alphaComponent>=0.5 { lo=min(lo,x);hi=max(hi,x) }
              }
              rows.append(hi>=0 ? [lo,hi] : [])
          }
          let result:[String:Any]=["scope":"Alpha coverage only, not UV topology","width":im.pixelsWide,"height":im.pixelsHigh,"rows":rows]
          let data=try JSONSerialization.data(withJSONObject:result)
          try data.write(to:URL(fileURLWithPath:"evidence/skirt-alpha-row-bounds.json"))
          SWIFT
          swiftc "$RUNNER_TEMP/skirt-alpha.swift" -o "$RUNNER_TEMP/skirt-alpha"
      - name: Preflight mouth controls on exact archived images
        if: inputs.mode == 'face_candidate' || (inputs.mode == 'parallel_ac' && matrix.lane == 'A-face-body')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mouth-readout.py" <<'PY'
          import re, sys
          from pathlib import Path
          LABELS=('Mouth Width','Mouth Position (Y)','Mouth Corners','Mouth (Z)')
          def parse(text):
              rows=[x.strip() for x in text.split('|')]
              if rows.count('Parameters')!=1 or 'Mouth' not in rows[:rows.index('Parameters')] or 'Customize' not in rows or 'Edit Texture' not in rows:
                  raise ValueError('mouth panel not verified')
              rows=rows[rows.index('Parameters')+1:]
              result=[]
              for label in LABELS:
                  if rows.count(label)!=1: raise ValueError(f'nonunique {label}')
                  i=rows.index(label)
                  if i+1>=len(rows): raise ValueError(f'missing {label} value')
                  j=i+1
                  if rows[j]=='' and j+1<len(rows): j+=1
                  v=rows[j].replace('−','-')
                  if not re.fullmatch(r'-?\d+\.\d{3}',v): raise ValueError(f'invalid {label} value')
                  result.append(v)
              return ' '.join(result)
          if __name__=='__main__':
              print(parse(Path(sys.argv[1]).read_text()))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/15007077087/zip" > "$RUNNER_TEMP/face-fixture.zip"
          echo "55d76ca1388acf10a53953d498ff57a13b0a0a51346381416c91745c786757a8  $RUNNER_TEMP/face-fixture.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os,zipfile,hashlib,pathlib,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"face-fixture.zip") as z:
              assert z.testzip() is None
              for n,h in {"face-control-mouth.png":"0d8f11ec03761fca8ad64869433339f4b12088967d80027d4fda729bcab068ce","face-control-nose.png":"256953b755f9315779ca5d7e52c1f5d74c3eb5c7c3ad56ae93a6258d6828d36d"}.items():
                  b=z.read(n)
                  assert hashlib.sha256(b).hexdigest()==h
                  (p/n).write_bytes(b)
              receipt=json.loads(z.read("module-receipt.json"))
              for n in ("face-control-mouth.txt","face-control-nose.txt"):
                  b=z.read(n)
                  assert hashlib.sha256(b).hexdigest()==receipt["files"][n]
                  (p/n).write_bytes(b)
          PY
          row="$RUNNER_TEMP/face-row"
          img="$RUNNER_TEMP/face-control-mouth.png"
          python3 "$RUNNER_TEMP/mouth-readout.py" "$RUNNER_TEMP/face-control-mouth.txt" | tee evidence/mouth-fixture-values.txt
          grep -qx -- '-0.026 0.000 0.000 0.000' evidence/mouth-fixture-values.txt
          if python3 "$RUNNER_TEMP/mouth-readout.py" "$RUNNER_TEMP/face-control-nose.txt"; then exit 1; fi
          "$row" "$img" '^Mouth Width$' | tee evidence/mouth-fixture-slider.txt
          test "$(cut -d ' ' -f1 evidence/mouth-fixture-slider.txt)" = -0.026
          if "$row" "$RUNNER_TEMP/face-control-nose.png" '^Mouth Width$'; then exit 1; fi
          # Actual failed live response: exactly one empty OCR separator after Mouth Position (Y).
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15015543408/zip" > "$RUNNER_TEMP/mouth-response.zip"
          echo "fc6d73a2937c7b769b7a4e6ac3da68a4598d502249cc835d3ddc4d69b2c46117  $RUNNER_TEMP/mouth-response.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os,zipfile,hashlib,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"mouth-response.zip") as z:
              assert z.testzip() is None
              for n,h in {"mouth-before.txt":"0b94abc8c186f0ba24f9e10551a6f623efa2341eeb4cbbab30125c9fa25295d9","mouth-after.txt":"9a7cd96ea81e20c356d304555f7bb69ad6bd4b0d2f50d8479fc5934de75beedd"}.items():
                  data=z.read(n)
                  assert hashlib.sha256(data).hexdigest()==h
                  (p/n).write_bytes(data)
          PY
          test "$(python3 "$RUNNER_TEMP/mouth-readout.py" "$RUNNER_TEMP/mouth-before.txt")" = '-0.026 0.000 0.000 0.000'

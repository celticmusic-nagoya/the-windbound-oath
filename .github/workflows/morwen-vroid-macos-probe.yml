name: Morwen VRoid macOS compatibility probe
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths: ['.github/workflows/morwen-vroid-macos-probe.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: morwen-vroid-macos-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared GUI controls
        run: |
          mkdir -p evidence
          swiftc tools/production_qa/macos_gui.swift -o "$RUNNER_TEMP/two-gui"
          "$RUNNER_TEMP/two-gui" screenshot evidence/gui-compile-screen.png
          "$RUNNER_TEMP/two-gui" ocr evidence/gui-compile-screen.png > evidence/gui-compile-ocr.txt
      - name: Environment
        run: |
          mkdir -p evidence
          sw_vers > evidence/environment.txt
          uname -m >> evidence/environment.txt
          df -h >> evidence/environment.txt
          system_profiler SPDisplaysDataType >> evidence/environment.txt
      - name: Cache verified installer download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vroid.dmg
          key: vroid-macos-arm64-2.16.0-d3d8900b6397e9ed7
      - name: Restore native checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14690913144/zip" > "$RUNNER_TEMP/checkpoint.zip"
          echo "35aad310b29acf4275ed781037d8fc1f26f345dee1dc076bdf122544d79a52d2  $RUNNER_TEMP/checkpoint.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os, zipfile, pathlib, hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"checkpoint.zip") as z:
              item=z.getinfo("model.vroid")
              assert 0 < item.file_size < 100_000_000
              data=z.read(item)
              expected=z.read("model-sha256.txt").decode().split()[0]
              assert hashlib.sha256(data).hexdigest()==expected=="57e8dc139333dbbe353bdf07f36eab70cfffa02a22271b4a17cc013ea2f40616"
              (p/"Morwen-resume.vroid").write_bytes(data)
          PY
      - name: Download official DMG and inspect signature
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/vroid.dmg" ]; then
            curl --fail --location --proto '=https' --max-time 420 --output "$RUNNER_TEMP/vroid.dmg" 'https://download.vroid.com/dist/2cbXSb76Bf/VRoidStudio-v2.16.0-mac.dmg'
          fi
          shasum -a 256 "$RUNNER_TEMP/vroid.dmg" | tee evidence/dmg-sha256.txt
          echo "d3d8900b6397e9ed7cea640c679b07dfff011eb9fc393533e26419f5fcf546f6  $RUNNER_TEMP/vroid.dmg" | shasum -a 256 -c
          hdiutil verify "$RUNNER_TEMP/vroid.dmg" > evidence/dmg-verify.txt 2>&1
          mkdir -p "$RUNNER_TEMP/vroid-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/vroid-mount" "$RUNNER_TEMP/vroid.dmg"
          app="$(find "$RUNNER_TEMP/vroid-mount" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app" > evidence/signature-verify.txt 2>&1
          codesign -dv --verbose=4 "$app" > evidence/signature-details.txt 2>&1
          spctl --assess --type execute -vv "$app" > evidence/gatekeeper.txt 2>&1
          ditto "$app" "$RUNNER_TEMP/VRoidStudio.app"
          hdiutil detach "$RUNNER_TEMP/vroid-mount"
      - name: Launch signed application and collect evidence
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/VRoidStudio.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist" > evidence/version.txt
          exe="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          file "$app/Contents/MacOS/$exe" > evidence/binary.txt
          test "$(uname -m)" = arm64
          # LaunchServices registers the app with the GUI session.
          stat -f '%Su' /dev/console > evidence/console-user.txt
          open -a "$app" --args -logFile "$RUNNER_TEMP/vroid-player.log"
          sleep 15
          osascript -e "tell application id \"net.pixiv.vroid.macosx\" to activate" > evidence/activate.txt 2>&1 || true
          sleep 45
          screencapture -x evidence/screen-60s.png || true
          sleep 30
          # Finder-only startup is not an editor failure; bounded activation recovery.
          if ! osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true' | grep -qi VRoid; then
            osascript -e 'tell application id "net.pixiv.vroid.macosx" to activate' || true
            sleep 20
          fi
          # Verify the welcome screen text before issuing a bounded input event.
          swift -e 'import Cocoa; import CoreGraphics; print(CGPreflightPostEventAccess()); print(CGDisplayPixelsWide(CGMainDisplayID()), CGDisplayPixelsHigh(CGMainDisplayID()))' > evidence/input-access.txt 2>&1
          screencapture -x evidence/before-input.png
          swift -e 'import Vision; import Foundation; let r = VNRecognizeTextRequest(); try VNImageRequestHandler(url:URL(fileURLWithPath:CommandLine.arguments[1])).perform([r]); for o in r.results ?? [] { print(o.topCandidates(1).first?.string ?? "") }' evidence/before-input.png > evidence/welcome-text.txt
          if grep -qx true evidence/input-access.txt && grep -qx '1024 768' evidence/input-access.txt && grep -Fxq 'Get Started' evidence/welcome-text.txt; then
            swift -e 'import CoreGraphics; import Foundation; let p = CGPoint(x:512,y:578); let s = CGEventSource(stateID:.combinedSessionState); CGEvent(mouseEventSource:s,mouseType:.mouseMoved,mouseCursorPosition:p,mouseButton:.left)?.post(tap:.cgSessionEventTap); usleep(500000); for t in [CGEventType.leftMouseDown,.leftMouseUp] { if let e = CGEvent(mouseEventSource:s,mouseType:t,mouseCursorPosition:p,mouseButton:.left) { e.setIntegerValueField(.mouseEventClickState,value:1); e.post(tap:.cgSessionEventTap) }; usleep(250000) }'
            sleep 20
            screencapture -x evidence/after-get-started.png
            if cmp -s evidence/before-input.png evidence/after-get-started.png; then
              echo NO_SCREEN_CHANGE > evidence/gui-action.txt
            else
              echo SCREEN_CHANGED_REVIEW_REQUIRED > evidence/gui-action.txt
            fi
          else
            echo INPUT_ACCESS_OR_DISPLAY_BLOCKED > evidence/gui-action.txt
          fi
          # Director explicitly authorized the agreement on 2026-11-20.
          if [ -s evidence/after-get-started.png ] && grep -qx true evidence/input-access.txt; then
            swift -e 'import Vision; import Foundation; import CoreGraphics; let r = VNRecognizeTextRequest(); try VNImageRequestHandler(url:URL(fileURLWithPath:CommandLine.arguments[1])).perform([r]); let a = r.results ?? []; let strings = a.compactMap { $0.topCandidates(1).first?.string }; print(strings.joined(separator:" | ")); guard strings.contains(where:{$0.contains("Terms of Use")}), strings.contains(where:{$0.contains("Privacy Policy")}), strings.contains(where:{$0.contains("Guidelines")}), let o = a.first(where:{$0.topCandidates(1).first?.string == "Agree"}) else { print("AGREEMENT_SCREEN_NOT_VERIFIED"); exit(0) }; let p = CGPoint(x:o.boundingBox.midX * CGFloat(CGDisplayPixelsWide(CGMainDisplayID())),y:(1-o.boundingBox.midY)*CGFloat(CGDisplayPixelsHigh(CGMainDisplayID()))); let s = CGEventSource(stateID:.combinedSessionState); CGEvent(mouseEventSource:s,mouseType:.mouseMoved,mouseCursorPosition:p,mouseButton:.left)?.post(tap:.cgSessionEventTap); usleep(500000); for t in [CGEventType.leftMouseDown,.leftMouseUp] { if let e = CGEvent(mouseEventSource:s,mouseType:t,mouseCursorPosition:p,mouseButton:.left) { e.setIntegerValueField(.mouseEventClickState,value:1); e.post(tap:.cgSessionEventTap) }; usleep(250000) }; print("AGREEMENT_CLICK_SENT_REVIEW_REQUIRED")' evidence/after-get-started.png > evidence/agreement-status.txt
            sleep 25
            screencapture -x evidence/after-agreement.png
          fi
          cat > "$RUNNER_TEMP/vroid-click.swift" <<'SWIFT'
          import Vision
          import Foundation
          import CoreGraphics
          let r = VNRecognizeTextRequest()
          try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1])).perform([r])
          let a = r.results ?? []
          let labels = a.compactMap { $0.topCandidates(1).first?.string }
          print(labels.joined(separator:" | "))
          guard labels.contains(where:{$0.contains(CommandLine.arguments[3])}), let o = a.first(where:{ let t = $0.topCandidates(1).first?.string.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""; return t == CommandLine.arguments[2] || (CommandLine.arguments[2] == "Open" && t == "• Open") }) else { print("SCREEN_NOT_VERIFIED"); exit(2) }
          let d = CGDisplayBounds(CGMainDisplayID())
          let offset: CGFloat = CommandLine.arguments[2] == "Fem" ? -116 : 0
          let p = CGPoint(x:d.minX + o.boundingBox.midX*d.width,y:d.minY+(1-o.boundingBox.midY)*d.height+offset*d.height/768)
          let s = CGEventSource(stateID:.combinedSessionState)
          CGEvent(mouseEventSource:s,mouseType:.mouseMoved,mouseCursorPosition:p,mouseButton:.left)?.post(tap:.cgSessionEventTap)
          usleep(500000)
          for t in [CGEventType.leftMouseDown,.leftMouseUp] { if let e = CGEvent(mouseEventSource:s,mouseType:t,mouseCursorPosition:p,mouseButton:.left) { e.setIntegerValueField(.mouseEventClickState,value:1); e.post(tap:.cgSessionEventTap) }; usleep(250000) }
          SWIFT
          # Preserve immutable input before attempting any GUI action.
          cp "$RUNNER_TEMP/Morwen-resume.vroid" evidence/input-model.vroid
          shasum -a 256 evidence/input-model.vroid > evidence/input-model-sha256.txt
          echo NATIVE_REOPEN_NOT_VERIFIED > evidence/reopen-status.txt
          gui="$RUNNER_TEMP/two-gui"
          capture_state() {
            "$gui" screenshot "evidence/$1.png" && "$gui" ocr "evidence/$1.png" > "evidence/$1.txt"
          }
          dialog_visible() {
            grep -Eiq 'Cancel' "evidence/$1.txt" && grep -Eiq 'Open|Choose' "evidence/$1.txt"
          }
          mkdir -p "$HOME/Documents"
          test ! -e "$HOME/Documents/Morwen-resume.vroid"
          cp "$RUNNER_TEMP/Morwen-resume.vroid" "$HOME/Documents/Morwen-resume.vroid"
          cmp "$RUNNER_TEMP/Morwen-resume.vroid" "$HOME/Documents/Morwen-resume.vroid"
          reopen_native() {
            local attempt before after
            for attempt in 1 2 3; do
              before="home-attempt-$attempt"
              after="open-result-$attempt"
              capture_state "$before" || continue
              if dialog_visible "$before"; then return 0; fi
              if grep -Fq 'Recently Edited' "evidence/$before.txt"; then
                if [ "$attempt" -le 2 ]; then
                  "$gui" click-label "evidence/$before.png" Open 'Recently Edited' > "evidence/open-click-$attempt.txt" 2>&1 || true
                else
                  # Different method after two observations: standard macOS Open shortcut.
                  "$gui" key 31 cmd || true
                fi
              else
                # Escape is reversible; never accept an unknown dialog.
                "$gui" key 53 || true
              fi
              sleep 4
              capture_state "$after" || continue
              if dialog_visible "$after"; then return 0; fi
              if ! grep -Fq 'Recently Edited' "evidence/$after.txt"; then
                "$gui" key 53 || true
                sleep 2
                capture_state "recovery-$attempt" || true
              fi
            done
            return 1
          }
          if [ -s evidence/after-agreement.png ] && grep -qx true evidence/input-access.txt; then
            swift "$RUNNER_TEMP/vroid-click.swift" evidence/after-agreement.png Skip 'Welcome to VRoid Studio' > evidence/skip-status.txt || true
            sleep 5
            if reopen_native; then
              capture_state open-dialog
              # The observed chooser defaults to Documents; avoid clipboard and Go to Folder.
              if grep -Fqi 'Documents' evidence/open-dialog.txt; then
                "$gui" click-label evidence/open-dialog.png 'Morwen-resume.vroid' 'Cancel' > evidence/file-click.txt 2>&1 || true
                sleep 2
                capture_state open-selected
                if dialog_visible open-selected && grep -Fqi 'Morwen-resume' evidence/open-selected.txt; then
                  "$gui" key 36
                  sleep 35
                  capture_state resumed-editor
                  if grep -Eiq 'Face|Hairstyle|Body|Outfit' evidence/resumed-editor.txt && ! dialog_visible resumed-editor; then
                    echo NATIVE_REOPEN_REVIEW_REQUIRED > evidence/reopen-status.txt
                  fi
                fi
              fi
            else
              echo BLOCKED_OPEN_SCREEN_NOT_VERIFIED > evidence/reopen-status.txt
            fi
          fi
          screencapture -x evidence/final-recovery-screen.png || true
          # OCR the parameter row and its numeric field in the right-hand panel.
          cat > "$RUNNER_TEMP/face-row.swift" <<'SWIFT'
          import Foundation
          import Vision
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = false
          let args = CommandLine.arguments
          try VNImageRequestHandler(url: URL(fileURLWithPath: args[1])).perform([request])
          let rows = request.results ?? []
          let labels = rows.filter {
              $0.boundingBox.minX > 0.71 && $0.boundingBox.midX < 0.91
                  && $0.topCandidates(1).first?.string
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                      .range(of: args[2], options: [.regularExpression, .caseInsensitive]) != nil
          }
          guard labels.count == 1, let label = labels.first else { exit(2) }
          let fields = rows.filter {
              $0.boundingBox.midX > 0.92
                  && abs($0.boundingBox.midY - label.boundingBox.midY) < 0.018
                  && $0.topCandidates(1).first?.string.range(
                      of: #"^[−-]?\d+\.\d{3}$"#, options: .regularExpression
                  ) != nil
          }
          guard fields.count == 1, let field = fields.first,
                let value = field.topCandidates(1).first?.string else { exit(2) }
          print(field.boundingBox.midX, 1 - field.boundingBox.midY,
                value.replacingOccurrences(of: "−", with: "-"))
          SWIFT
          swiftc "$RUNNER_TEMP/face-row.swift" -o "$RUNNER_TEMP/face-row"
          row="$RUNNER_TEMP/face-row"
          select_face_panel() {
            "$gui" click 0.095 0.099
            "$gui" click 0.023 "$1"
            sleep 1
          }
          locate_row() {
            local tag="$1" pattern="$2" attempt hit
            for attempt in 0 1 2 3 4 5 6 7 8; do
              capture_state "$tag-$attempt"
              grep -Eiq 'Face.*Hairstyle.*Body.*Outfit' "evidence/$tag-$attempt.txt" || return 1
              if hit=$("$row" "evidence/$tag-$attempt.png" "$pattern"); then
                printf '%s %s\n' "$attempt" "$hit"
                return 0
              fi
              "$gui" scroll 0.89 0.68 -7 0
              sleep 1
            done
            return 1
          }
          edit_row() {
            local tag="$1" pattern="$2" target="$3" hit attempt x y before after
            local correction="${4:-}"
            if ! hit=$(locate_row "$tag-before" "$pattern"); then
              echo "$tag CONTROL_NOT_VERIFIED" >> evidence/face-edits.txt
              return 1
            fi
            read -r attempt x y before <<< "$hit"
            "$gui" double-click "$x" "$y"
            "$gui" key 0 cmd
            "$gui" text "$target"
            "$gui" key 36
            sleep 1
            capture_state "$tag-after"
            if ! after=$("$row" "evidence/$tag-after.png" "$pattern"); then
              echo "$tag VALUE_NOT_VERIFIED" >> evidence/face-edits.txt
              return 1
            fi
            read -r x y after <<< "$after"
            printf '%s %s %s %s\n' "$tag" "$before" "$target" "$after" >> evidence/face-edits.txt
            [ "$before" != "$after" ] && [ "$target" = "$after" ] || return 1
            if [ -n "$correction" ]; then
              # Keep the observed first pass and its comparison image, then refine the delta.
              capture_views midpoint
              "$gui" double-click "$x" "$y"
              "$gui" key 0 cmd
              "$gui" text "$correction"
              "$gui" key 36
              sleep 1
              capture_state "$tag-corrected"
              after=$("$row" "evidence/$tag-corrected.png" "$pattern") || return 1
              read -r x y after <<< "$after"
              printf '%s-corrected %s %s %s\n' "$tag" "$target" "$correction" "$after" >> evidence/face-edits.txt
              [ "$correction" = "$after" ] || return 1
            fi
          }
          capture_views() {
            local stage="$1"
            "$gui" vroid-shortcut front
            sleep 1
            capture_state "face-$stage-front"
            "$gui" vroid-shortcut turn-left
            sleep 1
            capture_state "face-$stage-left"
            "$gui" vroid-shortcut turn-right
            sleep 1
            capture_state "face-$stage-right"
            "$gui" vroid-shortcut front
            sleep 1
          }
          check_row() {
            local tag="$1" pattern="$2" value="$3" hit
            hit=$(locate_row "$tag-reopened" "$pattern") || return 1
            [ "${hit##* }" = "$value" ]
          }
          try_saved_copy() {
            local candidate="$1"
            [ -s "$candidate" ] || return 1
            # A ZIP timestamp or thumbnail change alone does not establish edited model data.
            python3 - "$candidate" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile("evidence/input-model.vroid") as source, zipfile.ZipFile(sys.argv[1]) as result:
              if result.testzip() is not None or result.read("v1model/data.bin") == source.read("v1model/data.bin"):
                  sys.exit(1)
          PY
          }
          if ! grep -qx NATIVE_REOPEN_REVIEW_REQUIRED evidence/reopen-status.txt; then
            echo BLOCKED_SOURCE_REOPEN > evidence/authoring-status.txt
            exit 1
          fi
          "$gui" vroid-shortcut face
          sleep 2
          "$gui" zoom 0.50 0.50 12 0
          sleep 2
          capture_views before
          # Projected Layer 0 targets: mouth/iris span 16/51, chin 21 px below mouth,
          # profile nose extends ~10 px beyond mouth. Slider values are provisional.
          select_face_panel 0.732
          nose_ok=false
          edit_row nose '^Nose Size$' 0.080 && nose_ok=true
          select_face_panel 0.795
          mouth_ok=false
          edit_row mouth '^Mouth Width$' -0.120 -0.080 && mouth_ok=true
          select_face_panel 0.232
          select_face_panel 0.169
          chin_pattern='^(Chin (Height|Position( \(Y\))?|Length|Size)|Jaw Height)$'
          chin_ok=false
          edit_row chin "$chin_pattern" 0.060 && chin_ok=true
          capture_views after
          if ! ( "$nose_ok" || "$mouth_ok" || "$chin_ok" ); then
            echo BLOCKED_NO_VERIFIED_FACE_EDITS > evidence/authoring-status.txt
            exit 1
          fi
          working="$HOME/Documents/Morwen-resume.vroid"
          saved="$HOME/Documents/Morwen-face-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.vroid"
          test ! -e "$saved"
          capture_state save-before
          grep -Fqi 'Morwen-resume' evidence/save-before.txt
          "$gui" key 1 cmd
          sleep 5
          capture_state save-shortcut
          if ! try_saved_copy "$working"; then
            "$gui" click 0.027 0.100
            sleep 2
            capture_state save-menu
            grep -Fq 'Back to model selection' evidence/save-menu.txt
            grep -Fq 'Save As' evidence/save-menu.txt
            "$gui" click 0.03125 0.14583
            sleep 6
            capture_state save-menu-result
          fi
          if ! try_saved_copy "$working"; then
            echo BLOCKED_NATIVE_SAVE_NOT_VERIFIED > evidence/authoring-status.txt
            exit 1
          fi
          cp "$working" evidence/model.vroid
          shasum -a 256 evidence/model.vroid > evidence/model-sha256.txt
          echo NATIVE_SAVED_REOPEN_PENDING > evidence/authoring-status.txt
          cp evidence/model.vroid "$saved"
          "$gui" click 0.027 0.100
          sleep 2
          capture_state reopen-menu
          "$gui" click-label evidence/reopen-menu.png 'Back to model selection' 'Save As'
          sleep 6
          reopen_native
          capture_state checkpoint-open-dialog
          "$gui" click-label evidence/checkpoint-open-dialog.png "${saved##*/}" 'Cancel'
          sleep 2
          capture_state checkpoint-open-selected
          dialog_visible checkpoint-open-selected
          "$gui" key 36
          sleep 30
          capture_state checkpoint-reopened
          grep -Fq "${saved##*/}" evidence/checkpoint-reopened.txt
          grep -Eiq 'Face.*Hairstyle.*Body.*Outfit' evidence/checkpoint-reopened.txt
          cmp "$saved" evidence/model.vroid
          "$gui" zoom 0.50 0.50 12 0
          sleep 2
          capture_views reopened
          select_face_panel 0.732
          if "$nose_ok" && check_row nose '^Nose Size$' 0.080; then echo NOSE_REOPEN_VERIFIED >> evidence/face-edits.txt; else nose_ok=false; fi
          select_face_panel 0.795
          if "$mouth_ok" && check_row mouth '^Mouth Width$' -0.080; then echo MOUTH_REOPEN_VERIFIED >> evidence/face-edits.txt; else mouth_ok=false; fi
          select_face_panel 0.232
          select_face_panel 0.169
          if "$chin_ok" && check_row chin "$chin_pattern" 0.060; then echo CHIN_REOPEN_VERIFIED >> evidence/face-edits.txt; else chin_ok=false; fi
          echo NATIVE_CHECKPOINT_REOPENED > evidence/reopen-status.txt
          if "$nose_ok" && "$mouth_ok" && "$chin_ok"; then
            echo NATIVE_FACE_CONTROLS_REOPEN_VERIFIED_VISUAL_REVIEW_REQUIRED > evidence/authoring-status.txt
          else
            echo NATIVE_REOPENED_FACE_CONTROLS_PARTIAL > evidence/authoring-status.txt
            exit 1
          fi
          # Native editor checkpoint only; VRM export deferred until director-approved art gate.
          echo VRM_DEFERRED_NATIVE_ART_QA > evidence/vrm-status.txt
          pid="$(pgrep -x "$exe" | head -n 1 || true)"
          if [ -f "$RUNNER_TEMP/vroid-player.log" ]; then
            cp "$RUNNER_TEMP/vroid-player.log" evidence/player.log
          fi
          ps -axo pid,comm > evidence/processes.txt
          if [ -d "$HOME/Library/Logs" ]; then
            find "$HOME/Library/Logs" -maxdepth 4 -name Player.log -exec cp {} evidence/ \;
          fi
          screencapture -x evidence/screen.png || true
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -iname '*vroid*' -exec cp {} evidence/ \;
          fi
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            echo PROCESS_ALIVE > evidence/status.txt
            kill "$pid" || true
          else
            set +e
            false
            rc=$?
            set -e
            echo "PROCESS_EXITED $rc" > evidence/status.txt
            exit 1
          fi
          test -s evidence/screen.png
          test -s evidence/model.vroid
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-native-editor-checkpoint-not-adopted
          path: evidence/
          retention-days: 7

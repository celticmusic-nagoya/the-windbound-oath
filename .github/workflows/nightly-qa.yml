name: Nightly offline QA

on:
  schedule:
    # 17:30 UTC = 02:30 JST on the following day (JST has no DST).
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QA_OUT: /tmp/windbound-nightly-qa
    steps:
      - name: Prepare report directory
        id: prepare
        run: mkdir -p "$QA_OUT"
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Run existing offline tests and JSON syntax checks
        id: checks
        run: python tools/qa/run_nightly.py --out "$QA_OUT"
      - name: Record job results and failure report
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['QA_OUT'])
          out.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['STEP_RESULTS'])
          (out / 'workflow-steps.json').write_text(json.dumps(steps, indent=2) + '\n')
          report = out / 'report.md'
          if not report.exists():
              report.write_text('# Nightly QA did not complete\n\nInspect workflow-steps.json and the failed setup step in Actions logs.\n')
          with report.open('a') as f:
              f.write('\n## Workflow steps\n\n')
              for name, step in steps.items():
                  f.write(f"- {name}: {step['outcome']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(report.read_text())
          PY
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_OUT }}/
          if-no-files-found: error
          retention-days: 7

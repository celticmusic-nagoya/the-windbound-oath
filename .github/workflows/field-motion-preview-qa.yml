name: Field motion preview QA
on:
  pull_request:
    paths:
      - 'dev/field-motion-preview/**'
      - 'tests/moss/field_motion_preview.test.js'
      - '.github/workflows/field-motion-preview-qa.yml'
  push:
    branches: [main]
    paths:
      - 'dev/field-motion-preview/**'
      - 'tests/moss/field_motion_preview.test.js'
      - '.github/workflows/field-motion-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dev/field-motion-preview/preview.js
      - run: node --check tests/moss/field_motion_preview.test.js
      - run: node --test tests/moss/field_motion_preview.test.js tests/moss/field_sprite_motion.test.js

name: Morwen VRoid Studio verified launch (no model adoption)
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths: [.github/workflows/morwen-vroid-studio-launch.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morwen-vroid-studio-launch
  cancel-in-progress: false
jobs:
  verified-launch:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Verify previously supplied signed installer before bounded launch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $expected='617b59733cbbd6044d1826997157cf5ead8134d7efb8ac393f2614298fe87893'
          $report=[ordered]@{status='BLOCKED';officialMatch='UNVERIFIED';source='previously user-supplied Drive installer';attachmentMatch='NOT_RUN';pinnedSourceMatch='NOT_RUN';installation='NOT_RUN';launch='NOT_RUN';editing='NOT_RUN';export='NOT_RUN'}
          try {
            # User authorized supplied installer; official web endpoint returned HTTP 403.
            # This is the previously verified Drive source, NOT a verified copy of the chat attachment.
            $installer=Join-Path $env:RUNNER_TEMP 'VRoidStudio-v2.16.0-win.exe'
            python -m pip install --disable-pip-version-check --no-input 'gdown==5.2.0'
            if($LASTEXITCODE -ne 0){throw 'gdown installation failed'}
            python -m gdown --id '1G7vBJfw46Yo9vD-n_GzAs3jvzyGl9lfA' --output $installer --no-cookies
            if($LASTEXITCODE -ne 0){throw 'Pinned Drive transfer failed'}
            if((Get-Item $installer).Length -ne 482150144){throw 'Installer length mismatch'}
            $report.sha256=(Get-FileHash -Algorithm SHA256 $installer).Hash
            if($report.sha256 -ine $expected){throw 'Pinned installer SHA mismatch'}
            $sig=Get-AuthenticodeSignature $installer
            $report.signature=[string]$sig.Status
            $report.publisher=$sig.SignerCertificate.Subject
            if($sig.Status -ne 'Valid' -or $report.publisher -notmatch '^CN=pixiv Inc\.,'){throw 'Publisher signature verification failed'}
            if($sig.SignerCertificate.Thumbprint -ine '9E6FAFADF17FDAA9DC89ED0BB0EADCC21CCC2DA7'){throw 'Signer certificate differs from verified source'}
            $report.pinnedSourceMatch='PASS'
            if(-not [Environment]::UserInteractive -or (Get-Process -Id $PID).SessionId -eq 0){throw 'No interactive desktop'}
            # Attempt 2: identify installer engine before choosing documented arguments.
            $report.os=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber)
            $report.graphics=@(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion)
            $report.installerMetadata=(Get-Item $installer).VersionInfo | Select-Object ProductName,ProductVersion,FileDescription,CompanyName,OriginalFilename
            $raw=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($installer))
            $isInno=$raw.Contains('Inno Setup Setup Data') -or $raw.Contains('Inno Setup')
            $isNsis=$raw.Contains('NullsoftInst') -or $raw.Contains('Nullsoft Install System')
            Remove-Variable raw
            $report.engineMarkers=@{inno=$isInno;nsis=$isNsis}
            $report.engine='UNKNOWN'
            if($isInno -and -not $isNsis){$report.engine='INNO'}
            if($isNsis -and -not $isInno){$report.engine='NSIS'}
            if($report.engine -eq 'UNKNOWN'){throw 'Installer engine ambiguous; stop without speculative arguments'}
            $dest=Join-Path $env:RUNNER_TEMP 'vroid-studio'
            $log=Join-Path (Get-Location) 'evidence/installer.log'
            if($report.engine -eq 'INNO'){
              $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LOG="'+$log+'"','/DIR="'+$dest+'"')
            } else {
              # NSIS /D must be last, unquoted; /S is case-sensitive.
              $args=@('/S',('/D='+$dest))
            }
            $report.installArguments=$args
            $started=Get-Date
            $report.installation='ATTEMPTED'
            try {
              $p=Start-Process -FilePath $installer -ArgumentList $args -PassThru
              if(-not $p.WaitForExit(240000)){Stop-Process -Id $p.Id -Force;$report.installation='FAIL';throw 'Installer timeout'}
              $report.installerExitCode=$p.ExitCode
              if($p.ExitCode -ne 0){$report.installation='FAIL';throw "Installer exit $($p.ExitCode)"}
            } finally {
              @(Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$started} -ErrorAction SilentlyContinue | Select-Object -First 25 TimeCreated,Id,ProviderName,LevelDisplayName,Message) | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 evidence/install-events.json
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $r=[Windows.Forms.Screen]::PrimaryScreen.Bounds
              $b=New-Object Drawing.Bitmap($r.Width,$r.Height)
              $gfx=[Drawing.Graphics]::FromImage($b)
              try {$gfx.CopyFromScreen($r.Location,[Drawing.Point]::Empty,$r.Size);$b.Save((Join-Path (Get-Location) 'evidence/installer-screen.png'),[Drawing.Imaging.ImageFormat]::Png)} finally {$gfx.Dispose();$b.Dispose()}
            }
            $exe=Join-Path $dest 'VRoidStudio.exe'
            if(-not (Test-Path $exe)){$report.installation='FAIL';throw 'Installed executable absent'}
            $report.installation='PASS'
            $app=Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 45
            $app.Refresh()
            if($app.HasExited){throw "VRoid exited $($app.ExitCode)"}
            $report.processAlive=$true
            $report.windowTitle=$app.MainWindowTitle
            $report.windowHandle=$app.MainWindowHandle.ToInt64()
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds=[Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object Drawing.Bitmap($bounds.Width,$bounds.Height)
            $g=[Drawing.Graphics]::FromImage($bmp)
            try {
              $g.CopyFromScreen($bounds.Location,[Drawing.Point]::Empty,$bounds.Size)
              $bmp.Save((Join-Path (Get-Location) 'evidence/launch.png'),[Drawing.Imaging.ImageFormat]::Png)
            } finally {$g.Dispose();$bmp.Dispose()}
            $report.launch='PROCESS_ALIVE_SCREENSHOT_REVIEW_REQUIRED'
            $report.status='LAUNCH_CANDIDATE_UNVERIFIED'
          } catch {$report.error=$_.Exception.Message; throw}
          finally {
            if($app -and -not $app.HasExited){Stop-Process -Id $app.Id -ErrorAction SilentlyContinue}
            $report | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 evidence/launch_qa.json
            Get-Content evidence/launch_qa.json
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-verified-launch-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error

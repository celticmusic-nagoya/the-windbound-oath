name: LIND LOD25 PBR Artifact Diagnosis
on:
  pull_request:
    paths:
      - 'tools/map_blender/lind/diagnose_scan_lod_artifacts.py'
      - '.github/workflows/lind-scan-lod-artifact-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libopengl0 libgl1-mesa-dri
          blender --background --factory-startup --python-exit-code 1 --python-expr "import numpy; print('NUMPY_OK')"
      - name: Syntax preflight
        run: python3 -m py_compile tools/map_blender/lind/download_polyhaven_cliff_scan.py tools/map_blender/lind/diagnose_scan_lod_artifacts.py
      - name: Download and verify original source
        run: python3 tools/map_blender/lind/download_polyhaven_cliff_scan.py --asset coastal_cliff_04 --out out/lind-lod-diagnostic
      - name: Render five controlled Blender conditions
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/map_blender/lind/diagnose_scan_lod_artifacts.py -- --out out/lind-lod-diagnostic 2>&1 | tee out/lind-lod-diagnostic/blender.log
      - name: Verify source, renders, and Blender source
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('out/lind-lod-diagnostic')
          s=json.loads((root/'source_manifest.json').read_text())
          m=json.loads((root/'diagnostic_manifest.json').read_text())
          for x in s['files']:
              p=Path(x['path'])
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          assert m['source_triangles']>1000000 and 0<m['lod25_triangles']<m['source_triangles']
          assert len(m['conditions'])==5
          for k,v in m['conditions'].items():
              p=root/v['file'];b=p.read_bytes()
              assert b[:8]==bytes([137,80,78,71,13,10,26,10]),k
              assert hashlib.sha256(b).hexdigest()==v['sha256']
          p=root/m['blend']['file']
          assert p.read_bytes()[:7]==b'BLENDER'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['blend']['sha256']
          print('DIAGNOSTIC_SHA_PASS')
          PY
      - name: Reopen saved Blender file
        run: |
          blender --background --factory-startup --disable-autoexec out/lind-lod-diagnostic/scan_lod_artifact_diagnostic.blend --python-exit-code 1 --python-expr "import bpy; assert len([o for o in bpy.data.objects if o.type=='MESH'])==2; print('DIAGNOSTIC_REOPEN_PASS')"
      - name: Upload diagnostic source and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lind-cliff-lod25-artifact-diagnostic
          path: out/lind-lod-diagnostic/
          retention-days: 14

name: Map Blender 08 Preview
on:
  pull_request:
    paths:
      - 'tools/map_blender/map_blender_08.py'
      - 'tools/map_blender/map_blender_11_detail.py'
      - '.github/workflows/map-blender-08-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and headless OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libopengl0 libglx-mesa0 libgl1-mesa-dri xvfb
      - name: Validate Python
        run: python3 -m py_compile tools/map_blender/map_blender_08.py tools/map_blender/map_blender_11_detail.py
      - name: Generate base and additive detail previews
        env:
          MAP_OUTPUT: ${{ runner.temp }}/map-blender-08
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a blender --background --python tools/map_blender/map_blender_08.py
          xvfb-run -a blender --background --python tools/map_blender/map_blender_11_detail.py
      - name: Verify outputs and source preservation
        env:
          MAP_OUTPUT: ${{ runner.temp }}/map-blender-08
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ["MAP_OUTPUT"])
          base=json.loads((p/"build_report.json").read_text())
          detail=json.loads((p/"detail_report.json").read_text())
          for name,expected in base["files"].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==expected,name
          assert detail["source_sha256"]==base["files"]["rilde_blockout.blend"]
          for name,expected in detail["files"].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==expected,name
          print("SHA256 and base preservation: PASS")
          PY
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-blender-08-preview
          path: ${{ runner.temp }}/map-blender-08/
          if-no-files-found: warn
          retention-days: 14

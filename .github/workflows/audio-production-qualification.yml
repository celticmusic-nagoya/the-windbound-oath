name: TWO audio offline qualification
on:
  pull_request:
    paths:
      - 'tools/audio-production/**'
      - '.github/workflows/audio-production-qualification.yml'
permissions:
  contents: read
concurrency:
  group: audio-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed musical input or shared audio dependency
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os,subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','-z',os.environ['BASE_SHA']+'...'+os.environ['HEAD_SHA']]).decode().split('\0'))
          root='tools/audio-production/'
          shared=bool(paths & {root+x for x in ('process_audio.py','inspect_audio.py','export_delivery.py','delivery-smoke.mjs')})
          a01=shared or root+'render_rilde_day.py' in paths
          a02=a01 or root+'render_rilde_day_a02.py' in paths
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'a01={str(a01).lower()}\na02={str(a02).lower()}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('button_probe='+str(root+'probe_button_accordion.py' in paths).lower()+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('cc0_transport='+str(root+'stage_public_cc0.py' in paths).lower()+'\n')
          print('Music delta: A01',a01,'A02',a02)
          PY
      - name: Verify or install distribution FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffmpeg -hide_banner -filters | grep -E 'asoftclip|acompressor|highpass|equalizer'
      - name: Verify pinned CC0 button accordion samples and render short notes
        if: steps.scope.outputs.button_probe == 'true'
        run: |
          python -m py_compile tools/audio-production/probe_button_accordion.py
          python tools/audio-production/probe_button_accordion.py "$RUNNER_TEMP/button-accordion-probe"
          rm -f "$RUNNER_TEMP/button-accordion-probe/button_probe.wav"
      - name: Stage exact already-public CC0 subset for local acquisition
        if: steps.scope.outputs.cc0_transport == 'true'
        run: |
          python -m py_compile tools/audio-production/stage_public_cc0.py
          python tools/audio-production/stage_public_cc0.py "$RUNNER_TEMP/cc0-source-subset"
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.cc0_transport == 'true'
        with:
          name: upstream-public-cc0-accordion-subset
          path: ${{ runner.temp }}/cc0-source-subset/
          retention-days: 1
          if-no-files-found: error
      - name: Actual offline audio processing and QA
        run: |
          python -m py_compile tools/audio-production/process_audio.py tools/audio-production/inspect_audio.py tools/audio-production/export_delivery.py
          python tools/audio-production/process_audio.py selftest "$RUNNER_TEMP/two-audio-qualification"
      - name: Inspect current producer outputs
        run: |
          python tools/audio-production/inspect_audio.py packet "$RUNNER_TEMP/two-audio-qualification" "$RUNNER_TEMP/audio-inspection/loudness.json"
          echo "TWO_AUDIO_PACKET=$RUNNER_TEMP/two-audio-qualification" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Studio test dependencies
        working-directory: tools/production-studio
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Actual producer packet to Studio native playback
        run: node tools/audio-production/audio-packet-smoke.mjs "$TWO_AUDIO_PACKET" "$RUNNER_TEMP/audio-inspection"
      - name: Encode and decode delivery candidates, measure loop seam
        run: python tools/audio-production/export_delivery.py selftest "$TWO_AUDIO_PACKET" "$RUNNER_TEMP/audio-delivery"
      - name: Verify compressed playback and two-cycle loop render in Chromium
        run: node tools/audio-production/delivery-smoke.mjs "$RUNNER_TEMP/audio-delivery"
      - name: Render original musical candidate and verify delivery
        if: steps.scope.outputs.a01 == 'true'
        run: |
          python -m py_compile tools/audio-production/render_rilde_day.py
          python tools/audio-production/render_rilde_day.py "$RUNNER_TEMP/rilde-day-candidate"
          node tools/audio-production/delivery-smoke.mjs "$RUNNER_TEMP/rilde-day-candidate" loop
          cp "$RUNNER_TEMP/rilde-day-candidate/browser-delivery-qa.json" "$RUNNER_TEMP/rilde-day-candidate/review/"
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rilde-day-candidate/review'
          assert {x.name for x in p.iterdir()}=={'delivery.ogg','delivery.json','loudness.json','processing.json','provenance.json','browser-delivery-qa.json'}
          assert sum(x.stat().st_size for x in p.iterdir())<=524288
          PY
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.a01 == 'true'
        with:
          name: two-audio-rilde-day-original-review
          path: ${{ runner.temp }}/rilde-day-candidate/review/
          retention-days: 3
          if-no-files-found: error
      - name: Render A02 expressive musical candidate and verify delivery
        if: steps.scope.outputs.a02 == 'true'
        run: |
          python -m py_compile tools/audio-production/render_rilde_day_a02.py
          python tools/audio-production/render_rilde_day_a02.py "$RUNNER_TEMP/rilde-day-a02"
          node tools/audio-production/delivery-smoke.mjs "$RUNNER_TEMP/rilde-day-a02" loop
          cp "$RUNNER_TEMP/rilde-day-a02/browser-delivery-qa.json" "$RUNNER_TEMP/rilde-day-a02/review/"
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rilde-day-a02/review'
          assert {x.name for x in p.iterdir()}=={'delivery.ogg','delivery.json','loudness.json','processing.json','provenance.json','browser-delivery-qa.json'}
          assert sum(x.stat().st_size for x in p.iterdir())<=786432
          PY
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.a02 == 'true'
        with:
          name: two-audio-rilde-day-a02-review
          path: ${{ runner.temp }}/rilde-day-a02/review/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: two-audio-delivery-qualification
          path: ${{ runner.temp }}/audio-delivery/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: two-audio-inspection
          path: ${{ runner.temp }}/audio-inspection/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: two-audio-qualification-synthetic
          path: ${{ runner.temp }}/two-audio-qualification/
          retention-days: 7
          if-no-files-found: error

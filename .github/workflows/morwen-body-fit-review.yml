name: Morwen actual body mesh edit evidence (art FAIL retained)
on:
  push:
    branches: [feature/morwen-rebuild-01]
    paths:
      - assets/candidates/morwen-rebuild-01/body-fit-v02/**
      - docs/qa/morwen-rebuild-01/body-fit-v02/**
      - tools/morwen_rebuild01/qa_edited_body.py
      - .github/workflows/morwen-body-fit-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-mesh-edit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Blender runtime for saved-mesh QA only
        run: python -m pip install bpy==4.3.0
      - name: Verify real stored vertex edits without rebuilding source or rerendering
        run: |
          set -o pipefail
          python tools/morwen_rebuild01/qa_edited_body.py 2>&1 | tee docs/qa/morwen-rebuild-01/body-fit-v02/ci-reopen.log
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('docs/qa/morwen-rebuild-01/body-fit-v02')
          q=json.loads((p/'reopen-technical-qa.json').read_text())
          assert q['changed_vertices']==12502 and q['topology_preserved'] and q['finite']
          assert q['reopened_stored_geometry_matches_saved_delta']
          assert all((Path('assets/candidates/morwen-rebuild-01/body-fit-v02')/(v+'.png')).stat().st_size>1000 for v in ('front','back','right','left'))
          assert (p/'INDEPENDENT_ART_QA.md').is_file()
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Actual edited mesh: 12,502 changed vertices, 4 renders saved. Independent G2 FAIL; local normal-change screen FAIL. This job packages evidence and does not approve character art.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-body-fit-v02-ACTUAL-EDIT-G2-FAIL
          path: |
            assets/candidates/morwen-rebuild-01/body-fit-v02/
            docs/qa/morwen-rebuild-01/body-fit-v02/
          retention-days: 30
          if-no-files-found: error

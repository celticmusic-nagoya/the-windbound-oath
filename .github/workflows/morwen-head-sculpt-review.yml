name: Morwen head sculpt review
on:
  push:
    branches: [feature/morwen-head-sculpt-20261117]
    paths: ['tools/morwen_head/**', '.github/workflows/morwen-head-sculpt-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain preserved stage from specified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input output/stage output/evidence
          gh api repos/celticmusic-nagoya/the-windbound-oath/actions/artifacts/14298561244/zip > input/stage.zip
          python tools/morwen_head/extract_stage.py input/stage.zip output
      - uses: actions/checkout@v4
        with:
          ref: c75fee253358b1ef864ae7cdc8131b5d25084e49
          path: reference_checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          python -m pip install bpy==4.2.0 'numpy<3' Pillow zstandard
          python -c 'import bpy; import bmesh; print(bpy.app.version_string)'
      - name: Verify original official source topology and provenance
        run: |
          curl --fail --location --retry 2 --max-time 240 'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' -o input/official.zip
          python tools/morwen_head/verify_provenance.py -- input/official.zip output/stage/morwen_head_landmark_review_UNAPPROVED.blend output/candidate/provenance.json
      - name: Build editable candidate and render ten views
        run: |
          python tools/morwen_head/build_candidate.py -- --stage output/stage/morwen_head_landmark_review_UNAPPROVED.blend --canonical reference_checkout/assets/canonical/morwen/2026-11-16 --output output/candidate --samples 48
      - name: Screen technical QA (art acceptance remains separate)
        run: |
          cp docs/production/MORWEN_HEAD_SCULPT_REVIEW_20261117.md output/candidate/QA_REPORT.md
          cp docs/qa/morwen-head-sculpt-20261117/ATTEMPT_LEDGER.md output/candidate/ATTEMPT_LEDGER.md
          python tools/morwen_head/qa_candidate.py output/candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-head-candidate-${{ github.sha }}
          path: output/candidate/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-head-source-stage
          path: output/stage/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-head-source-evidence
          path: output/evidence/
          retention-days: 14
          if-no-files-found: error

name: AI 3D candidate contract QA
on:
  pull_request:
    paths:
      - 'tools/ai_3d/**'
      - 'tests/test_ai_3d_candidate_handoff.py'
      - 'tests/test_ai_3d_artifact_zip.py'
      - '.github/workflows/ai-3d-contract-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Blender audit script without importing bpy
        run: python3 -m py_compile tools/ai_3d/audit_blend_readonly.py
      - name: Run candidate contract negative controls
        run: python3 -m unittest discover -s tests -p 'test_ai_3d_candidate_handoff.py' -v
      - name: Run artifact ZIP negative controls
        run: python3 -m unittest discover -s tests -p 'test_ai_3d_artifact_zip.py' -v

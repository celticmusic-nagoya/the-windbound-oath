name: LIND canonical visual reference audit export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable reference and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          src='docs/art/reference/lind/リルド村RPGアセット全体マップ.png'
          test -f "$src"
          echo '83dd4ad1eb10103fdb7eb569e8b1b22cc92920d4c94d4eae85735125de87fe6c  '"$src" | sha256sum -c -
          cp "$src" audit-evidence/lind-canonical-map.png
          sha256sum "$src" > audit-evidence/source.sha256.txt
          file "$src" > audit-evidence/image-info.txt
      - name: Upload reference audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: lind-canon-map-audit
          path: audit-evidence/
          retention-days: 7

name: Morwen EYELID-09 attachment unit QA
on:
  push:
    branches:
      - feature/morwen-eyelid-09-lash-architecture
    paths:
      - 'tools/blender/morwen_production/eyelid_lash/**'
      - '.github/workflows/morwen-eyelid-09-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test non-mutating attachment geometry
        run: python -m unittest discover -s tools/blender/morwen_production/eyelid_lash -p 'test_*.py' -v
      - name: Syntax check Blender adapter (without Blender execution)
        run: python -m py_compile tools/blender/morwen_production/eyelid_lash/lash_blender_adapter_09.py

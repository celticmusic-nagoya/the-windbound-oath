name: Morwen scoped comment launch
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  probe:
    if: >-
      github.repository == 'celticmusic-nagoya/the-windbound-oath' &&
      github.event.issue.number == 427 && github.event.issue.pull_request &&
      github.event.sender.id == 315379131 && github.event.comment.user.id == 315379131 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/two-morwen-launch probe'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read-only connector receipt
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require("node:fs"), {execFileSync}=require("node:child_process");
          function command(e,attempt,now) {
            const c=e.comment||{};
            if(e.action!=="created"||e.repository?.full_name!=="celticmusic-nagoya/the-windbound-oath"||e.repository?.id!==1408120919||e.issue?.number!==427||!e.issue?.pull_request||e.issue?.state!=="open"||e.sender?.id!==315379131||c.user?.id!==315379131||c.author_association!=="OWNER"||!Number.isSafeInteger(c.id)||c.id<=0||c.created_at!==c.updated_at||attempt!=="1")throw Error("identity");
            const age=now-Date.parse(c.created_at);if(!Number.isFinite(age)||age<0||age>600000)throw Error("stale");
            if(c.body==="/two-morwen-launch probe")return {kind:"probe",id:c.id};
            const m=/^\/two-morwen-launch (hair_candidate|hair_review|parallel_batch|parallel_next) main=([0-9a-f]{40}) workflow=([0-9a-f]{40}) previous=([1-9][0-9]{0,14})$/.exec(c.body);
            if(!m||m[0]!==c.body)throw Error("command");
            return {kind:"start",id:c.id,mode:m[1],main:m[2],blob:m[3],previous:Number(m[4])};
          }
          const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));
          const q=command(e,process.env.GITHUB_RUN_ATTEMPT,Date.now());
          const repo="repos/celticmusic-nagoya/the-windbound-oath";
          const path=".github/workflows/morwen-vroid-macos-probe.yml";
          function api(p){return JSON.parse(execFileSync("gh",["api",p],{encoding:"utf8",timeout:20000,maxBuffer:5000000}));}
          const live=api(repo+"/issues/comments/"+q.id);
          if(live.body!==e.comment.body||live.created_at!==live.updated_at||live.created_at!==e.comment.created_at||live.user.id!==315379131||live.author_association!=="OWNER"||live.issue_url!=="https://api.github.com/"+repo+"/issues/427")throw Error("comment changed");
          if(q.kind==="probe"){console.log("READ_ONLY_CONNECTOR_RECEIVED",q.id);process.exit(0);}
          throw Error("probe only");
          JS
  accept:
    if: >-
      github.repository == 'celticmusic-nagoya/the-windbound-oath' &&
      github.event.issue.number == 427 && github.event.issue.pull_request &&
      github.event.sender.id == 315379131 && github.event.comment.user.id == 315379131 &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/two-morwen-launch hair_candidate main=') ||
       startsWith(github.event.comment.body, '/two-morwen-launch hair_review main=') ||
       startsWith(github.event.comment.body, '/two-morwen-launch parallel_batch main=') ||
       startsWith(github.event.comment.body, '/two-morwen-launch parallel_next main='))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: morwen-scoped-comment-launch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_ALLOWED: 'true'
    steps:
      - name: Validate immutable request and dispatch only the revised isolated workflow
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require("node:fs"), {execFileSync}=require("node:child_process");
          function command(e,attempt,now) {
            const c=e.comment||{};
            if(e.action!=="created"||e.repository?.full_name!=="celticmusic-nagoya/the-windbound-oath"||e.repository?.id!==1408120919||e.issue?.number!==427||!e.issue?.pull_request||e.issue?.state!=="open"||e.sender?.id!==315379131||c.user?.id!==315379131||c.author_association!=="OWNER"||!Number.isSafeInteger(c.id)||c.id<=0||c.created_at!==c.updated_at||attempt!=="1")throw Error("identity");
            const age=now-Date.parse(c.created_at);if(!Number.isFinite(age)||age<0||age>600000)throw Error("stale");
            if(c.body==="/two-morwen-launch probe")return {kind:"probe",id:c.id};
            const m=/^\/two-morwen-launch (hair_candidate|hair_review|parallel_batch|parallel_next) main=([0-9a-f]{40}) workflow=([0-9a-f]{40}) previous=([1-9][0-9]{0,14})$/.exec(c.body);
            if(!m||m[0]!==c.body)throw Error("command");
            return {kind:"start",id:c.id,mode:m[1],main:m[2],blob:m[3],previous:Number(m[4])};
          }
          function eligible(q,head,blob,prior,runs,active,priorBlob) {
           if(q.kind!=="start"||head!==q.main||blob!==q.blob||prior.id!==q.previous||prior.status!=="completed"||prior.head_branch!=="main"||prior.event!=="workflow_dispatch"||prior.path!==".github/workflows/morwen-vroid-macos-probe.yml"||!["hair_candidate","hair_review","parallel_batch","parallel_next"].includes(prior.display_title?.split(" / ")[1]?.split(" ")[0])||runs[0]?.id!==prior.id||active!==0||priorBlob===blob)throw Error("ineligible");
           if(q.mode==="hair_candidate"&&prior.conclusion==="failure"&&prior.display_title?.startsWith("Morwen VRoid / hair_candidate"))return true;
           if(q.mode==="hair_review"&&prior.conclusion==="success"&&prior.id===45572622840)return true;
           if(q.mode==="parallel_batch"&&prior.conclusion==="success"&&prior.id===45574711897)return true;
           if(q.mode==="parallel_next"&&prior.conclusion==="failure"&&[45581111206,45583270461].includes(prior.id))return true;
           throw Error("unqualified transition");
          }
          const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));
          const q=command(e,process.env.GITHUB_RUN_ATTEMPT,Date.now());
          const repo="repos/celticmusic-nagoya/the-windbound-oath";
          const path=".github/workflows/morwen-vroid-macos-probe.yml";
          function api(p){return JSON.parse(execFileSync("gh",["api",p],{encoding:"utf8",timeout:20000,maxBuffer:5000000}));}
          const live=api(repo+"/issues/comments/"+q.id);
          if(live.body!==e.comment.body||live.created_at!==live.updated_at||live.created_at!==e.comment.created_at||live.user.id!==315379131||live.author_association!=="OWNER"||live.issue_url!=="https://api.github.com/"+repo+"/issues/427")throw Error("comment changed");
          if(q.kind==="probe"){console.log("READ_ONLY_CONNECTOR_RECEIVED",q.id);process.exit(0);}
          if(process.env.LAUNCH_ALLOWED!=="true")throw Error("dispatch disabled");
          const pr=api(repo+"/pulls/427");
          if(pr.state!=="open"||pr.head.sha!=="df986c7e0549871940deb26f65f7a54f58658211")throw Error("owner HEAD changed; review required");
          const wf=repo+"/actions/workflows/morwen-vroid-macos-probe.yml";
          const head=api(repo+"/git/ref/heads/main").object.sha;
          const blob=api(repo+"/contents/"+path+"?ref="+head).sha;
          const prior=api(repo+"/actions/runs/"+q.previous);
          const runs=api(wf+"/runs?per_page=10").workflow_runs;
          let active=0;for(const s of ["queued","in_progress","waiting","requested","pending"])active+=api(wf+"/runs?status="+s+"&per_page=1").total_count;
          const priorBlob=api(repo+"/contents/"+path+"?ref="+prior.head_sha).sha;
          eligible(q,head,blob,prior,runs,active,priorBlob);
          if(q.mode==="hair_review"||q.mode==="parallel_batch"||q.mode==="parallel_next"){const a=api(repo+"/actions/artifacts/15003297779");if(a.expired||a.workflow_run?.id!==45572622840||a.digest!=="sha256:b1c9b7b61433b17c4caa160f0558461386edb0b6440b9740f6652e89565a6482")throw Error("saved candidate artifact unavailable");}
          if(blob==="3947ec75c38d439b013e60e8696a58ef070a1275")throw Error("launch metadata alone is not a production correction");
          if(runs.some(x=>x.display_title==="Morwen VRoid / "+q.mode+" request:"+q.id))throw Error("request already dispatched");
          if(api(repo+"/git/ref/heads/main").object.sha!==q.main)throw Error("main moved");
          const args=["api","--method","POST",wf+"/dispatches","--input","-"];
          execFileSync("gh",args,{input:JSON.stringify({ref:"main",inputs:{mode:q.mode,expected_main:q.main,request_id:String(q.id)}}),encoding:"utf8",timeout:20000});
          console.log("DISPATCH_ACCEPTED_NOT_RUN_PROOF",q.id);
          // Keep serialized launcher until the durable target run is visible; never retry ambiguous POST.
          for(let i=0;i<12;i++){const a=api(wf+"/runs?per_page=10").workflow_runs.filter(x=>x.display_title==="Morwen VRoid / "+q.mode+" request:"+q.id);if(a.length===1){console.log("TARGET_RUN",a[0].id);process.exit(0);}if(a.length>1)throw Error("duplicate target runs");Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,2500);}
          throw Error("dispatch receipt not visible; reconcile, do not retry");
          JS

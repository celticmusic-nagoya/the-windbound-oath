name: Morwen Blender 19 Stylized Silhouette Baseline QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/blender/morwen_blender_19/**'
      - 'tools/blender/morwen_blender_20/**'
      - '.github/workflows/morwen-blender-19.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Validate reference hashes
        run: python3 tools/blender/morwen_blender_14/build_topology_contract.py
      - name: Build anatomical torso
        run: blender -b -t 1 --python-exit-code 1 --python tools/blender/morwen_blender_18/build_monotonic_torso.py
      - name: Render clay orthographic views
        run: blender -b -t 1 --python-exit-code 1 --python tools/blender/morwen_blender_18/render_monotonic_torso.py
      - name: Measure anatomical cross-sections
        run: blender -b -t 1 --python-exit-code 1 --python tools/blender/morwen_blender_19/measure_profiles.py
      - name: Extract locked canonical alpha contours
        run: python3 tools/blender/morwen_blender_20/extract_reference_contours.py
      - name: Verify render manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/candidates/morwen-blender-18')
          d=json.loads((p/'render_report.json').read_text())
          assert d['count']==4 and not d['production_use']
          assert set(d['renders'])=={f'{v}_torso_clay.png' for v in ('front','right','back','left')}
          assert all((p/n).stat().st_size>1000 for n in d['renders'])
          print('MORWEN_18_RENDER_MANIFEST_PASS')
          PY
      - name: Upload clay renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-blender-19-baseline-and-measurements
          path: |
            assets/candidates/morwen-blender-18/
            assets/candidates/morwen-blender-19/
            assets/candidates/morwen-blender-20/
          if-no-files-found: warn
          retention-days: 14

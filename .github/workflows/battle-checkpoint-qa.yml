name: BATTLE-CHECKPOINT-01 isolated QA
on:
  pull_request:
    paths:
      - 'js/battle-checkpoint.js'
      - 'tests/battle-checkpoint.test.cjs'
      - '.github/workflows/battle-checkpoint-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/battle-checkpoint.js
      - run: node --test tests/battle-checkpoint.test.cjs

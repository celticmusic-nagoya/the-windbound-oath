name: Aidan Production Masonry Candidate QA
on:
  push:
    branches: [feature/aidan-architecture-v3-01]
    paths:
      - 'tools/map_blender/aidan_production_masonry_v1.py'
      - 'tools/map_blender/aidan_production_masonry_render_v1.py'
      - '.github/workflows/aidan-masonry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  masonry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python
        run: python3 -m py_compile tools/map_blender/aidan_production_masonry_v1.py tools/map_blender/aidan_production_masonry_render_v1.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
          blender --version
      - name: Render masonry and run structural QA
        env:
          AIDAN_MASONRY_OUTPUT: ${{ runner.temp }}/aidan-masonry
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_production_masonry_render_v1.py 2>&1 | tee masonry-blender.log
          test -s "${AIDAN_MASONRY_OUTPUT}/manifest.json"
      - name: Verify generated evidence
        env:
          AIDAN_MASONRY_OUTPUT: ${{ runner.temp }}/aidan-masonry
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['AIDAN_MASONRY_OUTPUT'])
          m=json.loads((p/'manifest.json').read_text())
          assert m['status']=='CANDIDATE_NOT_ART_APPROVED'
          assert m['stone_count']>250
          assert m['qa']['stone_mesh_count']==m['stone_count']
          assert m['qa']['door_intrusions']==0 and m['qa']['window_intrusions']==0
          assert len(m['views'])==3
          for v in m['views']:
              q=p/v['file']
              assert q.stat().st_size>1000
              assert hashlib.sha256(q.read_bytes()).hexdigest()==v['sha256']
          assert (p/'aidan_masonry_candidate.blend').stat().st_size>1000
          print('PASS: masonry candidate diagnostics; G2/G4 NOT_APPROVED')
          PY
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-masonry-candidate-qa
          path: |
            ${{ runner.temp }}/aidan-masonry/
            masonry-blender.log
          if-no-files-found: warn
          retention-days: 7

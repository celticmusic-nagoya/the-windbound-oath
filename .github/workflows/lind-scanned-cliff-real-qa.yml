name: LIND Actual CC0 Scanned Cliff Blender QA
on:
  pull_request:
    paths:
      - 'tools/map_blender/lind/download_polyhaven_cliff_scan.py'
      - 'tools/map_blender/lind/render_polyhaven_cliff_scan.py'
      - '.github/workflows/lind-scanned-cliff-real-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cliff:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libopengl0 libgl1-mesa-dri
          blender --version
      - name: Verify scripts parse before downloading the heavy scan
        run: |
          python3 -m py_compile tools/map_blender/lind/download_polyhaven_cliff_scan.py
          python3 -m py_compile tools/map_blender/lind/render_polyhaven_cliff_scan.py
      - name: Acquire real official CC0 scan with SHA-256 evidence
        run: |
          set -euo pipefail
          python3 tools/map_blender/lind/download_polyhaven_cliff_scan.py --asset coastal_cliff_04 --out out/lind-real-cliff
      - name: Blender real scan import, five render views and saved source
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/map_blender/lind/render_polyhaven_cliff_scan.py -- --asset coastal_cliff_04 --out out/lind-real-cliff 2>&1 | tee out/lind-real-cliff/blender.log
      - name: Verify original scan and rendered files
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('out/lind-real-cliff')
          s=json.loads((root/'source_manifest.json').read_text())
          m=json.loads((root/'render_manifest.json').read_text())
          assert s['source_status']=='ORIGINALS_CANDIDATE_PROTECTED'
          for f in s['files']:
              p=Path(f['path'])
              assert p.is_file()
              assert len(p.read_bytes())==f['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256']
          assert m['geometry']['triangles']>100000
          assert m['geometry']['uv_layer_count']>=1
          assert len(m['renders'])==5
          for name,v in m['renders'].items():
              p=root/v['path']
              b=p.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n',name
              assert hashlib.sha256(b).hexdigest()==v['sha256'],name
          p=root/m['blender_blend']['path']
          assert p.read_bytes()[:7]==b'BLENDER'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['blender_blend']['sha256']
          print('PASS: real scan original SHA, Blender five PNGs, UV and .blend hashes')
          PY
      - name: Reopen actual saved .blend
        run: |
          blender --background --factory-startup --disable-autoexec out/lind-real-cliff/coastal_cliff_scan_study.blend --python-exit-code 1 --python-expr "import bpy; assert sum(1 for o in bpy.data.objects if o.type=='MESH')>0; print('REOPEN_OK')"
      - name: Upload all original sources, renders, provenance and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lind-real-cc0-cliff-04-qa
          path: out/lind-real-cliff/
          retention-days: 14
          if-no-files-found: warn

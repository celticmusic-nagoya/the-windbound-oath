name: Morwen blueprint clothed reference retrieval
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths: [.github/workflows/morwen-blueprint-clothed-reference.yml]
permissions:
  contents: read
concurrency:
  group: morwen-blueprint-clothed-reference
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Preserve existing authorized public reference bytes
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git ls-files assets/official/characters/morwen/turnaround assets/companions/morwen/master/morwen-full-body-v3.png assets/companions/morwen/reference/morwen-design-sheet-v3.png > evidence/paths.txt
          while IFS= read -r path; do
            test -s "$path"
            mkdir -p "evidence/$(dirname "$path")"
            cp "$path" "evidence/$path"
            file "$path"
          done < evidence/paths.txt
          cp data/characters/morwen-canon.json data/morwen-design-canonical.json evidence/
          (cd evidence && find assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          test -s evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-existing-clothed-references-not-new-adoption
          path: evidence/
          retention-days: 7

name: HOME furniture native continuation
on:
  push:
    branches: [feature/lind-village-world-integration-plan-01]
    paths: ['.github/workflows/lind-home-checkpoint-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
concurrency:
  group: aidan-interior-candidate
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d477176179af046db7ef86f3bdf8bbe92e47b1d2
          persist-credentials: false
      - name: Verify runner and restore immutable checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .visibility)" = public
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for status in in_progress queued waiting pending requested; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=$status" --jq '.workflow_runs[] | [.id,.name,.head_branch] | @tsv'
          done > /tmp/active
          if awk -F '\t' -v self="$GITHUB_RUN_ID" '$1!=self && ($2 ~ /Aidan|Rilde|LIND.*HOME|HOME cross-run/ || $3=="feature/lind-village-world-integration-plan-01"){found=1} END{exit !found}' /tmp/active; then exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14741951418/zip" > /tmp/home.zip
          echo '297d5cc1a555f509a1059fcf7554ea8d3bba81a425f8822e23d683540882919b  /tmp/home.zip' | sha256sum -c -
          mkdir -p /tmp/restored /tmp/evidence
          unzip -q /tmp/home.zip -d /tmp/restored
          (cd /tmp/restored && sha256sum -c SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libgbm1
          echo LIBGL_ALWAYS_SOFTWARE=1 >> "$GITHUB_ENV"
          echo EGL_PLATFORM=surfaceless >> "$GITHUB_ENV"
      - name: Install verified Blender
        run: |
          set -eu
          base=https://mirror.blender.org/release/Blender5.3
          archive=blender-5.3.0-linux-x64.tar.xz
          curl -fsSL --max-time 90 "$base/blender-5.3.0.sha256" -o sums
          curl -fsSL --max-time 540 "$base/$archive" -o "$archive"
          grep "$archive" sums | sha256sum -c -
          mkdir -p /tmp/blender /tmp/blueprint
          tar -xJf "$archive" -C /tmp/blender --strip-components=1
          /tmp/blender/blender -b --factory-startup --python-exit-code 1 --python-expr 'import bpy; assert tuple(bpy.app.version)==(5,3,0)'
      - name: Qualified furniture isolation and native correction
        run: |
          set -euo pipefail
          cat >/tmp/furniture.py <<'PY'
          import bpy,json,hashlib,math
          from pathlib import Path
          from mathutils import Vector
          out=Path('/tmp/evidence')
          o=bpy.data.objects['GEO_AIDANHOUSE_INT_FURNITURE']
          assert o.matrix_world.is_identity
          # Author source: chest primitives precede cupboard; identify connected islands by exact source bounds.
          adj=[[] for v in o.data.vertices]
          for e in o.data.edges:
              a,b=e.vertices;adj[a].append(b);adj[b].append(a)
          seen=set(); groups=[]
          for v in o.data.vertices:
              if v.index in seen:continue
              stack=[v.index];seen.add(v.index);g=[]
              while stack:
                  n=stack.pop();g.append(n)
                  for k in adj[n]:
                      if k not in seen:seen.add(k);stack.append(k)
              groups.append(g)
          def bounds(g):
              p=[o.data.vertices[i].co for i in g]
              return [[min(v[k] for v in p) for k in range(3)],[max(v[k] for v in p) for k in range(3)]]
          # Source chest base x=-1.85..-1.15, lid -1.86..-1.14; y=2.16..2.71.
          candidates=[]
          for g in groups:
              a,b=bounds(g)
              if a[0]>=-1.861 and b[0]<=-1.139 and a[1]>=2.14 and b[1]<=2.712 and a[2]>=.249 and b[2]<=.91:
                  candidates.append(g)
          evidence=[bounds(g) for g in candidates]
          (out/'isolation.json').write_text(json.dumps(dict(groups=len(groups),candidate_bounds=evidence),indent=2))
          assert len(candidates)==6, 'Chest island identification ambiguous; no mutation'
          assert any(abs(a[0]+1.85)<.001 and abs(b[0]+1.15)<.001 and abs(a[2]-.25)<.001 for a,b in evidence)
          ids={n for g in candidates for n in g}
          before=[tuple(v.co) for v in o.data.vertices]
          # Move chest and candle together to free rear wall segment; preserve cupboard and all anchors.
          dx=1.4
          for n in ids:o.data.vertices[n].co.x+=dx
          o.data.update()
          proxy=bpy.data.objects['COL_AIDANHOUSE_chest']
          proxy.location.x+=dx
          bpy.context.view_layer.update()
          def box(obj):
              p=[obj.matrix_world@v.co for v in obj.data.vertices]
              return [[min(v[k] for v in p) for k in range(3)],[max(v[k] for v in p) for k in range(3)]]
          a,b=box(proxy)
          for other in bpy.context.scene.objects:
              if other==proxy or other.type!='MESH' or not other.name.startswith('COL_AIDANHOUSE_'):continue
              c,d=box(other)
              assert not all(min(b[k],d[k])-max(a[k],c[k])>1e-5 for k in (0,1,2)),other.name
          assert all(tuple(v.co)==before[v.index] for v in o.data.vertices if v.index not in ids)
          path=out/'home_furniture_candidate.blend'
          bpy.ops.wm.save_as_mainfile(filepath=str(path),compress=True)
          with path.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
          bpy.ops.wm.open_mainfile(filepath=str(path))
          assert box(bpy.data.objects['COL_AIDANHOUSE_chest'])==[a,b]
          (out/'correction.json').write_text(json.dumps(dict(native_sha256=h,delta_x=dx,isolated_vertices=len(ids),reopened=True,proxy_overlap='PASS',G1='BLOCKED',G2='NOT_RUN',G3='PARTIAL',G4='NOT_RUN'),indent=2))
          PY
          timeout 1800 /tmp/blender/blender -b --disable-autoexec /tmp/restored/home_portal_checkpoint.blend --python-exit-code 1 --python /tmp/furniture.py
          cd /tmp/evidence
          sha256sum *.json *.blend > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-cross-run-qa-${{ github.run_id }}
          path: /tmp/evidence
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=two/home-cross-run -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

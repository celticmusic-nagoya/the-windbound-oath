name: Blueprint Engine QA (Claude)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/two-blueprint-engine-qa.yml'
      - 'tools/blueprint_engine/**'
      - 'tools/production_qa/shared_blueprint_contract.py'
      - 'tools/production_qa/shared_factory_stage.py'
  push:
    branches: [infra/blueprint-engine-20261123]
    paths: ['.github/workflows/two-blueprint-engine-qa.yml', 'tools/blueprint_engine/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('two-blueprint-pr-{0}', github.event.pull_request.number) || 'two-blueprint-engine-qa' }}
  cancel-in-progress: false
jobs:
  read-only-regression:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bounded pinned runtime and prove same-job reuse
        run: |
          set -euo pipefail
          python -I tools/blueprint_engine/ensure_runtime.py | tee "$RUNNER_TEMP/bpy-preparation.json"
          python -I tools/blueprint_engine/ensure_runtime.py | tee "$RUNNER_TEMP/bpy-reuse.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['status']=='VERIFIED' and d['route']=='REUSED' and d['pip_install_calls']==0" "$RUNNER_TEMP/bpy-reuse.json"
      - name: Compile and verify engine with isolated fixtures only
        working-directory: tools
        run: |
          python -m py_compile blueprint_engine/*.py blueprint_engine/cases/*.py blueprint_engine/tests/*.py
          python -m unittest discover -s blueprint_engine/tests -t . -v
      - name: Verify shared contract and Factory regression
        working-directory: tools/production_qa
        run: python -m unittest test_shared_blueprint_contract test_shared_item_correction test_shared_lower_bound
  wheelhouse-pilot:
    # Qualification only: do not enable for normal production jobs.
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/blueprint-wheelhouse-reuse-pilot-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.lock.outputs.key }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve exact wheel digests from official metadata
        id: lock
        working-directory: tools
        run: |
          set -euo pipefail
          key=$(timeout 75s python -E -s -m blueprint_engine.wheelhouse resolve --lock "$RUNNER_TEMP/wheel-lock.json")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/wheel-lock.json"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ${{ runner.temp }}/two-bpy-wheels
          key: ${{ steps.lock.outputs.key }}
      - name: Download verified archives only on exact miss
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: tools
        run: |
          set -euo pipefail
          python -E -s -m blueprint_engine.wheelhouse download --lock "$RUNNER_TEMP/wheel-lock.json" --root "$RUNNER_TEMP/two-bpy-wheels"
      - name: Verify and install without package index
        working-directory: tools
        run: |
          set -euo pipefail
          python -E -s -m blueprint_engine.wheelhouse install --lock "$RUNNER_TEMP/wheel-lock.json" --root "$RUNNER_TEMP/two-bpy-wheels"
      - name: Check cache storage headroom
        id: headroom
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if usage=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes) &&
             [[ "$usage" =~ ^[0-9]{1,11}$ ]] &&
             (( usage + 768 * 1024**2 <= 10 * 1024**3 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cache save skipped: storage headroom unavailable"
          fi
      - uses: actions/cache/save@v4
        id: save
        if: steps.headroom.outputs.allowed == 'true'
        with:
          path: ${{ runner.temp }}/two-bpy-wheels
          key: ${{ steps.lock.outputs.key }}
      - name: Allow separate-job restore test
        id: ready
        if: steps.restore.outputs.cache-hit == 'true' || steps.save.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
  wheelhouse-pilot-warm:
    needs: wheelhouse-pilot
    if: needs.wheelhouse-pilot.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Re-resolve official digests independently
        id: lock
        working-directory: tools
        env:
          EXPECTED: ${{ needs.wheelhouse-pilot.outputs.key }}
        run: |
          set -euo pipefail
          key=$(timeout 75s python -E -s -m blueprint_engine.wheelhouse resolve --lock "$RUNNER_TEMP/wheel-lock.json")
          test "$key" = "$EXPECTED"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ${{ runner.temp }}/two-bpy-wheels
          key: ${{ steps.lock.outputs.key }}
          fail-on-cache-miss: true
      - name: Prove verified offline install on separate job
        working-directory: tools
        env:
          EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_HIT" = true
          python -E -s -m blueprint_engine.wheelhouse install --lock "$RUNNER_TEMP/wheel-lock.json" --root "$RUNNER_TEMP/two-bpy-wheels"
          python -I blueprint_engine/ensure_runtime.py
          echo "WHEELHOUSE_SEPARATE_JOB_EXACT_HIT_PASS"
  engine:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HANDOFF_TOKEN: ${{ secrets.TWO_HANDOFF_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Runtime (bounded bpy 5.3.0 build 02f0899d78e3)
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u HANDOFF_TOKEN python -I tools/blueprint_engine/ensure_runtime.py | tee "$RUNNER_TEMP/bpy-preparation.json"
      - name: Preflight
        run: python -m py_compile tools/blueprint_engine/*.py tools/blueprint_engine/cases/*.py tools/blueprint_engine/tests/*.py
      - name: 'Engine unit tests and full #468 suite (lower_bound applied in #468 2747ac90)'
        working-directory: tools
        run: |
          python -m unittest discover -s blueprint_engine/tests -t . -v
          cd production_qa && python -m unittest $(ls test_*.py | sed 's/\.py$//')
      - name: Fetch real inputs (SHA enforced by the cases)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in/layer0" "$RUNNER_TEMP/in/home" "$RUNNER_TEMP/in/vroid" "$RUNNER_TEMP/in/design"
          fetch() { gh api "repos/$REPO/actions/artifacts/$1/zip" > "$RUNNER_TEMP/in/$1.zip"; unzip -qo "$RUNNER_TEMP/in/$1.zip" -d "$2" $3; }
          # Layer0: preserved private handoff Release (zip SHA d7e006a3...) when a read token is
          # configured; otherwise the original artifact (expires 2026-12-04). PNG SHAs are
          # enforced by the cases either way; the route is recorded.
          if [ -n "${HANDOFF_TOKEN:-}" ]; then
            asset=$(GH_TOKEN="$HANDOFF_TOKEN" gh api repos/celticmusic-nagoya/the-windbound-oath-handoff/releases/tags/morwen-layer0-14602858760 --jq '.assets[]|select(.name=="morwen-layer0-original-14602858760.zip")|.id')
            GH_TOKEN="$HANDOFF_TOKEN" gh api -H "Accept: application/octet-stream" "repos/celticmusic-nagoya/the-windbound-oath-handoff/releases/assets/$asset" > "$RUNNER_TEMP/in/layer0.zip"
            echo "d7e006a37dbc739a68d3a409c6ceafd038306d856bb445c8c8c60d4e18c3d29d  $RUNNER_TEMP/in/layer0.zip" | sha256sum -c -
            unzip -qo "$RUNNER_TEMP/in/layer0.zip" -d "$RUNNER_TEMP/in/layer0"
            echo "handoff-release morwen-layer0-14602858760" > "$RUNNER_TEMP/layer0_route.txt"
          else
            fetch 14602858760 "$RUNNER_TEMP/in/layer0" ""
            echo "artifact 14602858760 (fallback; no handoff read token configured)" > "$RUNNER_TEMP/layer0_route.txt"
          fi
          cat "$RUNNER_TEMP/layer0_route.txt"
          fetch 14741418957 "$RUNNER_TEMP/in/home" "home_portal_checkpoint.blend"
          fetch 14754066570 "$RUNNER_TEMP/in/vroid" "model.vroid blueprint-targets.json"
          unzip -qo "$RUNNER_TEMP/in/14741418957.zip" checkpoint.json -d "$RUNNER_TEMP/in/home"
          mkdir -p "$RUNNER_TEMP/in/m00"; fetch 14626143604 "$RUNNER_TEMP/in/m00" "M00.blend"
          git fetch --depth=1 https://github.com/$REPO feature/lind-village-world-integration-plan-01
          mkdir -p "$RUNNER_TEMP/in/loop"
          gh api "repos/$REPO/actions/artifacts/14880921255/zip" > "$RUNNER_TEMP/in/loop.zip"
          echo "f4fe7108afa7a234832a88875053a61bf3f2dfcb9a47b83183349b6fb09fca98  $RUNNER_TEMP/in/loop.zip" | sha256sum -c -
          unzip -qo "$RUNNER_TEMP/in/loop.zip" -d "$RUNNER_TEMP/in/loop"
          git show FETCH_HEAD:assets/candidates/LIND-HOME-01/blueprint-measured-20261121/evidence.zip > "$RUNNER_TEMP/in/design/e.zip"
          unzip -qo "$RUNNER_TEMP/in/design/e.zip" measurements.json -d "$RUNNER_TEMP/in/design"
      - name: 'Map case LIND-HOME (native Blender, #468 Factory read-only stages)'
        working-directory: tools
        run: python -m blueprint_engine.cases.lind_home --design "$RUNNER_TEMP/in/design/measurements.json" --native "$RUNNER_TEMP/in/home/home_portal_checkpoint.blend" --out "$RUNNER_TEMP/out/lind_home"
      - name: Character case Morwen Layer0 + VRoid native
        working-directory: tools
        run: python -m blueprint_engine.cases.morwen_layer0 --layer0 "$RUNNER_TEMP/in/layer0" --silhouette "$RUNNER_TEMP/in/layer0/reference_silhouette_landmarks.json" --precision morwen_authored_sculpt/precision_blueprint_v2.json --vroid "$RUNNER_TEMP/in/vroid/model.vroid" --out "$RUNNER_TEMP/out/morwen"
      - name: P1-A porch semantic correspondence (read-only)
        working-directory: tools
        run: python -m blueprint_engine.cases.lind_home_porch --design "$RUNNER_TEMP/in/design/measurements.json" --native "$RUNNER_TEMP/in/home/home_portal_checkpoint.blend" --owner-checkpoint "$RUNNER_TEMP/in/home/checkpoint.json" --out "$RUNNER_TEMP/out/porch"
      - name: P1-B VRoid face front-ratio method on M00 comparator (read-only)
        working-directory: tools
        run: python -m blueprint_engine.cases.morwen_face_vrm --front "$RUNNER_TEMP/in/layer0/7809.png" --precision morwen_authored_sculpt/precision_blueprint_v2.json --landmarks morwen_authored_sculpt/layer0_landmarks_v1.json --m00 "$RUNNER_TEMP/in/m00/M00.blend" --out "$RUNNER_TEMP/out/face"
      - name: Morwen design-value inventory (read-only)
        working-directory: tools
        run: python -m blueprint_engine.cases.morwen_inventory --precision morwen_authored_sculpt/precision_blueprint_v2.json --landmarks morwen_authored_sculpt/layer0_landmarks_v1.json --silhouette "$RUNNER_TEMP/in/layer0/reference_silhouette_landmarks.json" --owner-targets "$RUNNER_TEMP/in/vroid/blueprint-targets.json" --face-out "$RUNNER_TEMP/out/face" --out "$RUNNER_TEMP/out/inventory" && cp "$RUNNER_TEMP/layer0_route.txt" "$RUNNER_TEMP/out/"
      - name: 'Native measure -> correct -> re-measure via #468 Factory (cross-run checkpoint 14880921255)'
        working-directory: tools
        run: python -m blueprint_engine.cases.native_correction_loop --artifact "$RUNNER_TEMP/in/loop" --out "$RUNNER_TEMP/out/loop"
      - name: Backward compatibility vs previous engine run (artifact 14815683256, HEAD 3696fd7c)
        working-directory: tools
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          gh api "repos/$REPO/actions/artifacts/14815683256/zip" > "$RUNNER_TEMP/baseline.zip"
          unzip -qo "$RUNNER_TEMP/baseline.zip" -d "$RUNNER_TEMP/baseline"
          rm -rf "$RUNNER_TEMP/baseline/loop"
          python -m blueprint_engine.cases.compat_check --baseline "$RUNNER_TEMP/baseline" --candidate "$RUNNER_TEMP/out" --out "$RUNNER_TEMP/out/compat_vs_3696fd7c.json"
      - name: Deterministic output digest (cross-run comparison)
        run: |
          cd "$RUNNER_TEMP/out"
          find lind_home morwen porch face inventory loop -path '*/factory/*' -prune -o -type f \( -path '*/residual/*' -o -path '*/targets/*' -o -path '*/handoff/*' -o -name blueprint.json -o -name porch_correspondence.json -o -name official_remeasure_research.json -o -path '*/proposal/*' -o -name morwen_inventory.json -o -path 'loop/target.json' -o -path 'loop/handoff.json' -o -path 'loop/blueprint.json' \) -print | sort | xargs sha256sum | tee deterministic.sha256
          sha256sum deterministic.sha256
          python -c "import json;s=json.load(open('loop/native_correction_loop.json'));print('loop', s['verdict'], s['results']['correct']['output_native_sha256'])"
          # no native or official source bytes leave the runner
          find . -path '*/factory/*' \( -name 'native.*' \) -delete
      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-engine-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: error

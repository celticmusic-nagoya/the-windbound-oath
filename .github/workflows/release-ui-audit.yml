name: Release UI Audit Self-Test
on:
  pull_request:
    paths:
      - 'tools/qa/check_release_ui.py'
      - 'index.html'
      - '.github/workflows/release-ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release audit rejects development HTML and accepts clean fixture
        shell: bash
        run: |
          set -euo pipefail
          if python tools/qa/check_release_ui.py index.html; then
            echo "::error::Development HTML incorrectly passed release audit"
            exit 1
          fi
          fixture="$(mktemp --suffix=.html)"
          trap 'rm -f "$fixture"' EXIT
          printf '%s\n' '<!doctype html><html><body><main>Game</main></body></html>' > "$fixture"
          python tools/qa/check_release_ui.py "$fixture"
          echo "Audit self-test PASS; this is NOT a release artifact approval."

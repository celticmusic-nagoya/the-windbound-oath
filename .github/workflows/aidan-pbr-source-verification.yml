name: Aidan Home PBR Source Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/map_blender/aidan_pbr_shortlist.json'
      - 'tools/map_blender/verify_pbr_shortlist.py'
      - '.github/workflows/aidan-pbr-source-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate shortlist JSON and verifier syntax
        run: |
          python -m json.tool tools/map_blender/aidan_pbr_shortlist.json > /dev/null
          python -m py_compile tools/map_blender/verify_pbr_shortlist.py
      - name: Verify exact source IDs using provider metadata APIs
        continue-on-error: true
        run: |
          python tools/map_blender/verify_pbr_shortlist.py tools/map_blender/aidan_pbr_shortlist.json "${RUNNER_TEMP}/pbr/source-report.json"
      - name: Save metadata report (no assets downloaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-pbr-source-metadata
          path: ${{ runner.temp }}/pbr/source-report.json
          if-no-files-found: warn
          retention-days: 7

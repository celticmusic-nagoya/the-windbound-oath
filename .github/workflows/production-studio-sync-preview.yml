name: Production Studio sync preview
on:
  pull_request:
    paths:
      - 'tools/production-studio/**'
      - '.github/workflows/production-studio-sync-preview.yml'
      - '.github/workflows/production-studio-publish.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-sync-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate model discovery and exact script syntax
        working-directory: tools/production-studio
        run: |
          python -m py_compile discover-gallery.py artifact-sync.py stage-village.py
          node --check gallery-smoke.mjs
          node --check recent-review-artifacts.js
          node --check zip-preview.js
          node --test test_recent_review_artifacts.cjs
          bash -n sync-preview.sh
          python -m unittest discover -s . -p test_publication_gate.py -v
          python - <<'PY'
          import runpy
          d=runpy.run_path('discover-gallery.py')
          assert d['model_allowed']('export/model.glb')
          assert d['model_allowed']('checkpoint/models/model.vrm')
          for p in ['../models/x.glb','/models/x.glb','native/x.blend','models/x.png','x.glb']:
              assert not d['model_allowed'](p), p
          assert d['vroid_review_allowed']('rear-calibration-5.png')
          assert d['vroid_review_allowed']('evidence/view-isolated-reopen-front.png')
          for p in ['screen-60s.png','resumed-editor.png','before-input.png','../rear-calibration-5.png','evidence/../rear-calibration-5.png','rear-calibration-9.png','input-model.vroid']:
              assert not d['vroid_review_allowed'](p), p
          PY
      - run: bash tools/production-studio/sync-preview.sh
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_PREVIEW_MODELS: '1'
      - name: Verify isolated multi-domain review import
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          selection=json.loads((root/'studio-selection.json').read_text())
          reviews=[x for x in selection if x.get('stage','').endswith('/ preview only')]
          manifest=json.loads((root/'studio-site/gallery-manifest.json').read_text())
          for review in reviews:
              records=[x for x in manifest['entries'] if x.get('artifact_id')==review['artifact_id']]
              assert {x['name'] for x in records}==set(review['entries']), 'Review missing from staged gallery'
              assert all(x['head']==review['head'] and x['run_id']==review['run_id'] for x in records)
              assert all(x['category']==review['category'] and x['qa']=='NOT_RUN' and x['adoption']=='UNDETERMINED' for x in records), review['artifact_id']
              assert all(x['sha256']==review['entry_sha256'][x['name']] for x in records) if 'entry_sha256' in review else True
              print('Review staged:', review['artifact_id'], review['category'], len(records))
          if not reviews:
              print('NOT_RUN: no eligible unexpired review found')
          PY
      - name: Verify retained snapshot before publication
        run: |
          set -euo pipefail
          # Read the real published snapshot without modifying its branch.
          git fetch --no-tags --depth=1 origin refs/heads/studio-published
          git worktree add --detach "$RUNNER_TEMP/studio-live-history" FETCH_HEAD
          git -C "$RUNNER_TEMP/studio-live-history" rev-parse HEAD
          python tools/production-studio/merge-gallery.py "$RUNNER_TEMP/studio-live-history" "$RUNNER_TEMP/studio-site" "$RUNNER_TEMP/retained"
          cp "$RUNNER_TEMP/retained/gallery-manifest.json" "$RUNNER_TEMP/studio-site/"
          mkdir -p "$RUNNER_TEMP/studio-site/published"
          cp -r "$RUNNER_TEMP/retained/published/." "$RUNNER_TEMP/studio-site/published/"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          selection=json.loads((root/'studio-selection.json').read_text())
          entries=json.loads((root/'studio-site/gallery-manifest.json').read_text())['entries']
          historical=json.loads((root/'studio-live-history/gallery-manifest.json').read_text())['entries']
          preserved={x['sha256'] for x in historical}
          assert preserved <= {x['sha256'] for x in entries}, 'Historical published bytes lost'
          print('Published history preserved:', len(preserved), 'total preview:', len(entries))
          for review in selection:
              if review.get('stage','').endswith('/ preview only'):
                  actual={x['name'] for x in entries if x.get('artifact_id')==review['artifact_id']}
                  assert actual==set(review['entries']), 'Review lost during retention'
                  print('Review retained:', review['artifact_id'], review['category'], sorted(actual))
          PY
      - name: Verify public boundary against actual preview and live history
        run: |
          python tools/production-studio/publication-gate.py filter "$RUNNER_TEMP/studio-live-history/gallery-manifest.json" "$RUNNER_TEMP/studio-site/gallery-manifest.json" tools/production-studio/publication-approvals.json "$RUNNER_TEMP/public-delta.json"
          mkdir -p "$RUNNER_TEMP/approved-only/published"
          cp "$RUNNER_TEMP/public-delta.json" "$RUNNER_TEMP/approved-only/gallery-manifest.json"
          python - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          history={e['sha256'] for e in json.loads((root/'studio-live-history/gallery-manifest.json').read_text())['entries']}
          receipts=json.loads(pathlib.Path('tools/production-studio/publication-approvals.json').read_text())['entries']
          delta=json.loads((root/'public-delta.json').read_text())['entries']
          assert {e['sha256'] for e in delta}=={e['sha256'] for e in receipts}-history, 'Approved but missing staged source'
          for e in delta:
              shutil.copyfile(root/'studio-site'/e['path'],root/'approved-only'/e['path'])
          PY
          python tools/production-studio/merge-gallery.py "$RUNNER_TEMP/studio-live-history" "$RUNNER_TEMP/approved-only" "$RUNNER_TEMP/public-dry-run"
          python tools/production-studio/publication-gate.py verify "$RUNNER_TEMP/studio-live-history/gallery-manifest.json" "$RUNNER_TEMP/public-delta.json" "$RUNNER_TEMP/public-dry-run/gallery-manifest.json"
      - name: Verify actual gallery in mobile browser
        working-directory: tools/production-studio
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.51.1
          npx playwright install --with-deps chromium
          node gallery-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-gallery-qa
          path: tools/production-studio/gallery-qa/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: studio-sync-preview
          path: ${{ runner.temp }}/studio-site/
          if-no-files-found: error

name: Morwen editable body candidate 01
on:
  workflow_dispatch:
  push:
    branches: [feature/morwen-fable-eval-01]
    paths:
      - 'tools/character_blender/build_morwen_body_candidate.py'
      - '.github/workflows/morwen-editable-body-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify immutable official CC0 basemesh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/morwen"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o "$RUNNER_TEMP/morwen/source.zip"
          echo "811f43accbb31a88266d932f8f5563b2d13586fca0ba2693aad1f5fe582b3515  $RUNNER_TEMP/morwen/source.zip" | sha256sum -c -
          python - <<'PY'
          import os,pathlib,zipfile,shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"morwen"
          with zipfile.ZipFile(root/"source.zip") as z:
            matches=[i for i in z.infolist() if i.filename.endswith("/human_base_meshes_bundle.blend")]
            if len(matches)!=1:raise SystemExit("BLOCKED source count")
            with z.open(matches[0]) as f,(root/"source.blend.zst").open("wb") as o:shutil.copyfileobj(f,o)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y zstd libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          zstd -dc "$RUNNER_TEMP/morwen/source.blend.zst" > "$RUNNER_TEMP/morwen/source.blend"
          echo "e5e9d30a7e6bb385fed21459dce68d1ad0d06e7bde4f9626696dbfda07cd541a  $RUNNER_TEMP/morwen/source.blend" | sha256sum -c -
      - name: Install pinned Blender Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: bpy==4.2.0 -d "$RUNNER_TEMP/morwen"
          echo "a8217c2bd7b3424d1f51ce0698c0bf65439de352f7f6ed7b9942e2a9e5eb121b  $RUNNER_TEMP/morwen/bpy-4.2.0-cp311-cp311-manylinux_2_28_x86_64.whl" | sha256sum -c -
          python -m pip install --no-deps "$RUNNER_TEMP/morwen/bpy-4.2.0-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install 'numpy>=1.26,<3'
      - name: Generate editable deformed mesh and four-view PNGs
        run: |
          python tools/character_blender/build_morwen_body_candidate.py \
            --source "$RUNNER_TEMP/morwen/source.blend" \
            --output qa_output/morwen_body_candidate_01.blend \
            --renders qa_output/morwen_body_candidate_01_renders
      - name: Upload editable candidate and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-editable-body-candidate-01
          path: |
            qa_output/morwen_body_candidate_01.blend
            qa_output/morwen_body_candidate_01_renders/
          retention-days: 14
          if-no-files-found: warn

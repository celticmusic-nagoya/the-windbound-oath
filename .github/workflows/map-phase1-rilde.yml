name: MAP Phase1 Rilde render
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/map_blender/phase1_rilde_scene.py'
      - '.github/workflows/map-phase1-rilde.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender xvfb
      - name: Syntax check
        run: python3 -m py_compile tools/map_blender/phase1_rilde_scene.py
      - name: Render
        run: xvfb-run -a blender -b -t 2 --python tools/map_blender/phase1_rilde_scene.py
      - name: Validate outputs
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          d=Path('/tmp/map-preview/rilde_phase1')
          m=json.loads((d/'manifest.json').read_text())
          for name,digest in m['files'].items():
            p=d/name
            assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          assert (d/'rilde_base_game_view.png').read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          print('MAP-PHASE1 artifact PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-phase1-rilde
          path: /tmp/map-preview/rilde_phase1/
          retention-days: 14

name: TWO isolated village garden V7
on:
  pull_request:
    types: [synchronize]
    paths: ['tools/map_blender/lind/home/village_garden_v7.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: two-village-garden-v7
  cancel-in-progress: false
jobs:
  garden:
    if: github.event.pull_request.number == 364 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/map_blender/lind/home/village_garden_v7.py
      - uses: actions/checkout@v4
        with:
          ref: dd47929f3e100b3cfcabbe48a614e699da1c5ea9
          path: engine
          persist-credentials: false
          sparse-checkout: |
            tools/blueprint_engine
            tools/production_qa
      - name: Restore exact checkpoints and verified CC0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v6" "$RUNNER_TEMP/photos" "$RUNNER_TEMP/out"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15100310764/zip" > "$RUNNER_TEMP/v6.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14670447492/zip" > "$RUNNER_TEMP/photos.zip"
          curl -fsSL --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Models/blend/1k/rock_07/rock_07_1k.blend' -o "$RUNNER_TEMP/rock.blend"
          printf '%s  %s\n' a91695b693734133a02ceb97c480b5836eaf885bff3662403ffc0f45cb5c0101 "$RUNNER_TEMP/v6.zip" 4edaab28ebde25b29537edd86aa4a6f284d062fa7e71a6b7fa2c900818014b6e "$RUNNER_TEMP/photos.zip" da8010774291c5d0acfbcc3b82b367be06c5ed0926640147de5f17371ef227d1 "$RUNNER_TEMP/rock.blend" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/v6.zip"
          unzip -tq "$RUNNER_TEMP/photos.zip"
          unzip -q "$RUNNER_TEMP/v6.zip" -d "$RUNNER_TEMP/v6"
          unzip -q "$RUNNER_TEMP/photos.zip" -d "$RUNNER_TEMP/photos"
          python3 -m py_compile 'tools/map_blender/lind/home/village_garden_v7.py'
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash engine/tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 --python 'tools/map_blender/lind/home/village_garden_v7.py' -- "$RUNNER_TEMP/v6/village_turf_context_v6_UNAPPROVED.blend" "$RUNNER_TEMP/rock.blend" "$RUNNER_TEMP/photos" "$RUNNER_TEMP/out" "$PWD/engine"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-village-garden-v7
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14
  cliff-readback:
    if: github.event.pull_request.number == 364 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read existing offshore V4 push evidence without dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cliff"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=11ea502a1dba25d1ff897e19351ee29763ea3158&per_page=100" --jq '[.workflow_runs[]|{id,name,event,status,conclusion,head_sha,html_url}]' > "$RUNNER_TEMP/cliff/runs.json"
          python3 - "$RUNNER_TEMP/cliff" <<'PY'
          import json,sys,subprocess,os
          from pathlib import Path
          p=Path(sys.argv[1]); runs=json.loads((p/'runs.json').read_text())
          for r in runs:
              if 'coast PBR V4' not in r['name']:continue
              result=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{r['id']}/artifacts"])
              (p/f"artifacts-{r['id']}.json").write_bytes(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: two-cliff-v4-readback
          path: ${{ runner.temp }}/cliff
          if-no-files-found: error
          retention-days: 7

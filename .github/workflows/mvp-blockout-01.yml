name: Morwen Blockout 01 Candidate Export
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/blender/mvp_blockout_01/**'
      - '.github/workflows/mvp-blockout-01.yml'
jobs:
  blockout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libopengl0
      - run: python3 -m py_compile tools/blender/mvp_blockout_01/build.py
      - run: blender -b -noaudio --python tools/blender/mvp_blockout_01/build.py
      - run: blender -b -noaudio --python tools/blender/mvp_blockout_01/render_views.py
      - run: blender -b -noaudio --python tools/blender/mvp_blockout_01/rig_walk.py
      - run: blender -b -noaudio --python tools/blender/mvp_blockout_01/render_walk.py
      - run: |
          python3 -m pip install --break-system-packages Pillow
          python3 tools/blender/mvp_blockout_01/qa_walk_frames.py
          python3 tools/blender/mvp_blockout_01/package_walk.py
      - name: Candidate output QA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/candidates/mvp-blockout-01')
          r=json.loads((p/'report.json').read_text())
          assert r['candidate_only'] and not r['canonical_assets_modified']
          assert r['morwen_parts']==15
          for name in ('morwen_blockout',):
              for ext in ('.blend','.glb'):
                  f=p/(name+ext)
                  assert f.is_file() and f.stat().st_size>100
          for view in ('front','left','right','back'):
              f=p/'views'/(view+'.png')
              assert f.is_file() and f.stat().st_size>1000,view
          rig=json.loads((p/'rig_report.json').read_text())
          assert rig['core_bones']==22 and rig['weighted_parts']==15
          assert rig['cycle_frames']==8 and not rig['canonical_modified']
          assert (p/'morwen_rig_walk_candidate.blend').stat().st_size>1000
          for direction in ('front','left','right','back'):
              for frame in range(1,9):
                  f=p/'walk_views'/direction/(f'{frame:02d}.png')
                  assert f.is_file() and f.stat().st_size>1000,str(f)
          assert (p/'MORWEN_RIG_02_VISUAL_QA.zip').stat().st_size>10000
          assert (p/'MORWEN_WALK_4DIR_8F_CONTACT_SHEET.png').stat().st_size>10000
          print('MORWEN_RIG_02_VISUAL_QA_PACKAGE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-blockout-01
          path: assets/candidates/mvp-blockout-01/
          if-no-files-found: warn

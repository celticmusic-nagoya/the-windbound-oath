name: Morwen 26 Bone Rig Template QA
on:
  push:
    branches:
      - feature/morwen-production-pipeline-01
    paths:
      - 'tools/blender/morwen_production/build_master_rig.py'
      - '.github/workflows/morwen-rig-template-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rig-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libopengl0
      - name: Validate syntax
        run: python3 -m py_compile tools/blender/morwen_production/build_master_rig.py
      - name: Build rig template
        run: blender -b -noaudio -t 2 --python tools/blender/morwen_production/build_master_rig.py
      - name: Verify output
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("render_output/morwen_rig_template")
          q=json.loads((p/"QA.json").read_text())
          assert q["bones"]==26,q
          assert q["approved_master_model"] is False,q
          assert (p/"MORWEN_26_BONE_RIG_TEMPLATE.blend").stat().st_size>1000
          print("RIG_TEMPLATE_STRUCTURE_PASS")
          PY
      - name: Upload rig and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-26-bone-rig-template
          path: render_output/morwen_rig_template/
          retention-days: 30
          if-no-files-found: warn

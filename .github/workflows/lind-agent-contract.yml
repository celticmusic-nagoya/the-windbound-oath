name: LIND shared agent contract QA
on:
  pull_request:
    paths:
      - AGENTS.md
      - HANDOFF.md
      - Blender.md
      - 'docs/production/LIND_*20261116.md'
      - 'tools/map_blender/validate_lind_new_world_topology.py'
      - 'docs/production/lind-new-world-topology.v1.json'
      - '.github/workflows/lind-agent-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate shared entrypoints and canonical source pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          expected = 'abbb3997b63ea5d86eea01f68bd220f0713baf4e90afaaa37684ec2687dc0620'
          for name in ('AGENTS.md','HANDOFF.md','Blender.md'):
              p=Path(name)
              assert p.is_file() and p.stat().st_size>100, name
          agents=Path('AGENTS.md').read_text()
          handoff=Path('HANDOFF.md').read_text()
          blender=Path('Blender.md').read_text()
          assert 'HANDOFF.md' in agents and 'Blender.md' in agents
          assert 'AGENTS.md' in handoff and 'Blender.md' in handoff
          assert 'AGENTS.md' in blender and 'HANDOFF.md' in blender
          assert all(expected in s for s in (agents,handoff,blender))
          assert 'BLOCKED' in handoff and 'NOT_RUN' in blender
          assert 'G1' in blender and 'G2' in blender and 'G3' in blender and 'G4' in blender
          print('PASS: shared AI/Blender documentation contract and canonical SHA references')
          PY
      - name: Validate spatial graph
        run: python3 tools/map_blender/validate_lind_new_world_topology.py

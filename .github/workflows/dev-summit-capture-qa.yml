name: DEV summit capture QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'dev-fresh-20261108.html'
      - 'tests/moss/dev_summit_capture.test.js'
      - '.github/workflows/dev-summit-capture-qa.yml'
  push:
    paths:
      - 'index.html'
      - 'dev-fresh-20261108.html'
      - 'tests/moss/dev_summit_capture.test.js'
      - '.github/workflows/dev-summit-capture-qa.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/moss/dev_summit_capture.test.js

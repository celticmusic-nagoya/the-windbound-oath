name: Morwen source-only stylized base matched render
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths:
      - .github/workflows/morwen-cc0-stylized-matched-render.yml
      - tools/morwen_authored_sculpt/render_official_base_candidates_530.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morwen-stylized-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static syntax and exact pinned source verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/morwen_authored_sculpt/render_official_base_candidates_530.py
          bash -n tools/production_qa/install_blender_530.sh
          mkdir -p /tmp/morwen-stylized-source
          asset=demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip
          for origin in https://download.blender.org https://mirror.blender.org; do
            if curl --fail --location --max-time 90 --max-filesize 70000000 \
              --user-agent 'Mozilla/5.0 (compatible; TWO-source-verification/1.0)' \
              --output /tmp/morwen-stylized-source/source.zip "$origin/$asset"; then
              break
            fi
          done
          echo '811f43accbb31a88266d932f8f5563b2d13586fca0ba2693aad1f5fe582b3515  /tmp/morwen-stylized-source/source.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib
          p=pathlib.Path('/tmp/morwen-stylized-source')
          with zipfile.ZipFile(p/'source.zip') as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if n.endswith('human_base_meshes_bundle.blend')]
              assert len(names)==1
              (p/'source.blend').write_bytes(z.read(names[0]))
          PY
      - name: Install pinned Blender 5.3
        run: bash tools/production_qa/install_blender_530.sh /tmp/two-blender-530/app
      - name: Render real untouched source candidates with CPU Cycles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/morwen-stylized-source/output
          /tmp/two-blender-530/app/blender -b --factory-startup --disable-autoexec --threads 4 --python-exit-code 1 --python tools/morwen_authored_sculpt/render_official_base_candidates_530.py -- /tmp/morwen-stylized-source/output /tmp/morwen-stylized-source/source.blend /tmp/morwen-stylized-source/source.zip
          cd /tmp/morwen-stylized-source/output
          for asset in head body_female; do
            for view in front right back left three_quarter wire; do
              test -s "${asset}_${view}.png"
            done
            MORWEN_SOURCE_SLUG="$asset" /tmp/two-blender-530/app/blender -b --disable-autoexec \
              "${asset}_source_candidate.blend" --python-exit-code 1 --python-expr '
          import bpy, json, os
          from pathlib import Path
          row = json.loads(Path("source_candidate_qa.json").read_text())["objects"][os.environ["MORWEN_SOURCE_SLUG"]]
          for name, expected in row["meshes"].items():
              obj = bpy.context.scene.objects[name]
              assert (len(obj.data.vertices), len(obj.data.edges), len(obj.data.polygons)) == (expected["vertices"], expected["edges"], expected["faces"])
              assert [list(matrix_row) for matrix_row in obj.matrix_world] == expected["world_matrix"]
          assert bpy.context.scene.get("asset_status") == "SOURCE_ONLY_NOT_ADOPTED"
          print("SOURCE_REOPEN_PASS", row["source_collection"])
          '
          done
          sha256sum *.blend *.png *.json > SHA256SUMS
      - name: Upload actual source mesh comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: morwen-blender-studio-stylized-source-only-not-adopted
          path: /tmp/morwen-stylized-source/output/
          retention-days: 14
          if-no-files-found: error

name: Blender Common Rig QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/blender/build_common_rig.py'
      - 'tools/blender/rigs/humanoid_v1.json'
      - '.github/workflows/blender-common-rig-qa.yml'
permissions:
  contents: read
jobs:
  build-rig:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Python syntax
        run: python3 -m py_compile tools/blender/build_common_rig.py
      - name: Generate armature
        run: blender --background --threads 1 --python tools/blender/build_common_rig.py
      - name: Check generated files
        run: |
          test -s /tmp/common-rig-02/humanoid_v1.blend
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/common-rig-02/qa.json').read_text())
          assert d['status'] == 'PASS'
          assert d['bone_count'] == 17
          assert d['parent_links'] == 16
          assert d['production_assets_modified'] is False
          print('COMMON_RIG_QA_PASS')
          PY
      - name: Upload candidate rig
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-rig-02-candidate
          path: |
            /tmp/common-rig-02/humanoid_v1.blend
            /tmp/common-rig-02/qa.json
          if-no-files-found: warn
          retention-days: 7

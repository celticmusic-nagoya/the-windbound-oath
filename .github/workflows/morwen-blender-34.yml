name: Morwen Blender 34 Isolated Scene QA
on:
  pull_request:
    paths:
      - 'tools/blender/morwen_blender_34/**'
      - '.github/workflows/morwen-blender-34.yml'
  workflow_dispatch:
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil libegl1 libgl1 libopengl0 libx11-6 libxext6 libxrender1
      - name: Syntax and source build
        run: |
          python3 -m py_compile tools/blender/morwen_blender_34/isolated_render.py
          blender -b -noaudio --python tools/blender/morwen_blender_24/build_torso.py
      - name: Isolated scene render
        run: blender -b -noaudio --python tools/blender/morwen_blender_34/isolated_render.py
      - name: Alpha diagnostics
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/candidates/morwen-blender-34/front_isolated.png')
          im=Image.open(p).convert('RGBA')
          a=im.getchannel('A')
          bounds=a.getbbox()
          print('size',im.size,'alpha_extrema',a.getextrema(),'bbox',bounds,'corners',[a.getpixel(x) for x in ((0,0),(511,0),(0,767),(511,767))],flush=True)
          assert im.size==(512,768)
          assert bounds is not None,'empty silhouette'
          assert a.getextrema()[0]==0,'isolated scene still opaque'
          x0,y0,x1,y1=bounds
          assert 10<x0<x1<502 and 10<y0<y1<758,f'cropped: {bounds}'
          print('MORWEN_34_ALPHA_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-34-isolated-front
          path: assets/candidates/morwen-blender-34/
          if-no-files-found: warn

name: Morwen visual QA handoff from existing artifact
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths:
      - tools/production_qa/build_visual_qa_handoff.py
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing successful render workflow run ID (no rerender)
        required: true
        type: string
      artifact_name:
        description: Existing artifact name (must contain PNG, blend or QA files)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: morwen-visual-qa-handoff-${{ github.event_name }}-${{ github.sha }}-${{ inputs.source_run_id }}-${{ inputs.artifact_name }}
  cancel-in-progress: false
jobs:
  smoke-handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and exercise deterministic handoff on synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/production_qa/build_visual_qa_handoff.py
          mkdir -p /tmp/two-fixture /tmp/two-fixture-out
          printf 'QA_FIXTURE_NOT_A_RENDER\\n' > /tmp/two-fixture/fixture.txt
          python3 tools/production_qa/build_visual_qa_handoff.py --input /tmp/two-fixture --output /tmp/two-fixture-out --asset morwen-test
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/two-fixture/fixture.txt')
          d=json.loads(pathlib.Path('/tmp/two-fixture-out/visual_qa_handoff.json').read_text())
          assert d['inputs'][0]['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert d['gates']['G2']=='NOT_RUN'
          assert d['scope']=='EVIDENCE_ONLY_NO_ARTISTIC_PASS'
          print('SYNTHETIC_HANDOFF_SMOKE_PASS_NOT_RENDER')
          PY
  package-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate supplied source identifiers
        env:
          SOURCE_RUN: ${{ inputs.source_run_id || '44671624893' }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_name || 'morwen-530-source-geometry-mask-diagnostics-not-adopted' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]{5,20}$ ]] || { echo 'Invalid run ID'; exit 2; }
          [[ "$SOURCE_ARTIFACT" =~ ^[a-zA-Z0-9_.-]{3,120}$ ]] || { echo 'Invalid artifact name'; exit 2; }
      - name: Download previously generated render evidence (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || '44671624893' }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_name || 'morwen-530-source-geometry-mask-diagnostics-not-adopted' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/two-existing-render
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/two-existing-render
          test -n "$(find /tmp/two-existing-render -type f -print -quit)"
      - name: Generate deterministic Claude/Codex evidence handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/production_qa/build_visual_qa_handoff.py --input /tmp/two-existing-render --output /tmp/two-visual-qa-handoff --asset morwen
          python3 -m json.tool /tmp/two-visual-qa-handoff/visual_qa_handoff.json >/dev/null
      - name: Upload QA handoff only (no AI API or rerender)
        uses: actions/upload-artifact@v4
        with:
          name: morwen-visual-qa-handoff-${{ inputs.source_run_id || '44671624893' }}
          path: /tmp/two-visual-qa-handoff/visual_qa_handoff.json
          if-no-files-found: error
          retention-days: 7

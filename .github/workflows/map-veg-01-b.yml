name: MAP-VEG-01 grass candidate B Blender render
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/map_blender/map_veg_01_generate.py'
      - 'tools/map_blender/map_veg_01_manifest_qa.py'
      - '.github/workflows/map-veg-01-b.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m py_compile tools/map_blender/map_veg_01_generate.py tools/map_blender/map_veg_01_manifest_qa.py
      - name: Install pinned Blender 4.2.3 LTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libx11-6 libxrender1 libxfixes3 libxi6 libxxf86vm1 libxkbcommon0 libsm6
          curl -sSL --retry 3 --retry-delay 4 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          xz -t "$RUNNER_TEMP/blender.tar.xz"
          tar xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Generate candidate grass clumps and three views
        run: |
          "$RUNNER_TEMP/blender-4.2.3-linux-x64/blender" -b -t 2 --python tools/map_blender/map_veg_01_generate.py -- --out "$RUNNER_TEMP/map-veg-01-b" --seed 20261116 --samples 24
      - name: Validate manifest and artifact hashes
        run: |
          python3 tools/map_blender/map_veg_01_manifest_qa.py "$RUNNER_TEMP/map-veg-01-b/manifest.json"
      - name: Upload candidate render and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-veg-01-grass-master-B
          path: ${{ runner.temp }}/map-veg-01-b/
          if-no-files-found: warn
          retention-days: 14

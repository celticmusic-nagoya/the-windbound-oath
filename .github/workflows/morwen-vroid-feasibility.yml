name: Morwen VRoid Studio and Hub feasibility (manual, no adoption)
on:
  workflow_dispatch:
    inputs:
      validation_target:
        description: 'Select only the necessary verification jobs to avoid repeated downloads'
        required: true
        type: choice
        default: vrm_only
        options:
          - vrm_only
          - studio_only
          - all
          - vrm_fixture
          - vrm_upstream_fixture
      vrm_fixture_url:
        description: 'Direct HTTPS URL of rights-cleared .vrm fixture; required for vrm_fixture'
        required: false
        type: string
      vrm_fixture_sha256:
        description: 'Expected SHA-256 for fixture; required for vrm_fixture'
        required: false
        type: string
      studio_installer_url:
        description: 'Official HTTPS direct Windows installer URL (leave empty to mark download BLOCKED)'
        required: false
        type: string
      studio_sha256:
        description: 'Expected official installer SHA-256 (required when URL supplied)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: morwen-vroid-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  studio-windows:
    if: ${{ inputs.validation_target == 'studio_only' || inputs.validation_target == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Probe Windows environment and official Studio landing page
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.studio_installer_url }}
          INSTALLER_SHA256: ${{ inputs.studio_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $report = [ordered]@{ subject='VRoid Studio'; os=[Environment]::OSVersion.VersionString; interactiveDesktop=[Environment]::UserInteractive; download='NOT_RUN'; installerExecution='NOT_RUN'; GUIAutomation='NOT_RUN'; status='BLOCKED'; reasons=@() }
          try {
            $r = Invoke-WebRequest -Uri 'https://vroid.com/studio' -Method Get -MaximumRedirection 5 -TimeoutSec 30
            $report.landingHttpStatus = [int]$r.StatusCode
          } catch { $report.reasons += ('Official landing page probe: ' + $_.Exception.Message) }
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER_URL)) {
            $report.reasons += 'Official direct installer URL not provided; do not scrape/download arbitrary binaries'
          } elseif ($env:INSTALLER_URL -notmatch '^https://' -or $env:INSTALLER_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            $report.reasons += 'HTTPS URL and independently supplied 64-character SHA-256 required'
          } else {
            try {
              $uri = [Uri]$env:INSTALLER_URL
              if ($uri.Host -notin @('vroid.com','download.vroid.com','hub.vroid.com','pixiv.net','www.pixiv.net')) { throw 'Installer URL host not allowlisted; verify official delivery origin before adding it' }
              $destination = Join-Path $env:TEMP 'vroid-installer.exe'
              Invoke-WebRequest -Uri $uri -OutFile $destination -MaximumRedirection 3 -TimeoutSec 180
              $actual = (Get-FileHash -Algorithm SHA256 -Path $destination).Hash
              $report.download = 'PASS'
              $report.actualSha256 = $actual
              if ($actual -ine $env:INSTALLER_SHA256) { throw 'SHA-256 mismatch; installer will not execute' }
              $report.sha256 = 'PASS'
              $report.status = 'DOWNLOADED_VERIFIED_NOT_EXECUTED'
              $report.reasons += 'Silent-install arguments and GUI compatibility are unverified; no unattended execution'
            } catch {
              $report.status = 'BLOCKED'
              $report.reasons += $_.Exception.Message
            }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 evidence/studio.json
          Get-Content evidence/studio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-studio-feasibility-not-adopted
          path: evidence/studio.json
          retention-days: 7
  studio-gui-readiness:
    if: ${{ inputs.validation_target == 'studio_only' || inputs.validation_target == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect GUI session and graphics readiness without executing installer
        shell: pwsh
        run: ./tools/production_qa/probe_vroid_windows_gui.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-windows-gui-readiness-no-execution
          path: evidence/vroid_windows_gui_readiness.json
          if-no-files-found: warn
          retention-days: 7

  studio-drive-provenance:
    if: ${{ inputs.validation_target == 'studio_only' || inputs.validation_target == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Fetch user-provided Drive installer and inspect signature without executing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $report = [ordered]@{source='user-provided Google Drive file';fileId='1G7vBJfw46Yo9vD-n_GzAs3jvzyGl9lfA';claimedName='VRoidStudio-v2.16.0-win.exe';download='NOT_RUN';sha256='NOT_RUN';authenticode='NOT_RUN';installation='NOT_RUN';launch='NOT_RUN';status='BLOCKED';reasons=@()}
          try {
            # Large public Drive files use a confirmation/token flow; direct /uc returned a 2,568-byte HTML page in run 44661074875.
            # gdown handles that flow. The downloaded executable is NEVER run or uploaded.
            $destination=Join-Path $env:RUNNER_TEMP 'vroid-installer-untrusted.exe'
            python -m pip install --disable-pip-version-check --no-input 'gdown==5.2.0'
            if ($LASTEXITCODE -ne 0) { throw 'gdown installation failed' }
            python -m gdown --id '1G7vBJfw46Yo9vD-n_GzAs3jvzyGl9lfA' --output $destination --no-cookies
            if ($LASTEXITCODE -ne 0) { throw 'gdown Drive transfer failed; do not retry automatically' }
            $bytes=(Get-Item $destination).Length
            $report.downloadedBytes=$bytes
            if ($bytes -lt 400000000 -or $bytes -gt 550000000) { throw "Unexpected downloaded size $bytes; possibly Drive HTML consent page" }
            $stream=[System.IO.File]::OpenRead($destination)
            try { $magic=New-Object byte[] 2; [void]$stream.Read($magic,0,2) } finally { $stream.Dispose() }
            if ($magic[0] -ne 77 -or $magic[1] -ne 90) { throw 'Downloaded file lacks MZ executable header' }
            $report.download='PASS'
            $report.sha256=(Get-FileHash -Algorithm SHA256 $destination).Hash
            $signature=Get-AuthenticodeSignature -FilePath $destination
            $report.authenticode=[string]$signature.Status
            $report.signerSubject=if($signature.SignerCertificate){$signature.SignerCertificate.Subject}else{$null}
            $report.signerThumbprint=if($signature.SignerCertificate){$signature.SignerCertificate.Thumbprint}else{$null}
            $report.status=if($signature.Status -eq 'Valid'){'SIGNATURE_VALID_ORIGIN_NOT_YET_VERIFIED'}else{'BLOCKED'}
            $report.reasons+= 'Do not execute until official publisher and independent hash provenance have been verified'
          } catch {
            $report.status='BLOCKED'
            $report.reasons+= $_.Exception.Message
          } finally {
            $report | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 evidence/drive_installer_provenance.json
            Get-Content evidence/drive_installer_provenance.json
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-user-drive-installer-provenance-no-execution
          path: evidence/drive_installer_provenance.json
          retention-days: 7
  hub-api:
    if: ${{ inputs.validation_target == 'studio_only' || inputs.validation_target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public Hub site without authentication or model downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,urllib.request,urllib.error,pathlib
          report={"subject":"VRoid Hub","type":"hosted web service, not downloadable desktop software","siteProbe":"NOT_RUN","apiAuth":"BLOCKED","vrmDownload":"BLOCKED","reasons":["No OAuth credentials or model-specific license authorization provided; no model download attempted"]}
          try:
              req=urllib.request.Request("https://hub.vroid.com/",headers={"User-Agent":"TWO-feasibility-check/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  report["siteProbe"]="PASS" if r.status==200 else "HTTP_"+str(r.status)
                  report["httpStatus"]=r.status
          except Exception as e: report["siteProbe"]="BLOCKED";report["siteError"]=str(e)
          pathlib.Path("evidence/hub.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-hub-feasibility-not-adopted
          path: evidence/hub.json
          retention-days: 7
  vrm-addon-blender53:
    if: ${{ inputs.validation_target == 'vrm_only' || inputs.validation_target == 'all' || inputs.validation_target == 'vrm_fixture' || inputs.validation_target == 'vrm_upstream_fixture' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Blender 5.3
        run: bash tools/production_qa/install_blender_530.sh /tmp/two-blender-530/vrm-app
      - name: Download pinned Blender 5.3 extension ZIP and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/morwen-vrm-addon
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, tomllib, urllib.request, zipfile
          out=pathlib.Path('/tmp/morwen-vrm-addon')
          report={'addon':'VRM Add-on for Blender','tag':'v4.10.5','download':'NOT_RUN','extensionManifest':'NOT_RUN','addonRegistration':'NOT_RUN','vrmImport':'NOT_RUN','status':'BLOCKED'}
          try:
              asset_name='VRM_Addon_for_Blender-Extension-4_10_5.zip'
              url='https://github.com/saturday06/VRM-Addon-for-Blender/releases/download/v4.10.5/'+asset_name
              request=urllib.request.Request(url,headers={'User-Agent':'TWO-VRM-Addon-Compatibility/1.0'})
              with urllib.request.urlopen(request,timeout=120) as response:
                  data=response.read(80*1024*1024+1)
              if len(data)>80*1024*1024: raise RuntimeError('Extension ZIP too large')
              archive=out/'vrm-extension.zip'
              archive.write_bytes(data)
              if not zipfile.is_zipfile(archive): raise RuntimeError('Downloaded file is not a ZIP')
              with zipfile.ZipFile(archive) as z:
                  names=z.namelist()
                  if 'blender_manifest.toml' not in names:
                      raise RuntimeError('Blender extension manifest missing from archive root; no install')
                  if sum(i.file_size for i in z.infolist())>160*1024*1024:
                      raise RuntimeError('Unsafe expanded ZIP size')
                  for entry in z.infolist():
                      p=pathlib.PurePosixPath(entry.filename)
                      if p.is_absolute() or '..' in p.parts or chr(92) in entry.filename:
                          raise RuntimeError('Unsafe ZIP member path')
                      if stat.S_IFMT(entry.external_attr >> 16)==stat.S_IFLNK:
                          raise RuntimeError('ZIP symlink rejected')
                  manifest=tomllib.loads(z.read('blender_manifest.toml').decode('utf-8'))
              if manifest.get('id')!='vrm' or manifest.get('version')!='4.10.5':
                  raise RuntimeError('Unexpected extension identity/version')
              min_blender=tuple(int(x) for x in manifest['blender_version_min'].split('.'))
              max_blender=tuple(int(x) for x in manifest['blender_version_max'].split('.'))
              if not (min_blender <= (5,3,0) < max_blender):
                  raise RuntimeError('Manifest does not support Blender 5.3')
              report.update(download='PASS',extensionManifest='PASS',asset=asset_name,sourceUrl=url,
                            sha256=hashlib.sha256(data).hexdigest(),
                            integrity='SHA256_COMPUTED_NOT_UPSTREAM_VERIFIED',status='DOWNLOADED_NOT_REGISTERED')
          except Exception as exc:
              report['error']=str(exc)
          (out/'download_qa.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if report['download']!='PASS' or report['extensionManifest']!='PASS':
              raise SystemExit(1)
          PY
      - name: Install extension using Blender 5.3 CLI and check registration
        shell: bash
        run: |
          set -euo pipefail
          export BLENDER_USER_CONFIG=/tmp/morwen-vrm-addon/user-config
          export BLENDER_USER_SCRIPTS=/tmp/morwen-vrm-addon/user-scripts
          mkdir -p "$BLENDER_USER_CONFIG" "$BLENDER_USER_SCRIPTS"
          /tmp/two-blender-530/vrm-app/blender --command extension repo-list
          /tmp/two-blender-530/vrm-app/blender --command extension install-file -r user_default -e /tmp/morwen-vrm-addon/vrm-extension.zip
          /tmp/two-blender-530/vrm-app/blender -b --python-exit-code 1 --python-expr "
          import bpy,json,pathlib
          root=pathlib.Path('/tmp/morwen-vrm-addon')
          modules=[str(k) for k in bpy.context.preferences.addons.keys()]
          vrm=[k for k in modules if k.endswith('.vrm')]
          if not vrm: raise RuntimeError('VRM extension not registered in Blender session: '+str(modules))
          if not hasattr(bpy.ops.import_scene,'vrm') and not hasattr(bpy.ops.wm,'vrm_import'):
              raise RuntimeError('VRM import operator not registered')
          report={'blender':bpy.app.version_string,'enabledModules':vrm,
                  'addonRegistration':'PASS','vrmImport':'NOT_RUN_NO_LICENSED_VRM_INPUT',
                  'status':'EXTENSION_REGISTERED_NOT_MODEL_TESTED'}
          (root/'blender_qa.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          "
      - name: Import, render and roundtrip rights-cleared VRM fixture
        if: ${{ inputs.validation_target == 'vrm_fixture' }}
        shell: bash
        env:
          VRM_FIXTURE_URL: ${{ inputs.vrm_fixture_url }}
          VRM_FIXTURE_SHA256: ${{ inputs.vrm_fixture_sha256 }}
          VRM_FIXTURE_TARGET: ${{ inputs.validation_target }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/morwen-vrm-qa
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.parse, urllib.request
          mode=os.environ.get('VRM_FIXTURE_TARGET','')
          if mode=='vrm_upstream_fixture':
              # Pinned upstream test fixture; internal compatibility QA only, never adopt as Morwen.
              url='https://raw.githubusercontent.com/saturday06/VRM-Addon-for-Blender/v4.10.5/tests/resources/vrm/2.93/out/basic_armature_vrm1.vrm'
              expected=''
              expected_git_blob='babb575b9549bb8012e161d5e79cab9241d76264'
          else:
              url=os.environ.get('VRM_FIXTURE_URL','')
              expected=os.environ.get('VRM_FIXTURE_SHA256','').lower()
              expected_git_blob=''
          parsed=urllib.parse.urlparse(url)
          if parsed.scheme!='https' or not parsed.netloc:
              raise SystemExit('BLOCKED: HTTPS fixture URL required')
          if mode!='vrm_upstream_fixture' and not re.fullmatch(r'[0-9a-f]{64}',expected):
              raise SystemExit('BLOCKED: exact SHA-256 required for custom fixture')
          req=urllib.request.Request(url,headers={'User-Agent':'TWO-VRM-QA/1.0'})
          with urllib.request.urlopen(req,timeout=40) as response:
              if urllib.parse.urlparse(response.url).scheme!='https':
                  raise SystemExit('BLOCKED: non-HTTPS redirect')
              data=response.read(32*1024*1024+1)
          if len(data)>32*1024*1024 or len(data)<20:
              raise SystemExit('BLOCKED: fixture outside safe size range')
          actual=hashlib.sha256(data).hexdigest()
          if expected and actual!=expected:
              raise SystemExit('BLOCKED: fixture SHA-256 mismatch')
          if expected_git_blob:
              git_sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()
              if git_sha!=expected_git_blob:
                  raise SystemExit('BLOCKED: pinned upstream fixture Git blob mismatch')
              print('UPSTREAM_FIXTURE_PIN_VERIFIED',git_sha)
          print('FIXTURE_SHA256_OBSERVED_NOT_UPSTREAM_VERIFIED',actual)
          (pathlib.Path('/tmp/morwen-vrm-qa')/'basic_armature_vrm1.vrm').write_bytes(data)
          print('VRM_FIXTURE_SHA256_VERIFIED',actual)
          PY
          export BLENDER_USER_CONFIG=/tmp/morwen-vrm-addon/user-config
          export BLENDER_USER_SCRIPTS=/tmp/morwen-vrm-addon/user-scripts
          export TWO_VRM_QA_DIR=/tmp/morwen-vrm-qa
          /tmp/two-blender-530/vrm-app/blender -b --python-exit-code 1 --python tools/production_qa/vrm_fixture_roundtrip_qa.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.validation_target == 'vrm_fixture' }}
        with:
          name: morwen-vrm-fixture-roundtrip-qa-not-adopted
          path: |
            /tmp/morwen-vrm-qa/qa.json
            /tmp/morwen-vrm-qa/fixture_render.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vrm-addon-blender53-compatibility-not-adopted
          path: |
            /tmp/morwen-vrm-addon/*_qa.json
          if-no-files-found: warn
          retention-days: 7

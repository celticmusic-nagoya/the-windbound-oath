name: Morwen VRoid Studio and Hub feasibility (manual, no adoption)
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths: [.github/workflows/morwen-vroid-feasibility.yml]
  workflow_dispatch:
    inputs:
      studio_installer_url:
        description: 'Official HTTPS direct Windows installer URL (leave empty to mark download BLOCKED)'
        required: false
        type: string
      studio_sha256:
        description: 'Expected official installer SHA-256 (required when URL supplied)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: morwen-vroid-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  studio-windows:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Probe Windows environment and official Studio landing page
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.studio_installer_url }}
          INSTALLER_SHA256: ${{ inputs.studio_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $report = [ordered]@{ subject='VRoid Studio'; os=[Environment]::OSVersion.VersionString; interactiveDesktop=[Environment]::UserInteractive; download='NOT_RUN'; installerExecution='NOT_RUN'; GUIAutomation='NOT_RUN'; status='BLOCKED'; reasons=@() }
          try {
            $r = Invoke-WebRequest -Uri 'https://vroid.com/studio' -Method Get -MaximumRedirection 5 -TimeoutSec 30
            $report.landingHttpStatus = [int]$r.StatusCode
          } catch { $report.reasons += ('Official landing page probe: ' + $_.Exception.Message) }
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER_URL)) {
            $report.reasons += 'Official direct installer URL not provided; do not scrape/download arbitrary binaries'
          } elseif ($env:INSTALLER_URL -notmatch '^https://' -or $env:INSTALLER_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            $report.reasons += 'HTTPS URL and independently supplied 64-character SHA-256 required'
          } else {
            try {
              $uri = [Uri]$env:INSTALLER_URL
              if ($uri.Host -notin @('vroid.com','download.vroid.com','hub.vroid.com','pixiv.net','www.pixiv.net')) { throw 'Installer URL host not allowlisted; verify official delivery origin before adding it' }
              $destination = Join-Path $env:TEMP 'vroid-installer.exe'
              Invoke-WebRequest -Uri $uri -OutFile $destination -MaximumRedirection 3 -TimeoutSec 180
              $actual = (Get-FileHash -Algorithm SHA256 -Path $destination).Hash
              $report.download = 'PASS'
              $report.actualSha256 = $actual
              if ($actual -ine $env:INSTALLER_SHA256) { throw 'SHA-256 mismatch; installer will not execute' }
              $report.sha256 = 'PASS'
              $report.status = 'DOWNLOADED_VERIFIED_NOT_EXECUTED'
              $report.reasons += 'Silent-install arguments and GUI compatibility are unverified; no unattended execution'
            } catch {
              $report.status = 'BLOCKED'
              $report.reasons += $_.Exception.Message
            }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 evidence/studio.json
          Get-Content evidence/studio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-studio-feasibility-not-adopted
          path: evidence/studio.json
          retention-days: 7
  studio-gui-readiness:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect GUI session and graphics readiness without executing installer
        shell: pwsh
        run: ./tools/production_qa/probe_vroid_windows_gui.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-windows-gui-readiness-no-execution
          path: evidence/vroid_windows_gui_readiness.json
          if-no-files-found: warn
          retention-days: 7

  studio-drive-provenance:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Fetch user-provided Drive installer and inspect signature without executing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $report = [ordered]@{source='user-provided Google Drive file';fileId='1G7vBJfw46Yo9vD-n_GzAs3jvzyGl9lfA';claimedName='VRoidStudio-v2.16.0-win.exe';download='NOT_RUN';sha256='NOT_RUN';authenticode='NOT_RUN';installation='NOT_RUN';launch='NOT_RUN';status='BLOCKED';reasons=@()}
          try {
            # Large public Drive files use a confirmation/token flow; direct /uc returned a 2,568-byte HTML page in run 44661074875.
            # gdown handles that flow. The downloaded executable is NEVER run or uploaded.
            $destination=Join-Path $env:RUNNER_TEMP 'vroid-installer-untrusted.exe'
            python -m pip install --disable-pip-version-check --no-input 'gdown==5.2.0'
            if ($LASTEXITCODE -ne 0) { throw 'gdown installation failed' }
            python -m gdown --id '1G7vBJfw46Yo9vD-n_GzAs3jvzyGl9lfA' --output $destination --no-cookies
            if ($LASTEXITCODE -ne 0) { throw 'gdown Drive transfer failed; do not retry automatically' }
            $bytes=(Get-Item $destination).Length
            $report.downloadedBytes=$bytes
            if ($bytes -lt 400000000 -or $bytes -gt 550000000) { throw "Unexpected downloaded size $bytes; possibly Drive HTML consent page" }
            $stream=[System.IO.File]::OpenRead($destination)
            try { $magic=New-Object byte[] 2; [void]$stream.Read($magic,0,2) } finally { $stream.Dispose() }
            if ($magic[0] -ne 77 -or $magic[1] -ne 90) { throw 'Downloaded file lacks MZ executable header' }
            $report.download='PASS'
            $report.sha256=(Get-FileHash -Algorithm SHA256 $destination).Hash
            $signature=Get-AuthenticodeSignature -FilePath $destination
            $report.authenticode=[string]$signature.Status
            $report.signerSubject=if($signature.SignerCertificate){$signature.SignerCertificate.Subject}else{$null}
            $report.signerThumbprint=if($signature.SignerCertificate){$signature.SignerCertificate.Thumbprint}else{$null}
            $report.status=if($signature.Status -eq 'Valid'){'SIGNATURE_VALID_ORIGIN_NOT_YET_VERIFIED'}else{'BLOCKED'}
            $report.reasons+= 'Do not execute until official publisher and independent hash provenance have been verified'
          } catch {
            $report.status='BLOCKED'
            $report.reasons+= $_.Exception.Message
          } finally {
            $report | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 evidence/drive_installer_provenance.json
            Get-Content evidence/drive_installer_provenance.json
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-user-drive-installer-provenance-no-execution
          path: evidence/drive_installer_provenance.json
          retention-days: 7
  hub-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public Hub site without authentication or model downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,urllib.request,urllib.error,pathlib
          report={"subject":"VRoid Hub","type":"hosted web service, not downloadable desktop software","siteProbe":"NOT_RUN","apiAuth":"BLOCKED","vrmDownload":"BLOCKED","reasons":["No OAuth credentials or model-specific license authorization provided; no model download attempted"]}
          try:
              req=urllib.request.Request("https://hub.vroid.com/",headers={"User-Agent":"TWO-feasibility-check/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  report["siteProbe"]="PASS" if r.status==200 else "HTTP_"+str(r.status)
                  report["httpStatus"]=r.status
          except Exception as e: report["siteProbe"]="BLOCKED";report["siteError"]=str(e)
          pathlib.Path("evidence/hub.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vroid-hub-feasibility-not-adopted
          path: evidence/hub.json
          retention-days: 7

  vrm-addon-blender53:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Blender 5.3
        run: bash tools/production_qa/install_blender_530.sh /tmp/two-blender-530/vrm-app
      - name: Download verified upstream VRM add-on release asset and test Blender import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/morwen-vrm-addon
          python3 - <<'PY'
          import json,urllib.request,pathlib,hashlib,zipfile
          out=pathlib.Path('/tmp/morwen-vrm-addon')
          report={'addon':'VRM Add-on for Blender','tag':'v4.10.5','download':'NOT_RUN','addonRegistration':'NOT_RUN','vrmImport':'NOT_RUN','status':'BLOCKED'}
          try:
              api='https://api.github.com/repos/saturday06/VRM-Addon-for-Blender/releases/tags/v4.10.5'
              req=urllib.request.Request(api,headers={'User-Agent':'TWO-VRM-Addon-Compatibility/1.0','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: release=json.load(response)
              assets=[a for a in release.get('assets',[]) if a['name']=='VRM_Addon_for_Blender-4_10_5.zip']
              if len(assets)!=1: raise RuntimeError('Expected one exact versioned standard add-on ZIP, found '+str([a['name'] for a in assets]))
              asset=assets[0]
              url=asset['browser_download_url']
              if not url.startswith('https://github.com/saturday06/VRM-Addon-for-Blender/releases/download/v4.10.5/'): raise RuntimeError('Unexpected asset origin')
              req=urllib.request.Request(url,headers={'User-Agent':'TWO-VRM-Addon-Compatibility/1.0'})
              with urllib.request.urlopen(req,timeout=120) as response: data=response.read(80*1024*1024+1)
              if len(data)>80*1024*1024: raise RuntimeError('Asset too large')
              archive=out/'vrm-addon.zip';archive.write_bytes(data)
              if not zipfile.is_zipfile(archive): raise RuntimeError('Downloaded asset is not a ZIP')
              digest=hashlib.sha256(data).hexdigest()
              report.update(download='PASS',sha256=digest,asset=asset['name'],assetId=asset['id'])
              if asset.get('digest','').startswith('sha256:') and asset['digest'][7:].lower()!=digest: raise RuntimeError('GitHub release digest mismatch')
              report['status']='DOWNLOADED_NOT_REGISTERED'
          except Exception as e: report['error']=str(e)
          (out/'download_qa.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if report['download']!='PASS': raise SystemExit(1)
          PY
          /tmp/two-blender-530/vrm-app/blender -b --factory-startup --python-exit-code 1 --python-expr "
          import bpy,zipfile,pathlib,json,sys
          root=pathlib.Path('/tmp/morwen-vrm-addon')
          z=zipfile.ZipFile(root/'vrm-addon.zip')
          names=z.namelist()
          if not any(x.endswith('vrm/__init__.py') for x in names): raise RuntimeError('VRM add-on package missing')
          for x in names:
              p=pathlib.PurePosixPath(x)
              if p.is_absolute() or '..' in p.parts: raise RuntimeError('Unsafe ZIP path')
          bpy.ops.preferences.addon_install(filepath=str(root/'vrm-addon.zip'),overwrite=True)
          bpy.ops.preferences.addon_enable(module='VRM_Addon_for_Blender')
          loaded=[k for k in bpy.context.preferences.addons.keys() if 'vrm' in k.lower()]
          if not loaded: raise RuntimeError('VRM add-on not enabled')
          report={'blender':bpy.app.version_string,'enabledModules':loaded,'addonRegistration':'PASS','vrmImport':'NOT_RUN_NO_LICENSED_VRM_INPUT','status':'ADDON_REGISTERED_NOT_MODEL_TESTED'}
          (root/'blender_qa.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-vrm-addon-blender53-compatibility-not-adopted
          path: |
            /tmp/morwen-vrm-addon/*_qa.json
          if-no-files-found: warn
          retention-days: 7

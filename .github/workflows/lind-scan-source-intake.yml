name: LIND Scan Source Metadata Intake
on:
  pull_request:
    paths:
      - 'tools/map_blender/lind/inspect_polyhaven_cliff.py'
      - '.github/workflows/lind-scan-source-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official Poly Haven metadata (no binary downloads)
        run: python3 tools/map_blender/lind/inspect_polyhaven_cliff.py --out out/lind-scan-source/metadata.json
      - name: Verify candidate-only intake
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('out/lind-scan-source/metadata.json').read_text())
          assert len(m['assets'])==2
          assert all(a['source_status']=='CANDIDATE_METADATA_ONLY' and a['original_binary_sha256'] is None for a in m['assets'])
          assert m['G2']=='NOT_RUN'
          print('METADATA_INTAKE_PASS_NO_ASSETS_DOWNLOADED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lind-scan-source-metadata
          path: out/lind-scan-source/
          retention-days: 7

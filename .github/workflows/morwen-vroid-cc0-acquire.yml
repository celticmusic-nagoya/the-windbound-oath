name: Morwen VRoid CC0 Acquisition Audit
on:
  push:
    branches:
      - feature/morwen-production-pipeline-01
    paths:
      - '.github/workflows/morwen-vroid-cc0-acquire.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify third-party VRoid CC0 archive
        run: |
          python3 - <<'PY'
          import urllib.request,zipfile,hashlib,json
          from pathlib import Path
          url="https://opengameart.org/sites/default/files/base_female.zip"
          out=Path("render_output/morwen_vroid_cc0_audit")
          out.mkdir(parents=True,exist_ok=True)
          archive=out/"base_female.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; TWO-Asset-Audit/1.0)"})
          with urllib.request.urlopen(req,timeout=90) as src,archive.open("wb") as dst:
              while True:
                  chunk=src.read(1024*1024)
                  if not chunk:break
                  dst.write(chunk)
          assert zipfile.is_zipfile(archive),"Download is not ZIP"
          files=[]
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  assert not info.filename.startswith(("/", "\\")) and ".." not in Path(info.filename).parts,"Unsafe ZIP member"
                  files.append({"name":info.filename,"bytes":info.file_size})
          report={"source_url":url,"original_publisher":"VRoid Project / pixiv","mirror":"OpenGameArt.org submitted by hecko",
                  "license_reference":"https://vroid.pixiv.help/hc/en-us/articles/4402614652569-Do-VRoid-Studio-s-sample-models-come-with-conditions-of-use",
                  "license_scope":"Old beta base model CC0 only; NOT current VRoid presets",
                  "sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),"archive_bytes":archive.stat().st_size,
                  "members":files,"production_approved":False,"G1":"NOT_RUN","G2":"NOT_RUN","G3":"ARCHIVE_INTEGRITY_ONLY","G4":"NOT_RUN"}
          (out/"acquisition.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:v for k,v in report.items() if k!="members"},indent=2))
          assert any(x["name"].lower().endswith((".vrm",".glb",".gltf")) for x in files),"No 3D model inside"
          PY
      - name: Upload quarantined original and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-vroid-cc0-base-female-quarantine
          path: render_output/morwen_vroid_cc0_audit/
          retention-days: 14

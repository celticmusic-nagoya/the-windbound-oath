name: Aidan blueprint-linked native batch
on:
  push:
    branches: [feature/lind-village-world-integration-plan-01]
    paths: ['.github/workflows/aidan-interior-candidate.yml']
  workflow_dispatch:
    inputs:
      extended_batch:
        description: 'Authorized public standard runner native session, up to 360 minutes'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  statuses: write
concurrency:
  group: aidan-interior-candidate
  cancel-in-progress: false
jobs:
  blueprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d477176179af046db7ef86f3bdf8bbe92e47b1d2
          persist-credentials: false
      - name: Verify free standard runner and session budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .visibility)" = public
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p /tmp/blueprint
          date +%s > /tmp/blueprint/session_start
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=in_progress" --jq '.workflow_runs[] | [.id,.name,.head_branch] | @tsv' > /tmp/active
          if awk -F '\t' -v self="$GITHUB_RUN_ID" '$1!=self && ($2 ~ /Aidan|Rilde|LIND.*HOME/ || $3=="feature/lind-village-world-integration-plan-01"){found=1} END{exit !found}' /tmp/active; then echo 'Conflicting work active'; exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libgbm1
          echo LIBGL_ALWAYS_SOFTWARE=1 >> "$GITHUB_ENV"
          echo EGL_PLATFORM=surfaceless >> "$GITHUB_ENV"
      - name: Install verified Blender
        run: |
          set -eu
          base=https://mirror.blender.org/release/Blender5.3
          archive=blender-5.3.0-linux-x64.tar.xz
          curl -fsSL --max-time 90 "$base/blender-5.3.0.sha256" -o sums
          curl -fsSL --max-time 540 "$base/$archive" -o "$archive"
          grep "$archive" sums | sha256sum -c -
          mkdir -p /tmp/blender /tmp/blueprint
          tar -xJf "$archive" -C /tmp/blender --strip-components=1
          /tmp/blender/blender -b --factory-startup --python-exit-code 1 --python-expr 'import bpy; assert tuple(bpy.app.version)==(5,3,0)'
      - name: Restore nine pinned CC0 maps
        run: |
          set -eu
          mkdir -p /tmp/home-pbr
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rock_boulder_dry/rock_boulder_dry_diff_1k.jpg' -o "/tmp/home-pbr/rock_boulder_dry_diff_1k.jpg"
          echo '20f653a42fb24f42aa40641663070d578678da49af18cc1049dbdd4ed8679f3c  /tmp/home-pbr/rock_boulder_dry_diff_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rock_boulder_dry/rock_boulder_dry_nor_gl_1k.jpg' -o "/tmp/home-pbr/rock_boulder_dry_nor_gl_1k.jpg"
          echo '5915fea28a97357c78a04fb31c2516f1f7ed1b3a9cef4ae25aa93e4655e6c595  /tmp/home-pbr/rock_boulder_dry_nor_gl_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rock_boulder_dry/rock_boulder_dry_rough_1k.jpg' -o "/tmp/home-pbr/rock_boulder_dry_rough_1k.jpg"
          echo 'cc5229dd6bbdc4e817cb647e60242224b8e4f0237473ac018861ea243f2e8130  /tmp/home-pbr/rock_boulder_dry_rough_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rough_wood/rough_wood_diff_1k.jpg' -o "/tmp/home-pbr/rough_wood_diff_1k.jpg"
          echo 'abc46d8e3163d911220f4ec3a4043b68d2b0c6d750513f80871211acfefb2a98  /tmp/home-pbr/rough_wood_diff_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rough_wood/rough_wood_nor_gl_1k.jpg' -o "/tmp/home-pbr/rough_wood_nor_gl_1k.jpg"
          echo '3d1c6f098b66d93e52071b41834dd14a424d8cd2f7c4130c62dc062acfa65011  /tmp/home-pbr/rough_wood_nor_gl_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rough_wood/rough_wood_rough_1k.jpg' -o "/tmp/home-pbr/rough_wood_rough_1k.jpg"
          echo '4e9ea9962a7e8b69057937e6723c4b0134b949c1ee5cdb5f3687a54113027b09  /tmp/home-pbr/rough_wood_rough_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/weathered_brown_planks/weathered_brown_planks_diff_1k.jpg' -o "/tmp/home-pbr/weathered_brown_planks_diff_1k.jpg"
          echo '94833feda44e025a9139f7b5723ea84e4f0258d3b54939a79e1013c133085e29  /tmp/home-pbr/weathered_brown_planks_diff_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/weathered_brown_planks/weathered_brown_planks_nor_gl_1k.jpg' -o "/tmp/home-pbr/weathered_brown_planks_nor_gl_1k.jpg"
          echo '8d38f02f121c0e58eaedc19cd668faea21381ae3ff4d5332cd90de75e6683393  /tmp/home-pbr/weathered_brown_planks_nor_gl_1k.jpg' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 90 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/weathered_brown_planks/weathered_brown_planks_rough_1k.jpg' -o "/tmp/home-pbr/weathered_brown_planks_rough_1k.jpg"
          echo 'b80c45969d8299ca5f21de969f0269138a5e3e78e51fc911af809683d99c5bc9  /tmp/home-pbr/weathered_brown_planks_rough_1k.jpg' | sha256sum -c -
          sha256sum /tmp/home-pbr/*.jpg > /tmp/blueprint/texture.sha256
      - name: Blueprint-linked measure correct preview checkpoint
        run: |
          set -euo pipefail
          source=assets/candidates/LIND-HOME-01/aidan_house_f9_c01/aidan_house_f9_c01.blend
          contract=docs/production/lind/home/arch-kit-contract.v1.json
          test "$(git hash-object "$source")" = "0b10bcb3a317b9265631eca84e36b29d7faad6b2"
          sha256sum "$source" "$contract" > /tmp/blueprint/source.sha256
          cat >/tmp/batch.py <<'PY'
          import bpy,sys,json,hashlib,math,time
          from pathlib import Path
          from mathutils import Vector
          out=Path('/tmp/blueprint')
          sys.path.insert(0,str(Path.cwd()/'tools/map_blender/lind/home'))
          import build_aidan_house as H
          contract=Path('docs/production/lind/home/arch-kit-contract.v1.json')
          bp=json.loads(contract.read_text())
          assert bp['units']['up_axis']=='Z' and bp['units']['blender_unit']==1
          def digest(p):
              with open(p,'rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          def sig(o):
              h=hashlib.sha256()
              for v in o.data.vertices:h.update(repr(tuple(v.co)).encode())
              for p in o.data.polygons:h.update(repr(tuple(p.vertices)).encode())
              h.update(repr([list(r) for r in o.matrix_world]).encode())
              return h.hexdigest()
          def bounds(o):
              vs=[o.matrix_world@v.co for v in o.data.vertices]
              return [[min(v[i] for v in vs) for i in range(3)],[max(v[i] for v in vs) for i in range(3)]]
          def ledger():
              s=bpy.context.scene
              a=bounds(bpy.data.objects['COL_AIDANHOUSE_wall_front_w'])
              b=bounds(bpy.data.objects['COL_AIDANHOUSE_wall_front_e'])
              door=b[0][0]-a[1][0]
              posts=[bounds(o) for o in s.objects if o.name.startswith('COL_AIDANHOUSE_porch_post')]
              gap=0 if len(posts)==1 else sorted(posts,key=lambda p:p[0][0])[1][0][0]-sorted(posts,key=lambda p:p[0][0])[0][1][0]
              target=bp['openings']['door_main_ext']['clear_w']
              return dict(door_collision_gap=door,door_target=target,door_residual=door-target,porch_collision_gap=gap,porch_target_min=target,porch_status='PASS' if gap>=target else 'FAIL',coordinate_status='PROVISIONAL',measurement_scope='collision proxies only')
          protected={o.name:sig(o) for o in bpy.context.scene.objects if o.type=='MESH' and not o.name.startswith('COL_AIDANHOUSE_porch_post')}
          anchors={o.name:[list(r) for r in o.matrix_world] for o in bpy.context.scene.objects if o.type=='EMPTY'}
          for im in bpy.data.images:
              if im.source=='FILE' and not im.packed_file:
                  p=Path('/tmp/home-pbr')/Path(im.filepath).name
                  assert p.is_file(),str(p)
                  im.filepath=str(p);im.reload();assert im.size[0]>0;im.pack()
          before=ledger()
          assert before['porch_status']=='FAIL'
          # Measure post base geometry below crossbeam rather than invent dimensions.
          porch=bpy.data.objects['GEO_AIDANHOUSE_PORCH']
          pts=[porch.matrix_world@v.co for v in porch.data.vertices if (porch.matrix_world@v.co).z<2.0]
          assert pts
          old=bpy.data.objects['COL_AIDANHOUSE_porch_posts']
          coll=old.users_collection[0]
          ztop=bounds(old)[1][2]
          old.hide_render=True
          bpy.data.objects.remove(old,do_unlink=True)
          for side in (-1,1):
              ps=[v for v in pts if v.x*side>0]
              lo=[min(v[i] for v in ps) for i in range(3)]
              hi=[max(v[i] for v in ps) for i in range(3)]
              lo[2]=0;hi[2]=ztop
              assert hi[0]-lo[0]<.6 and hi[1]-lo[1]<.65
              x,y,z=lo;X,Y,Z=hi
              n='COL_AIDANHOUSE_porch_post_'+('west' if side<0 else 'east')
              m=bpy.data.meshes.new(n);m.from_pydata([(x,y,z),(X,y,z),(X,Y,z),(x,Y,z),(x,y,Z),(X,y,Z),(X,Y,Z),(x,Y,Z)],[],[(0,3,2,1),(4,5,6,7),(0,1,5,4),(1,2,6,5),(2,3,7,6),(3,0,4,7)]);m.update()
              o=bpy.data.objects.new(n,m);coll.objects.link(o);o.hide_render=True;o.display_type='WIRE';o['collision']='box'
          after=ledger()
          assert after['porch_status']=='PASS' and after['door_collision_gap']==before['door_collision_gap']
          assert all(sig(bpy.data.objects[n])==s for n,s in protected.items())
          assert all([list(r) for r in bpy.data.objects[n].matrix_world]==v for n,v in anchors.items())
          bpy.ops.file.pack_all()
          checkpoint=out/'home_portal_checkpoint.blend'
          bpy.ops.wm.save_as_mainfile(filepath=str(checkpoint),compress=True)
          h=digest(checkpoint)
          bpy.ops.wm.open_mainfile(filepath=str(checkpoint))
          assert digest(checkpoint)==h and ledger()==after
          result=dict(blueprint_sha256=digest(contract),before=before,after=after,protected=len(protected),anchors=len(anchors),native_sha256=h,reopened=True,G1='BLOCKED',G2='NOT_RUN',G3='PARTIAL',G4='NOT_RUN',next='matched native views and independent QA')
          (out/'checkpoint.json').write_text(json.dumps(result,indent=2))
          PY
          timeout 1800 /tmp/blender/blender -b --disable-autoexec "$source" --python-exit-code 1 --python /tmp/batch.py
          sha256sum -c /tmp/blueprint/source.sha256
          cd /tmp/blueprint
          sha256sum home_portal_checkpoint.blend checkpoint.json source.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: home-blueprint-checkpoint-${{ github.run_id }}
          path: /tmp/blueprint
          retention-days: 14
      - name: Resume verified native checkpoint and render matched views
        run: |
          set -euo pipefail
          cd /tmp/blueprint
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          cat >/tmp/views.py <<'PY'
          import bpy,sys,json,time
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'tools/map_blender/lind/home'))
          import build_aidan_house as H
          out=Path('/tmp/blueprint')
          scene=bpy.context.scene
          for view in ('front_three_quarter','interior_bedside'):
              H.set_camera(scene,view)
              scene.render.engine='CYCLES';scene.cycles.device='CPU';scene.cycles.samples=24;scene.cycles.use_denoising=True
              scene.render.resolution_percentage=60
              scene.render.image_settings.file_format='PNG';scene.render.filepath=str(out/(view+'.png'))
              bpy.ops.render.render(write_still=True)
          (out/'resume.json').write_text(json.dumps(dict(reused_stage='portal_correction',repeated_edits=0,elapsed_seconds=int(time.time())-int((out/'session_start').read_text()),G2='NOT_RUN',G4='NOT_RUN')))
          PY
          timeout 10800 /tmp/blender/blender -b /tmp/blueprint/home_portal_checkpoint.blend --disable-autoexec --python-exit-code 1 --python /tmp/views.py
          cd /tmp/blueprint
          sha256sum *.png resume.json >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-blueprint-batch-${{ github.run_id }}
          path: /tmp/blueprint
          retention-days: 7
      - name: Publish batch status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=two/home-blueprint-batch -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

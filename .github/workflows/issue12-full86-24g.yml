name: Issue12 24L postmerge actual-main regression
on:
  push:
    branches: ['qa/issue12-full86-public-24l']
permissions:
  contents: read
jobs:
  core-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: celticmusic-nagoya/the-windbound-oath
          ref: 1a19e179bb6240b59b411aa9769632792ba6760a
          path: game
          fetch-depth: 0
          persist-credentials: false
      - name: Mandatory actual-code automatic audits and regressions
        run: |
          python -m pip install playwright==1.55.0 pillow==11.3.0 numpy==2.2.6
          mkdir -p node-out
          git -C game rev-parse HEAD > node-out/source.txt
          git -C game rev-parse HEAD^{tree} > node-out/tree.txt
          python qa/issue12-24g/selftest.py > node-out/harness-controls.log
          python qa/issue12-24g/automatic.py game node-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue12-core-node
          path: node-out/
          retention-days: 30
  core-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: celticmusic-nagoya/the-windbound-oath
          ref: 1a19e179bb6240b59b411aa9769632792ba6760a
          path: game
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow==11.3.0 numpy==2.2.6
          python -m playwright install --with-deps chromium
          chrome=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          sudo ln -sf "$chrome" /usr/bin/chromium
          echo "PW_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          git -C game worktree add --detach ../baseline e8ecb5dceea3513bbc22028dcff9365b6718d20c
      - name: Mandatory real-browser SAVE and lifecycle probes
        run: python -u qa/issue12-24g/run.py --source game --baseline baseline --out core-out --shard ${{ matrix.shard }} --probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue12-core-browser-${{ matrix.shard }}
          path: core-out/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    if: always()
    needs: [core-node, core-browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: issue12-core-browser-*
          path: core-combined
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: issue12-core-node
          path: node-combined
      - name: Verify actual-main regressions and exact premerge tree identity
        if: always()
        env:
          CORE_NODE_STATUS: ${{ needs.core-node.result }}
        run: python qa/issue12-24g/postmerge.py
      - name: Publish immutable text evidence and SHA256 manifest
        if: always()
        uses: actions/github-script@v7
        env:
          CONTROL_SHA: ${{ github.sha }}
        with:
          script: |
            const publish = require(process.env.GITHUB_WORKSPACE + '/qa/issue12-24g/publish.js');
            await publish({github, context, core});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue12-postmerge-summary
          path: summary/
          retention-days: 30

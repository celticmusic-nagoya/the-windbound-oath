name: Aidan Roof Geometry Candidate QA
on:
  push:
    branches:
      - feature/aidan-roof-geometry-01
    paths:
      - 'tools/map_blender/aidan_roof_vertex_first_v3.py'
      - 'tools/map_blender/aidan_roof_render_v3.py'
      - '.github/workflows/aidan-roof-candidate-qa.yml'
      - 'tools/map_blender/aidan_house_master_v1.py'
      - 'tools/map_blender/aidan_house_master_render_v1.py'
      - 'tools/map_blender/aidan_house_structural_cage_01.py'
      - 'tools/map_blender/aidan_house_structure_render_01.py'
      - 'tools/map_blender/test_aidan_house_structure_01.py'
  pull_request:
    paths:
      - 'tools/map_blender/aidan_roof_vertex_first_v3.py'
      - 'tools/map_blender/aidan_roof_render_v3.py'
      - 'tools/map_blender/test_aidan_roof_candidate_01.py'
      - '.github/workflows/aidan-roof-candidate-qa.yml'
      - 'tools/map_blender/aidan_house_master_v1.py'
      - 'tools/map_blender/aidan_house_master_render_v1.py'
      - 'tools/map_blender/aidan_house_structural_cage_01.py'
      - 'tools/map_blender/aidan_house_structure_render_01.py'
      - 'tools/map_blender/test_aidan_house_structure_01.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static QA
        run: |
          python3 -m py_compile tools/map_blender/aidan_roof_vertex_first_v3.py tools/map_blender/aidan_roof_render_v3.py
          python3 tools/map_blender/test_aidan_roof_candidate_01.py
      - name: Install Blender for geometry QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
          blender --version
      - name: Geometry preview only — NOT art approval
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-roof-qa
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_roof_render_v3.py
          test -s "$AIDAN_ROOF_OUTPUT/manifest.json"
      - name: Verify five nonempty images and manifest
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-roof-qa
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          p=os.environ['AIDAN_ROOF_OUTPUT']
          m=json.load(open(os.path.join(p,'manifest.json')))
          assert m['status']=='VERTEX_FIRST_V3_GEOMETRY_CANDIDATE_NOT_ART_APPROVED'
          assert len(m['views'])==5
          assert m['roof']['slate_count'] >= 350
          assert len(m['roof']['silhouette_families']) == 5
          assert all(n > 0 for n in m['roof']['silhouette_families'])
          assert m['roof']['ridge_cap_count'] == 17
          assert m['roof']['minimum_clearance'] > 0
          for v in m['views']:
              path=os.path.join(p,v['file'])
              assert os.path.getsize(path)>1000
              assert hashlib.sha256(open(path,'rb').read()).hexdigest()==v['sha256']
          assert os.path.getsize(os.path.join(p,'aidan_roof_vertex_first_v3.blend'))>1000
          print('PASS: geometry preview artifacts (NOT G2/G4)')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-roof-vertex-first-v3-qa
          path: ${{ runner.temp }}/aidan-roof-qa/
          if-no-files-found: warn
          retention-days: 7

  house_cage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Structural dimensional QA
        run: |
          python3 -m py_compile tools/map_blender/aidan_house_structural_cage_01.py tools/map_blender/aidan_house_structure_render_01.py
          python3 tools/map_blender/test_aidan_house_structure_01.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
      - name: Render whole-house cage
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-house-cage
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_house_structure_render_01.py
      - name: Verify five PNGs and Blender file
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-house-cage
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          p=os.environ['AIDAN_ROOF_OUTPUT']
          m=json.load(open(os.path.join(p,'manifest.json')))
          assert m['status']=='WHOLE_HOUSE_STRUCTURE_CANDIDATE_NOT_ART_APPROVED'
          assert len(m['views'])==5
          assert m['roof']['objects']>=15
          assert m['roof']['dimensions_candidate']['door_width']>0
          for v in m['views']:
              q=os.path.join(p,v['file'])
              assert os.path.getsize(q)>1000
              assert hashlib.sha256(open(q,'rb').read()).hexdigest()==v['sha256']
          assert os.path.getsize(os.path.join(p,'aidan_house_structural_cage_01.blend'))>1000
          print('PASS: whole-house cage technical artifacts, G2/G4 NOT_RUN')
          PY
      - name: Upload whole-house QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-house-structure-cage-qa
          path: ${{ runner.temp }}/aidan-house-cage/
          if-no-files-found: warn
          retention-days: 7

  high_detail_master:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static syntax
        run: python3 -m py_compile tools/map_blender/aidan_house_master_v1.py tools/map_blender/aidan_house_master_render_v1.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
      - name: Render high-detail master candidate
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-house-hd
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_house_master_render_v1.py
      - name: Validate geometry and five images
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-house-hd
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          p=os.environ['AIDAN_ROOF_OUTPUT'];m=json.load(open(os.path.join(p,'manifest.json')))
          assert m['status']=='HIGH_DETAIL_MASTER_CANDIDATE_NOT_ART_APPROVED'
          assert m['roof']['counts']['slates']>=1000
          assert m['roof']['counts']['stones']>=100
          assert m['roof']['counts']['ridge_caps']==30
          assert len(m['views'])==5
          for v in m['views']:
              f=os.path.join(p,v['file'])
              assert os.path.getsize(f)>1000
              assert hashlib.sha256(open(f,'rb').read()).hexdigest()==v['sha256']
          assert os.path.getsize(os.path.join(p,'aidan_house_master_v1.blend'))>1000
          print('PASS: candidate geometry and render integrity; G2/G4 NOT APPROVED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aidan-house-high-detail-master-v1
          path: ${{ runner.temp }}/aidan-house-hd/
          if-no-files-found: warn
          retention-days: 7

  high_detail_master_v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static syntax
        run: python3 -m py_compile tools/map_blender/aidan_house_master_v2.py tools/map_blender/aidan_house_master_render_v2.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
      - name: Render high-detail master candidate
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-house-hd-v2
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_house_master_render_v2.py
      - name: Validate geometry and five images
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-house-hd-v2
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          p=os.environ['AIDAN_ROOF_OUTPUT'];m=json.load(open(os.path.join(p,'manifest.json')))
          assert m['status']=='HIGH_DETAIL_MASTER_CANDIDATE_NOT_ART_APPROVED'
          assert m['roof']['counts']['slates']>=1000
          assert m['roof']['counts']['stones']>=100
          assert m['roof']['counts']['ridge_caps']==30
          assert len(m['views'])==5
          for v in m['views']:
              f=os.path.join(p,v['file'])
              assert os.path.getsize(f)>1000
              assert hashlib.sha256(open(f,'rb').read()).hexdigest()==v['sha256']
          assert os.path.getsize(os.path.join(p,'aidan_house_master_v2.blend'))>1000
          print('PASS: candidate geometry and render integrity; G2/G4 NOT APPROVED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aidan-house-high-detail-master-v2
          path: ${{ runner.temp }}/aidan-house-hd-v2/
          if-no-files-found: warn
          retention-days: 7


  dev_camera_glb:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exporter syntax
        run: python3 -m py_compile tools/dev-camera/export_aidan_glb.py tools/map_blender/aidan_house_master_v2.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
      - name: Export GLB candidate
        env:
          AIDAN_GLTF_OUTPUT: ${{ runner.temp }}/aidan-dev-camera
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/dev-camera/export_aidan_glb.py
      - name: Validate GLB container and report
        env:
          AIDAN_GLTF_OUTPUT: ${{ runner.temp }}/aidan-dev-camera
        run: |
          python3 - <<'PY'
          import os,struct,json,hashlib
          from pathlib import Path
          root=Path(os.environ['AIDAN_GLTF_OUTPUT'])
          p=root/'aidan_house_master_v2.glb'
          data=p.read_bytes()
          assert len(data)>1000
          magic,version,length=struct.unpack_from('<4sII',data)
          assert magic==b'glTF' and version==2 and length==len(data)
          chunk_length,chunk_type=struct.unpack_from('<I4s',data,12)
          assert chunk_type==b'JSON'
          gltf=json.loads(data[20:20+chunk_length])
          assert len(gltf.get('meshes',[]))>100
          report=json.loads((root/'manifest.json').read_text())
          assert report['status']=='DEVELOPMENT_VIEWER_ONLY_NOT_ART_APPROVED'
          report['sha256']=hashlib.sha256(data).hexdigest()
          (root/'manifest.json').write_text(json.dumps(report,indent=2))
          print('PASS: GLB v2, mesh count, hash, development-only marker')
          PY
      - name: Upload GLB for development viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-dev-camera-glb-v2
          path: ${{ runner.temp }}/aidan-dev-camera/
          if-no-files-found: warn
          retention-days: 7

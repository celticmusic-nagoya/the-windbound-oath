name: Aidan Roof Geometry Candidate QA
on:
  pull_request:
    paths:
      - 'tools/map_blender/aidan_roof_candidate_01.py'
      - 'tools/map_blender/aidan_roof_render_01.py'
      - 'tools/map_blender/test_aidan_roof_candidate_01.py'
      - '.github/workflows/aidan-roof-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static QA
        run: |
          python3 -m py_compile tools/map_blender/aidan_roof_candidate_01.py tools/map_blender/aidan_roof_render_01.py
          python3 tools/map_blender/test_aidan_roof_candidate_01.py
      - name: Install Blender for geometry QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 xvfb
          blender --version
      - name: Geometry preview only — NOT art approval
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-roof-qa
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python tools/map_blender/aidan_roof_render_01.py
          test -s "$AIDAN_ROOF_OUTPUT/manifest.json"
      - name: Verify five nonempty images and manifest
        env:
          AIDAN_ROOF_OUTPUT: ${{ runner.temp }}/aidan-roof-qa
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          p=os.environ['AIDAN_ROOF_OUTPUT']
          m=json.load(open(os.path.join(p,'manifest.json')))
          assert m['status']=='GEOMETRY_ONLY_NO_PBR_NO_ART_APPROVAL'
          assert len(m['views'])==5
          for v in m['views']:
              path=os.path.join(p,v['file'])
              assert os.path.getsize(path)>1000
              assert hashlib.sha256(open(path,'rb').read()).hexdigest()==v['sha256']
          assert os.path.getsize(os.path.join(p,'aidan_roof_geometry_candidate.blend'))>1000
          print('PASS: geometry preview artifacts (NOT G2/G4)')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-roof-geometry-candidate-qa
          path: ${{ runner.temp }}/aidan-roof-qa/
          if-no-files-found: warn
          retention-days: 7

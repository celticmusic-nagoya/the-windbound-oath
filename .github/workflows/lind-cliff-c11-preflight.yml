name: C11 cliff local patch preflight (no render)
on:
  push:
    branches: [feature/lind-cliff-rock-art-study-20261118]
    paths:
      - 'tools/production_qa/lind_blueprint/c11_recess_patch.py'
      - '.github/workflows/lind-cliff-c11-preflight.yml'
      - 'tools/production_qa/lind_blueprint/write_c11_handoff.py'
permissions:
  contents: read
concurrency:
  group: lind-cliff-c11-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate C11 script syntax and fail-closed source contract
        id: static_gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/production_qa/lind_blueprint/c11_recess_patch.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path("tools/production_qa/lind_blueprint/c11_recess_patch.py")
          tree=ast.parse(p.read_text())
          values={}
          for node in tree.body:
              if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name):
                  try: values[node.targets[0].id]=ast.literal_eval(node.value)
                  except (ValueError,TypeError): pass
          assert len(values.get("SOURCE_SHA",""))==64, "missing pinned source SHA"
          assert values.get("TARGET")=="C9 B carrier", "carrier contract changed"
          assert values.get("DEPTH",0)>0, "patch depth must be positive"
          text=p.read_text()
          for gate in ("changed_original_vertex_count", "nonmanifold_edges", "boundary_edges", "C11_RECESS_PATCH_UNAPPROVED"):
              assert gate in text, f"missing expected safety gate: {gate}"
          print("C11_PREFLIGHT_PASS_STATIC_ONLY_NOT_RENDERED")
          PY
      - name: Write resumable C11 checkpoint even after failure
        if: always()
        shell: bash
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GATE: ${{ steps.static_gate.outcome }}
        run: |
          set -euo pipefail
          if [[ "$GATE" == success ]]; then state=success; else state=failure; fi
          python3 tools/production_qa/lind_blueprint/write_c11_handoff.py \
            --commit "$COMMIT" --run-id "$RUN_ID" --preflight "$state" \
            --output /tmp/c11-checkpoint/c11_handoff.json
      - name: Preserve checkpoint for next AI session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c11-handoff-${{ github.sha }}
          path: /tmp/c11-checkpoint/c11_handoff.json
          if-no-files-found: warn
          retention-days: 30

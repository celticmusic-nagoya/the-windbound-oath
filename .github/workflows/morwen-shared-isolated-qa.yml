name: Morwen isolated shared adapter QA
on:
  push:
    branches: [feature/morwen-artdirected-sculpt-20261119]
    paths:
      - tools/production_qa/morwen_shared_session_adapter.py
      - .github/workflows/morwen-shared-isolated-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morwen-shared-isolated-qa
  cancel-in-progress: false
jobs:
  isolated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b163511dcc5a6951bceb69c196578af3930db281
          path: common
          persist-credentials: false
      - name: Isolated contract regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          PYTHONPATH="$PWD/common/tools/production_qa" python3 tools/production_qa/morwen_shared_session_adapter.py common 2>&1 | tee evidence/qa.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-shared-isolated-${{ matrix.os }}
          path: evidence/
          retention-days: 7

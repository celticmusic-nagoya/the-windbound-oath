name: C11 Method E individual block sculpt (UNAPPROVED candidate)
# Reproduces Claude's local Method E run: replaces the D4 repair islands with
# individually sculpted polyhedral rock masses, keeping the D4
# fold-free UV method. Candidate only; no adoption, merge or canon change.
on:
  workflow_dispatch:
  push:
    branches: [feature/lind-cliff-rock-art-study-20261118]
    paths:
      - '.github/workflows/lind-cliff-c11-method-e.yml'
      - 'tools/production_qa/lind_blueprint/c11_method_e_block_sculpt.py'
      - 'tools/production_qa/lind_blueprint/c11_uv_qa.py'
      - 'tools/production_qa/lind_blueprint/c11_method_d4_joint_facets.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: lind-cliff-c11-blender-${{ github.ref }}
  cancel-in-progress: false
jobs:
  method-e:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check concurrent cliff runs before consuming production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c11-e
          for state in in_progress queued waiting pending requested; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" --jq '.workflow_runs[] | [.id,.head_branch,.name] | @tsv' >> /tmp/c11-e/active-runs.tsv
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          rows = [l.split('\t',2) for l in Path('/tmp/c11-e/active-runs.tsv').read_text().splitlines()]
          conflicts = [r for r in rows if r[0] != os.environ['GITHUB_RUN_ID'] and ('cliff' in r[2].lower() or 'c11' in r[2].lower() or r[1] == os.environ['GITHUB_REF_NAME'])]
          assert not conflicts, conflicts
          PY
      - name: Download SHA-pinned D4 candidate and Method C reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in /tmp/c11-e
          gh api repos/${{ github.repository }}/actions/artifacts/14616152278/zip > /tmp/in/d4.zip
          unzip -p /tmp/in/d4.zip c11_method_d4_joint_facets_UNAPPROVED.blend > /tmp/in/d4.blend
          gh api repos/${{ github.repository }}/actions/artifacts/14606190629/zip > /tmp/in/c.zip
          unzip -p /tmp/in/c.zip c11_recess_patch_UNAPPROVED.blend > /tmp/in/c.blend
          printf '%s  %s\n%s  %s\n' \
            0e560afc031f2356ade277e7b4f89eb01a2e62acdcda780c1c366112b90d99ff /tmp/in/d4.blend \
            d0e91ae7543f2995b70c2a3f2d59e625d7cc828e6328ccc90c9224d060b0b545 /tmp/in/c.blend | sha256sum -c -
      - name: Provision verified headless runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libgbm1
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "EGL_PLATFORM=surfaceless" >> "$GITHUB_ENV"
      - name: Install SHA-verified Blender 5.3.0
        run: |
          set -euo pipefail
          test "$(git hash-object tools/production_qa/install_blender_530.sh)" = 4f49728f62b2f2e4d9b3a8f3cc1a5b27b79962ed
          bash tools/production_qa/install_blender_530.sh /tmp/two-blender53
      - name: Run Method E (fail-closed geometry + UV checks)
        run: |
          set -euo pipefail
          timeout 900 /tmp/two-blender53/blender -b --factory-startup --python-exit-code 1 \
            --python tools/production_qa/lind_blueprint/c11_method_e_block_sculpt.py -- \
            /tmp/in/d4.blend /tmp/in/c.blend /tmp/c11-e
          python3 - <<'PY'
          import json
          ci = json.load(open('/tmp/c11-e/c11_method_e_report.json'))
          local = json.load(open('assets/candidates/lind/windwaiting-cliff-c11/method-e/c11_method_e_report.json'))
          assert all(ci['checks'].values()), ci['checks']
          ci['reproduces_claude_local_geometry'] = ci['carrier_geometry_sha256'] == local['carrier_geometry_sha256']
          ci['reproduces_claude_local_uv_audit'] = ci['uv_audit'] == local['uv_audit']
          json.dump(ci, open('/tmp/c11-e/c11_method_e_report.json', 'w'), indent=2)
          print('REPRO', ci['reproduces_claude_local_geometry'], ci['reproduces_claude_local_uv_audit'])
          PY
      - name: Preserve native checkpoint before rendering
        uses: actions/upload-artifact@v4
        with:
          name: c11-native-checkpoint-${{ github.run_id }}
          path: /tmp/c11-e/
          retention-days: 30
      - name: Verify native reopen
        run: |
          /tmp/two-blender53/blender -b /tmp/c11-e/c11_method_e_block_sculpt_UNAPPROVED.blend --disable-autoexec --python-exit-code 1 --python-expr 'import bpy; assert any(o.type=="MESH" for o in bpy.context.scene.objects); print("C11_NATIVE_REOPEN_PASS")'
      - name: Fixed-camera review, clay, close-ups, UV checker, sections
        run: |
          set -euo pipefail
          blend=/tmp/c11-e/c11_method_e_block_sculpt_UNAPPROVED.blend
          timeout 900 /tmp/two-blender53/blender -b --factory-startup --python-exit-code 1 \
            --python tools/production_qa/lind_blueprint/c11_render_review.py -- "$blend" /tmp/c11-e/review
          timeout 1200 /tmp/two-blender53/blender -b --factory-startup --python-exit-code 1 \
            --python tools/production_qa/lind_blueprint/c11_clay_closeup_review.py -- "$blend" /tmp/c11-e/clay e
          (cd /tmp/c11-e && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve candidate, report and renders, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c11-method-e-${{ github.sha }}
          path: /tmp/c11-e/
          if-no-files-found: warn
          retention-days: 30

name: Morwen Blender 31 Framing QA
on:
  pull_request:
    paths:
      - 'tools/blender/morwen_blender_26/render_and_export.py'
      - '.github/workflows/morwen-blender-31.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libopengl0 libx11-6 libxext6 libxrender1
      - name: Preflight and build
        run: |
          blender -b -noaudio --python tools/blender/morwen_blender_27/preflight.py
          blender -b -noaudio --python tools/blender/morwen_blender_24/build_torso.py
      - name: Render only
        env:
          MORWEN_RENDER_ONLY: '1'
        run: blender -b -noaudio --python tools/blender/morwen_blender_26/render_and_export.py
      - name: Validate transparency and occupied bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          base=Path('assets/candidates/morwen-blender-26')
          for name in ['front','left','right','back','three_quarter']:
              p=base/(name+'.png')
              data=p.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              w,h,depth,color=struct.unpack('>IIBB',data[16:26])
              assert w==512 and h==768 and color==6, (name,w,h,color)
              chunks=[];i=8
              while i<len(data):
                  n=int.from_bytes(data[i:i+4],'big');typ=data[i+4:i+8]
                  if typ==b'IDAT':chunks.append(data[i+8:i+8+n])
                  i+=n+12
                  if typ==b'IEND':break
              raw=zlib.decompress(b''.join(chunks))
              # Blender PNG may use all PNG row filters; alpha bytes are unchanged by filters
              # only after unfiltering. Validate via Pillow on runner.
              print(name,w,h,len(raw))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morwen-31-framed-five-views
          path: assets/candidates/morwen-blender-26/
          if-no-files-found: warn

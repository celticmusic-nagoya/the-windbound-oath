name: Aidan PBR File Manifest Discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/map_blender/discover_polyhaven_pbr_files.py'
      - 'tools/map_blender/download_polyhaven_candidate_maps.py'
      - 'tools/map_blender/aidan_pbr_candidate_materials.py'
      - 'tools/map_blender/aidan_home_production_candidate.py'
      - 'tools/map_blender/aidan_pbr_shortlist.json'
      - '.github/workflows/aidan-pbr-file-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate script
        run: |
          python -m py_compile tools/map_blender/discover_polyhaven_pbr_files.py
          python -m py_compile tools/map_blender/download_polyhaven_candidate_maps.py
      - name: Discover exact file URLs and map channels (no downloads)
        run: python tools/map_blender/discover_polyhaven_pbr_files.py tools/map_blender/aidan_pbr_shortlist.json "${RUNNER_TEMP}/pbr-file-manifest.json"
      - name: Save source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-pbr-file-manifest-candidate
          path: ${{ runner.temp }}/pbr-file-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Download 1K candidate textures with SHA-256 audit
        run: python tools/map_blender/download_polyhaven_candidate_maps.py "${RUNNER_TEMP}/pbr-file-manifest.json" "${RUNNER_TEMP}/pbr-candidate"
      - name: Verify 15 maps and their hashes
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'pbr-candidate'
          data=json.loads((base/'download-manifest.json').read_text())
          assert len(data['textures']) == 15
          for row in data['textures']:
              p=base/row['path']
              assert p.is_file() and p.stat().st_size==row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          print('PASS: 15 PBR candidate textures SHA-256 verified')
          PY
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Render five candidate views with PBR
        env:
          AIDAN_PBR_CANDIDATE_DIR: ${{ runner.temp }}/pbr-candidate
          AIDAN_RENDER_OUTPUT: ${{ runner.temp }}/aidan-pbr-render
        run: blender -b -t 2 --python-exit-code 1 --python tools/map_blender/aidan_home_production_candidate.py
      - name: Independently verify five PNG views and manifest
        env:
          AIDAN_RENDER_OUTPUT: ${{ runner.temp }}/aidan-pbr-render
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["AIDAN_RENDER_OUTPUT"])
          manifest=json.loads((root/"manifest.json").read_text())
          print("Manifest:", manifest, flush=True)
          assert manifest["pbr_candidate"] is True, "PBR candidate flag missing"
          assert (root/"aidan_candidate.blend").stat().st_size>0, "Blend file missing"
          for view in ("front","rear","left","right","game"):
              p=root/("aidan_"+view+".png")
              data=p.read_bytes()
              print("View", view, "bytes", len(data), "header", repr(data[:8]), flush=True)
              assert data[:8]==b"\\x89PNG\\r\\n\\x1a\\n" and len(data)>10000, "Invalid PNG: "+view
              assert hashlib.sha256(data).hexdigest()==manifest["views"][view], "Hash mismatch: "+view
          print("PASS: five PNG files, Blender scene and SHA-256 verified")
          PY
      - name: Save five-view PBR candidate render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-pbr-5view-render-candidate
          path: ${{ runner.temp }}/aidan-pbr-render/
          if-no-files-found: warn
          retention-days: 7
      - name: Save temporary PBR candidate textures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidan-pbr-1k-candidate-not-approved
          path: ${{ runner.temp }}/pbr-candidate/
          if-no-files-found: warn
          retention-days: 3

name: Morwen Production Walk Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-pil
      - name: Python syntax
        run: python3 -m py_compile tools/blender/morwen_production/*.py
      - name: Render only when approved master exists
        run: |
          test -s assets/characters/morwen/MORWEN_MASTER_APPROVED.blend
          blender -b assets/characters/morwen/MORWEN_MASTER_APPROVED.blend -t 2 --python tools/blender/morwen_production/render_walk.py
      - name: Assemble RGBA sprite sheet
        run: python3 tools/blender/morwen_production/spritesheet.py render_output/morwen_walk
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-walk-review-32
          path: render_output/morwen_walk/
          retention-days: 30
          if-no-files-found: warn

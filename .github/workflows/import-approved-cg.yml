name: Import approved CG assets (verified)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/import-approved-cg.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-world-event-integration-20261106
          persist-credentials: true
      - name: Download approved archive from Google Drive
        env:
          FILE_ID: 1zxFm3fHf-mwmh1Yzv1fER2qjvRtdSP-g
        run: |
          python -m pip install --quiet gdown
          gdown --id "$FILE_ID" -O /tmp/approved.zip
      - name: Verify archive and copy only allowlisted assets
        env:
          EXPECTED_SHA256: eac7534628a7fcd74aded8ba1795ced97da8773aa3437bd67ab92fd29708d9bd
          PREFIX: game-repository/
        run: |
          python - <<'PY'
          import os,hashlib,zipfile,json,pathlib,sys
          data=pathlib.Path('/tmp/approved.zip').read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          if digest!=os.environ['EXPECTED_SHA256']:
              raise SystemExit('ZIP SHA-256 mismatch: '+digest+'; no files changed')
          prefix=os.environ['PREFIX']
          with zipfile.ZipFile('/tmp/approved.zip') as z:
              if z.testzip() is not None: raise SystemExit('ZIP CRC check failed')
              manifest_name=('game-repository/docs/art/approved-world-event-original-manifest.json' if prefix=='game-repository/' else 'website-repository/assets/approved/world/WEBP_MANIFEST.json')
              manifest=json.loads(z.read(manifest_name))
              expected={prefix+item['path']:item['sha256'] for item in manifest['files']}
              selected=[n for n in z.namelist() if n.startswith(prefix)]
              if set(selected)!=(set(expected)|{manifest_name}):
                  raise SystemExit('Unexpected or missing archive entries')
              for name,digest in expected.items():
                  blob=z.read(name)
                  if hashlib.sha256(blob).hexdigest()!=digest: raise SystemExit('Asset SHA mismatch: '+name)
                  target=pathlib.Path(name[len(prefix):])
                  if target.is_absolute() or '..' in target.parts: raise SystemExit('Unsafe path')
                  if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest()!=digest:
                      raise SystemExit('Refusing overwrite of existing file: '+str(target))
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(blob)
              target=pathlib.Path(manifest_name[len(prefix):])
              target.parent.mkdir(parents=True,exist_ok=True)
              if target.exists() and target.read_bytes()!=z.read(manifest_name): raise SystemExit('Refusing overwrite of manifest')
              target.write_bytes(z.read(manifest_name))
              print('Verified and copied',len(expected),'assets')
          PY
      - name: Commit verified files to integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/approved docs/art/approved-world-event-original-manifest.json 2>/dev/null || git add assets/approved
          if ! git diff --cached --quiet; then
            git commit -m 'assets: import verified approved CG originals [skip ci]'
            git push origin HEAD:feature/approved-world-event-integration-20261106
          fi

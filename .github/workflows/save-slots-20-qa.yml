name: SAVE-SLOTS-20 isolated QA
on:
  pull_request:
    paths:
      - 'js/save-slots.js'
      - 'js/save-continue.js'
      - 'tests/save-slots.test.js'
      - 'tests/save-slots-integration.test.cjs'
      - 'css/save-slots.css'
      - 'index.html'
      - '.github/workflows/save-slots-20-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check js/save-slots.js
          node --check js/save-continue.js
      - name: Storage regression tests
        run: node --test tests/save-slots.test.js tests/save-slots-integration.test.cjs

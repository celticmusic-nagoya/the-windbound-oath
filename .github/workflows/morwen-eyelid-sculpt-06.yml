name: MORWEN EYELID-06 curve proposal QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/blender/morwen_production/eyelid_sculpt/**'
      - 'tools/blender/morwen_production/_qa/eyelid_retopo_05/EYE_TARGETS_05.json'
      - '.github/workflows/morwen-eyelid-sculpt-06.yml'

permissions:
  contents: read

jobs:
  curve-proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deterministic target proposal
        run: |
          python -m unittest discover -s tools/blender/morwen_production/eyelid_sculpt -p 'test_closed_curve_06.py' -v
          python tools/blender/morwen_production/eyelid_sculpt/propose_closed_curve_06.py \
            --source tools/blender/morwen_production/_qa/eyelid_retopo_05/EYE_TARGETS_05.json \
            --output /tmp/eyelid06_target_a.json
          python tools/blender/morwen_production/eyelid_sculpt/propose_closed_curve_06.py \
            --source tools/blender/morwen_production/_qa/eyelid_retopo_05/EYE_TARGETS_05.json \
            --output /tmp/eyelid06_target_b.json
          cmp /tmp/eyelid06_target_a.json /tmp/eyelid06_target_b.json
          sha256sum /tmp/eyelid06_target_a.json
      - uses: actions/upload-artifact@v4
        with:
          name: eyelid06-unreviewed-curve-proposal
          path: /tmp/eyelid06_target_a.json
          retention-days: 7

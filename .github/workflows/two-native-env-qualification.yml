name: TWO native environment qualification (calibration fixture, no asset writes)
on:
  push:
    branches:
      - infra/native-env-qualification-20261123
    paths:
      - tools/native_env/**
      - .github/workflows/two-native-env-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: two-native-env-qualification
  cancel-in-progress: false
env:
  ENGINE_468_COMMIT: 5c067e518d4d764dc1499920fe4a2513340c96b9
jobs:
  mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: m
        run: |
          if [ -f tools/native_env/restore_request.json ]; then echo mode=run2 >> "$GITHUB_OUTPUT"; else echo mode=run1 >> "$GITHUB_OUTPUT"; fi
      - name: Preflight exact bytes
        run: |
          python3 -m py_compile tools/native_env/*.py
          bash -n tools/native_env/hairharpy_runtime.sh
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/two-native-env-qualification.yml'))"
  blender-session:
    needs: mode
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned #468 planner engine (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_468_COMMIT }}
          path: engine468
          persist-credentials: false
          sparse-checkout: tools/production_qa
      - name: Install Blender 5.3.0 and 5.2.4 with official SHA-256 (main installers)
        run: |
          set -euo pipefail
          mkdir -p /tmp/two-work
          bash tools/production_qa/install_blender_530.sh /tmp/b530 | tee /tmp/two-work/install_530.txt
          if [ "${{ needs.mode.outputs.mode }}" = run1 ]; then bash tools/production_qa/install_blender_524.sh /tmp/b524 | tee /tmp/two-work/install_524.txt; fi
      - name: Restore prior run artifact (run2)
        if: needs.mode.outputs.mode == 'run2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/native_env/fetch_restore.py tools/native_env/restore_request.json /tmp/restore/src
      - name: Long-session adapter
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ needs.mode.outputs.mode }}" = run1 ]; then extra="--blender524 /tmp/b524/blender"; else extra="--restore /tmp/restore/src"; fi
          python3 tools/native_env/native_session_adapter.py --blender /tmp/b530/blender $extra \
            --engine engine468/tools/production_qa --work /tmp/two-work \
            --blueprint tools/morwen_authored_sculpt/precision_blueprint_v2.json --mode ${{ needs.mode.outputs.mode }} --budget 8400 --reserve 600
          cp /tmp/restore/restore_provenance.json /tmp/two-work/ 2>/dev/null || true
      - name: Upload native checkpoints, renders and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-native-session-${{ needs.mode.outputs.mode }}
          path: /tmp/two-work/
          if-no-files-found: error
          retention-days: 30
  hairharpy:
    needs: mode
    if: needs.mode.outputs.mode == 'run1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: HairHarpy v2.0.0 official release, runtime and Blender 5.3.0 bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/native_env/hairharpy_runtime.sh /tmp/hh-out
      - name: Upload evidence (reports and screenshots only; no HairHarpy binaries are redistributed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-hairharpy-qualification
          path: /tmp/hh-out/
          if-no-files-found: error
          retention-days: 30

name: Morwen MPFB Base Render Inspection
on:
  push:
    branches:
      - feature/morwen-production-pipeline-01
    paths:
      - '.github/workflows/morwen-mpfb-base-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: makehumancommunity/mpfb2
          ref: d0a32e57a7f915cb2f2b95410e2117648c7bbb7e
          path: _upstream_mpfb
          persist-credentials: false
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Render unmodified CC0 base inspection
        run: blender -b -t 2 --python tools/blender/morwen_production/render_mpfb_base_review.py
      - name: Validate outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('render_output/morwen_mpfb_base_review')
          q=json.loads((p/'QA.json').read_text())
          assert q['production_approved'] is False
          assert q['vertices']>1000
          assert all((p/(n+'.png')).stat().st_size>1000 for n in ['front','right','back','left','three_quarter'])
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-mpfb-base-inspection-not-approved
          path: render_output/morwen_mpfb_base_review/
          retention-days: 14

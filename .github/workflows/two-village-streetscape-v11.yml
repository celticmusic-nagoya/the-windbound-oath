name: TWO isolated village streetscape V11
on:
  push:
    branches: [feature/lind-village-world-integration-plan-01]
    paths: ['tools/map_blender/lind/home/village_streetscape_v11.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: two-village-streetscape-v11
  cancel-in-progress: false
jobs:
  streetscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/map_blender/lind/home/village_streetscape_v11.py
      - uses: actions/checkout@v4
        with:
          ref: dd47929f3e100b3cfcabbe48a614e699da1c5ea9
          path: engine
          persist-credentials: false
          sparse-checkout: |
            tools/blueprint_engine
            tools/production_qa
      - name: Restore exact V10 and author street enclosure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v10" "$RUNNER_TEMP/out"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15112692260/zip" > "$RUNNER_TEMP/v10.zip"
          printf '%s  %s\n' c7ed01320d6e73846823526cd3feb4ba67b8b40dff58660f3a1f85c21419a3fc "$RUNNER_TEMP/v10.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/v10.zip"
          unzip -q "$RUNNER_TEMP/v10.zip" -d "$RUNNER_TEMP/v10"
          python3 -m py_compile 'tools/map_blender/lind/home/village_streetscape_v11.py'
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil libgl1 libegl1 libglx-mesa0 libxrender1 libxi6 libxkbcommon0
          bash engine/tools/production_qa/install_blender_530.sh "$RUNNER_TEMP/blender530"
          "$RUNNER_TEMP/blender530/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 --python 'tools/map_blender/lind/home/village_streetscape_v11.py' -- "$RUNNER_TEMP/v10/village_landscape_v10_UNAPPROVED.blend" "$RUNNER_TEMP/out" "$PWD/engine"
      - name: Android-compatible JPEG previews, preserve verified PNG originals
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/out" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from PIL import Image
          out=Path(sys.argv[1]);q=json.loads((out/'qa.json').read_text())
          for p in sorted(out.glob('*.png')):
              assert hashlib.sha256(p.read_bytes()).hexdigest()==q['outputs'][p.name]
              with Image.open(p) as im:
                  im=im.convert('RGB');im.thumbnail((1600,1000))
                  jpg=p.with_suffix('.jpg');im.save(jpg,'JPEG',quality=92,subsampling=0,optimize=True)
              with Image.open(jpg) as im:im.verify()
              q['outputs'][jpg.name]=hashlib.sha256(jpg.read_bytes()).hexdigest()
          (out/'qa.json').write_text(json.dumps(q,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-village-streetscape-v11
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

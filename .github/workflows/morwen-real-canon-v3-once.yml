name: Morwen real canon v3 candidate one-time generation
on:
  push:
    branches:
      - feature/morwen-hd-canonical-v2-registration
    paths:
      - scripts/build_morwen_real_canon_v3.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate new candidate files
        run: python scripts/build_morwen_real_canon_v3.py
      - name: Commit only new candidate assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/candidates/morwen/real-canon-v3/
          git diff --cached --quiet && exit 0
          git commit -m "assets: add Morwen real canon v3 anchor candidates"
          git push

name: DEV menu runtime guard QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/runtime-environment.js'
      - 'js/prologue-dev.js'
      - 'js/dev/motion-test.js'
      - 'js/title-screen.js'
      - 'js/field/rilde-village.js'
      - 'js/field/moss-forest-runtime.js'
      - 'tests/moss/public_dev_environment.test.js'
      - 'tests/moss/public_dev_browser.py'
      - 'dev-fresh-20261108.html'
      - 'tests/moss/dev_menu_runtime_guard.test.js'
      - '.github/workflows/dev-menu-runtime-guard-qa.yml'
  push:
    branches-ignore:
      - 'two-asset-lease/v1/**'
      - 'two-checkpoint/v1/**'
    tags-ignore:
      - 'two-asset-lease/v1/**'
      - 'two-checkpoint/v1/**'
    paths:
      - 'index.html'
      - 'js/runtime-environment.js'
      - 'js/prologue-dev.js'
      - 'js/dev/motion-test.js'
      - 'js/title-screen.js'
      - 'js/field/rilde-village.js'
      - 'js/field/moss-forest-runtime.js'
      - 'tests/moss/public_dev_environment.test.js'
      - 'tests/moss/public_dev_browser.py'
      - 'dev-fresh-20261108.html'
      - 'tests/moss/dev_menu_runtime_guard.test.js'
      - '.github/workflows/dev-menu-runtime-guard-qa.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/moss/dev_menu_runtime_guard.test.js
      - run: node tests/moss/public_dev_environment.test.js
  checkout-browser:
    if: github.event_name == 'pull_request'
    # Playwright 1.55 supports Ubuntu 24.04, not the current ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tests/moss/public_dev_browser.py
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      # Candidate bytes, not mutable live deployments; --live is a separate manual check.
      - run: python tests/moss/public_dev_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-dev-checkout-browser-qa
          path: browser-dev-qa/
          if-no-files-found: ignore

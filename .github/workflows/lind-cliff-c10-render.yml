name: C10 cliff candidate render
on:
  push:
    branches: [feature/lind-cliff-rock-art-study-20261118]
    paths:
      - '.github/workflows/lind-cliff-c10-render.yml'
      - 'assets/candidates/lind/windwaiting-cliff-c10/**'
      - 'tools/production_qa/lind_blueprint/**'
      - 'tools/production_qa/junction_contact_faces.py'
  pull_request:
    paths:
      - '.github/workflows/lind-cliff-c10-render.yml'
      - 'assets/candidates/lind/windwaiting-cliff-c10/**'
  workflow_dispatch:
    inputs:
      blueprint:
        description: Analyze the SHA-verified C9 and archived C10 candidates
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lind-cliff-c10-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  render:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    env:
      C10_ARTIFACT_ID: '14580687938'
      C10_SHA: 8d0618ddd9db7562492e94477503ed53b621e908d88ab34c7bd07afb0c159223
      C10_ARCHIVE_SHA: adeb71d2924a899ea82e906763a09394765d53b4ca8a87f71da19974477be8cb
      C9_SHA: 886ad8d4d49b3951da84bf2b728505767bef2f8b4288d9472ac0c129a018d12a
      C9_SOURCE: assets/candidates/lind/windwaiting-cliff-c9/C9-B/C_UNAPPROVED.blend
      BLUEPRINT: ${{ github.event_name == 'push' || inputs.blueprint == true }}
      SCULPT: 'false'
      RETOPO: 'false'
      BEDROCK: 'false'
      JUNCTION_CANDIDATE: junction_retopo_UNAPPROVED.blend
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2
      - name: Select blueprint or C10 render
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$BEFORE" HEAD -- assets/candidates/lind/windwaiting-cliff-c10; then
              echo "BLUEPRINT=false" >> "$GITHUB_ENV"
            elif ! git diff --quiet "$BEFORE" HEAD -- tools/production_qa/lind_blueprint/sculpt_bedrock.py; then
              echo "BLUEPRINT=false" >> "$GITHUB_ENV"
              echo "RETOPO=true" >> "$GITHUB_ENV"
              echo "BEDROCK=true" >> "$GITHUB_ENV"
              echo "JUNCTION_CANDIDATE=bedrock_wall_UNAPPROVED.blend" >> "$GITHUB_ENV"
            elif ! git diff --quiet "$BEFORE" HEAD -- tools/production_qa/junction_contact_faces.py tools/production_qa/lind_blueprint/retopo_junction.py; then
              echo "BLUEPRINT=false" >> "$GITHUB_ENV"
              echo "RETOPO=true" >> "$GITHUB_ENV"
            elif ! git diff --quiet "$BEFORE" HEAD -- tools/production_qa/lind_blueprint/sculpt_junction.py; then
              echo "BLUEPRINT=false" >> "$GITHUB_ENV"
              echo "SCULPT=true" >> "$GITHUB_ENV"
            fi
          fi
      - name: Reuse verified blueprint evidence
        id: blueprint_cache
        if: env.BLUEPRINT == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/lind-blueprint-package
          key: lind-blueprint-530-${{ env.C10_ARCHIVE_SHA }}-${{ hashFiles('assets/candidates/lind/windwaiting-cliff-c9/C9-B/C_UNAPPROVED.blend', 'assets/candidates/lind/windwaiting-cliff-c9/C9-B/C_cg_review.png', 'assets/approved/game/cliff/sunset_background.png', 'tools/production_qa/lind_blueprint/*.py', 'assets/candidates/lind/windwaiting-cliff-c9/C9-B/cc0_manifest.json', '.github/workflows/lind-cliff-c10-render.yml') }}
      - name: Install official Blender 5.3.0 candidate with upstream SHA-256 verification
        if: steps.blueprint_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base="https://mirror.blender.org/release/Blender5.3"
          name="blender-5.3.0-linux-x64.tar.xz"
          curl --fail --location --retry 0 --connect-timeout 20 --max-time 90 "$base/blender-5.3.0.sha256" -o "$work/checksums"
          python3 - "$work/checksums" "$work/expected.sha256" "$name" <<'PY'
          import re,sys
          from pathlib import Path
          matches=[]
          for line in Path(sys.argv[1]).read_text().splitlines():
              if sys.argv[3] in line:
                  hashes=re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])',line)
                  if len(hashes)!=1: raise SystemExit('Invalid upstream SHA row')
                  matches.append(hashes[0].lower())
          if len(matches)!=1: raise SystemExit('Expected exactly one upstream SHA')
          Path(sys.argv[2]).write_text(f'{matches[0]}  {sys.argv[3]}\n')
          PY
          curl --fail --location --retry 0 --connect-timeout 20 --max-time 540 "$base/$name" -o "$work/$name"
          (cd "$work" && sha256sum -c expected.sha256)
          mkdir -p /tmp/two-blender53
          tar -xJf "$work/$name" -C /tmp/two-blender53 --strip-components=1
          /tmp/two-blender53/blender -b --factory-startup --python-expr 'import bpy; assert tuple(bpy.app.version)==(5,3,0); print("TWO_BLENDER_530_RUNTIME_PASS")'
          rm -rf "$work"
      - name: Verify source and create C10 Blender original
        if: env.BLUEPRINT != 'true' && env.SCULPT != 'true' && env.RETOPO != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/c10-render
          SOURCE="assets/candidates/lind/windwaiting-cliff-c9/C9-B/C_UNAPPROVED.blend"
          test -s "$SOURCE"
          file "$SOURCE"
          /tmp/two-blender53/blender -b --factory-startup --python assets/candidates/lind/windwaiting-cliff-c10/sculpt_c10.py -- "$SOURCE" /tmp/c10-render
      - name: Prepare headless rendering
        if: env.RETOPO != 'true' && steps.blueprint_cache.outputs.cache-hit != 'true'
        run: tools/production_qa/lind_blueprint/prepare_headless.sh
      - name: Independent C10 topology audit (non-destructive)
        if: env.BLUEPRINT != 'true' && env.SCULPT != 'true' && env.RETOPO != 'true'
        run: |
          /tmp/two-blender53/blender -b --factory-startup --python tools/production_qa/audit_lind_c10_mesh.py -- /tmp/c10-render/windwaiting_cliff_C10_UNAPPROVED.blend /tmp/c10-render/C10_TOPOLOGY_QA.json
      - name: Render fixed C10 camera views
        if: env.BLUEPRINT != 'true' && env.SCULPT != 'true' && env.RETOPO != 'true'
        run: |
          cat > /tmp/c10-render/render_views.py <<'PY'
          import bpy
          from pathlib import Path
          source=Path('/tmp/c10-render/windwaiting_cliff_C10_UNAPPROVED.blend')
          bpy.ops.wm.open_mainfile(filepath=str(source))
          scene=bpy.context.scene
          scene.render.engine='BLENDER_EEVEE'
          scene.render.resolution_percentage=65
          scene.render.image_settings.file_format='PNG'
          scene.render.threads=4
          for name in ('cg_review','front','left','right','elevated','shore_detail','sunset'):
              camera=bpy.data.objects.get(name)
              if camera is None or camera.type!='CAMERA':
                  raise RuntimeError('Missing camera: '+name)
              scene.camera=camera
              scene.render.filepath='/tmp/c10-render/'+name+'.png'
              bpy.ops.render.render(write_still=True)
          PY
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/two-blender53/blender -b --python /tmp/c10-render/render_views.py
      - name: Verify render files
        if: env.BLUEPRINT != 'true' && env.SCULPT != 'true' && env.RETOPO != 'true'
        run: |
          set -euo pipefail
          for view in cg_review front left right elevated shore_detail sunset; do test -s "/tmp/c10-render/$view.png"; done
          sha256sum /tmp/c10-render/* > /tmp/c10-render/SHA256SUMS
      - name: Verify archived C10 source and reuse its reference renders
        if: env.SCULPT == 'true' || env.RETOPO == 'true' || (env.BLUEPRINT == 'true' && steps.blueprint_cache.outputs.cache-hit != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lind-c10-source
          python tools/production_qa/download_actions_artifact.py \
            --repo "$GITHUB_REPOSITORY" --artifact-id "$C10_ARTIFACT_ID" \
            --expected-zip-sha256 "$C10_ARCHIVE_SHA" --output /tmp/lind-c10.zip
          python - <<'PYZIP'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          names = ("windwaiting_cliff_C10_UNAPPROVED.blend", "cg_review.png", "front.png",
                   "left.png", "right.png", "elevated.png", "shore_detail.png", "sunset.png",
                   "C10_TOPOLOGY_QA.json")
          with ZipFile("/tmp/lind-c10.zip") as archive:
              checks = {Path(name).name: digest for digest, name in
                        (line.split(maxsplit=1) for line in archive.read("SHA256SUMS").decode().splitlines())}
              for name in names:
                  content = archive.read(name)
                  if hashlib.sha256(content).hexdigest() != checks.get(name):
                      raise ValueError(f"C10 artifact member checksum mismatch: {name}")
                  (Path("/tmp/lind-c10-source") / name).write_bytes(content)
          PYZIP
      - name: Carve and render the unapproved C10 junction
        if: env.SCULPT == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/lind-junction/{baseline,candidate,review}
          cp /tmp/lind-c10-source/{cg_review,front,shore_detail}.png /tmp/lind-junction/baseline/
          exec > >(tee /tmp/lind-junction/execution.log) 2>&1
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/two-blender53/blender -b --disable-autoexec \
            --python-exit-code 1 --python tools/production_qa/lind_blueprint/sculpt_junction.py -- \
            /tmp/lind-c10-source/windwaiting_cliff_C10_UNAPPROVED.blend /tmp/lind-junction/candidate "$PWD"
          status=$?
          set -e
          if [[ -s /tmp/lind-junction/candidate/cg_review.png ]]; then
            python tools/production_qa/lind_blueprint/compare.py assets/approved/game/cliff/sunset_background.png \
              /tmp/lind-junction/baseline/cg_review.png /tmp/lind-junction/candidate/cg_review.png \
              /tmp/lind-junction/review --c9-label "C10 baseline" --c10-label "C10 junction candidate"
          fi
          (cd /tmp/lind-junction && find baseline candidate review -type f -print0 2>/dev/null |
            sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit "$status"
      - name: Audit the locked junction candidate
        if: env.RETOPO == 'true' && env.BEDROCK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JUNCTION_SHA: e363269d37c29bc02463247c70408ef8c2275dc673a285c72f3b4c1a54818c14
        run: |
          set -euo pipefail
          root=/tmp/lind-retopo
          mkdir -p "$root"
          python tools/production_qa/download_actions_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id 14585742052 --expected-zip-sha256 d0fb1933530b76c4ca4da8053da53937040fa3c7b47d8fe787bf40cafe218a14 --output /tmp/lind-junction-input.zip
          unzip -p /tmp/lind-junction-input.zip candidate/junction_UNAPPROVED.blend > /tmp/junction_UNAPPROVED.blend
          /tmp/two-blender53/blender -b --disable-autoexec --python-exit-code 1 --python tools/production_qa/junction_contact_faces.py -- /tmp/junction_UNAPPROVED.blend "$root/junction_contact_faces.json" --expected-sha256 "$JUNCTION_SHA"
      - name: Recover the verified retopology source
        if: env.BEDROCK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lind-retopo
          python tools/production_qa/download_actions_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id 14587169190 --expected-zip-sha256 a72e8dfefb2d1f159885ca0c79bd0dc15118c4853e5cda5948163130994ea2e4 --output /tmp/lind-bedrock-input.zip
          unzip -p /tmp/lind-bedrock-input.zip junction_retopo_UNAPPROVED.blend > /tmp/junction_retopo_UNAPPROVED.blend
      - name: Sculpt the bedrock wall and export its blueprint
        if: env.BEDROCK == 'true'
        run: |
          set -euo pipefail
          root=/tmp/lind-retopo
          scripts=tools/production_qa/lind_blueprint
          bpy=/tmp/two-blender53/blender
          exec > >(tee "$root/execution.log") 2>&1
          "$bpy" -b --disable-autoexec --python-exit-code 1 --python "$scripts/sculpt_bedrock.py" -- /tmp/junction_retopo_UNAPPROVED.blend "$root"
          candidate="$root/$JUNCTION_CANDIDATE"
          sha="$(sha256sum "$candidate" | cut -d ' ' -f 1)"
          second="$(mktemp -d)/blueprint"
          for out in "$root/blueprint" "$second"; do
            "$bpy" -b --disable-autoexec "$candidate" --python-exit-code 1 --python "$scripts/export_blueprint.py" -- "$out" --source-sha "$sha" --input-ref "$GITHUB_SHA:artifact:14587169190:sculpt" --texture-register "$(dirname "$C9_SOURCE")/cc0_manifest.json"
          done
          diff -qr "$root/blueprint" "$second"
      - name: Retopologize the measured wall and export its blueprint
        if: env.RETOPO == 'true' && env.BEDROCK != 'true' && hashFiles('tools/production_qa/lind_blueprint/retopo_junction.py') != ''
        run: |
          set -euo pipefail
          root=/tmp/lind-retopo
          tools=tools/production_qa/lind_blueprint
          bpy=/tmp/two-blender53/blender
          exec > >(tee "$root/execution.log") 2>&1
          "$bpy" -b --disable-autoexec --python-exit-code 1 --python "$tools/retopo_junction.py" -- /tmp/junction_UNAPPROVED.blend "$root"
          candidate="$root/$JUNCTION_CANDIDATE"
          sha="$(sha256sum "$candidate" | cut -d ' ' -f 1)"
          second="$(mktemp -d)/blueprint"
          for out in "$root/blueprint" "$second"; do
            "$bpy" -b --disable-autoexec "$candidate" --python-exit-code 1 --python "$tools/export_blueprint.py" -- "$out" --source-sha "$sha" --input-ref "$GITHUB_SHA:artifact:14585742052:retopo" --texture-register "$(dirname "$C9_SOURCE")/cc0_manifest.json"
          done
          diff -qr "$root/blueprint" "$second"
      - name: Verify reconstruction and render candidate
        if: env.RETOPO == 'true' && hashFiles('tools/production_qa/lind_blueprint/retopo_junction.py') != ''
        run: |
          set -euo pipefail
          root=/tmp/lind-retopo
          tools=tools/production_qa/lind_blueprint
          bpy=/tmp/two-blender53/blender
          candidate="$root/$JUNCTION_CANDIDATE"
          exec > >(tee -a "$root/execution.log") 2>&1
          "$tools/prepare_headless.sh"
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          xvfb-run -a "$bpy" -b --disable-autoexec --python-exit-code 1 --python "$tools/rebuild.py" -- "$root/blueprint" --render --determinism-verified
          result=$?
          set -e
          mkdir -p "$root/baseline"
          cp /tmp/lind-c10-source/{cg_review,front,shore_detail,elevated}.png "$root/baseline/"
          if [[ "$BEDROCK" == true ]]; then
            unzip -p /tmp/lind-bedrock-input.zip blueprint/verification/source.png > "$root/baseline/pre_retopo.png"
          else
            unzip -p /tmp/lind-junction-input.zip candidate/cg_review.png > "$root/baseline/pre_retopo.png"
          fi
          cp "$root/baseline/pre_retopo.png" "$root/prior_fixed.png"
          xvfb-run -a "$bpy" -b --disable-autoexec "$candidate" --python-exit-code 1 --python "$tools/retopo_visuals.py" -- "$root"
          python "$tools/compare.py" assets/approved/game/cliff/sunset_background.png "$root/baseline/cg_review.png" "$root/blueprint/verification/source.png" "$root/review" --c9-label "C10 source" --c10-label "C10 production candidate"
          (cd "$root" && find . -type f ! -name SHA256SUMS ! -name execution.log -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          python -c 'import json,sys; sys.exit(not all(json.load(open(sys.argv[1]))["checks"].values()))' "$root/local_qa.json"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always() && env.RETOPO == 'true'
        with:
          name: lind-cliff-retopo-review-${{ github.sha }}
          path: |
            /tmp/lind-retopo/*.json
            /tmp/lind-retopo/prior_fixed.png
            /tmp/lind-retopo/*.svg
            /tmp/lind-retopo/*.log
            /tmp/lind-retopo/visuals/
            /tmp/lind-retopo/review/
            /tmp/lind-retopo/blueprint/qa.json
            /tmp/lind-retopo/blueprint/verification/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && env.RETOPO == 'true'
        with:
          name: lind-cliff-retopo-${{ github.sha }}
          path: /tmp/lind-retopo/
          retention-days: 14
      - name: Extract and verify archived cliff candidates
        if: env.BLUEPRINT == 'true' && steps.blueprint_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root=/tmp/lind-blueprint-package
          mkdir -p "$root"
          exec > >(tee "$root/execution.log") 2>&1
          trap 'echo "Blueprint stopped at line $LINENO (exit $?). Inspect execution.log and generated QA."' ERR
          bpy=/tmp/two-blender53/blender
          scripts=tools/production_qa/lind_blueprint
          export LIBGL_ALWAYS_SOFTWARE=1
          cp -r /tmp/lind-c10-source "$root/archived-c10"
          python "$scripts/compare.py" assets/approved/game/cliff/sunset_background.png \
            "$(dirname "$C9_SOURCE")/C_cg_review.png" "$root/archived-c10/cg_review.png" \
            "$root/review"
          candidate_status=0
          for candidate in C9 C10; do
            src="$C9_SOURCE"
            expected="$C9_SHA"
            ref="$GITHUB_SHA:git:C9-B/C_UNAPPROVED.blend"
            if [[ "$candidate" == C10 ]]; then
              src=/tmp/lind-c10-source/windwaiting_cliff_C10_UNAPPROVED.blend
              expected="$C10_SHA"
              ref="run:44627719888:artifact:14580687938:commit:5c1d70c6a25248cd705ac7c028e27446327080a9"
            fi
            dest="$root/$candidate"
            scratch="$(mktemp -d)/blueprint"
            for output in "$dest" "$scratch"; do
              "$bpy" -b --disable-autoexec "$src" --python-exit-code 1 \
                --python "$scripts/export_blueprint.py" -- "$output" --source-sha "$expected" --input-ref "$ref" \
                --texture-register "$(dirname "$C9_SOURCE")/cc0_manifest.json"
            done
            diff -qr "$dest" "$scratch"
            xvfb-run -a "$bpy" -b --disable-autoexec --python-exit-code 1 \
              --python "$scripts/rebuild.py" -- "$dest" --render --determinism-verified || candidate_status=1
          done
          (cd "$root" && find C9 C10 archived-c10 review -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit "$candidate_status"
      - name: Verify diagram files and package compact QA
        if: always() && env.BLUEPRINT == 'true'
        run: |
          python - <<'PYREPORT'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          root = Path("/tmp/lind-blueprint-package")
          summary = Path("/tmp/lind-blueprint-qa")
          for entry in ("C9", "C10"):
              source = root / entry
              if not source.exists():
                  continue
              dest = summary / entry
              dest.mkdir(parents=True, exist_ok=True)
              for name in ("manifest.json", "qa.json", "landmarks.json", "scene.json", "materials.json"):
                  if (source / name).is_file():
                      shutil.copyfile(source / name, dest / name)
              for name in ("front", "back", "left", "right", "top", "bottom", "oblique45", "rock_detail", "section"):
                  svg = source / "views" / f"{name}.svg"
                  tag = "polyline" if name == "section" else "polygon"
                  count = sum(element.tag.endswith("}" + tag)
                              for _, element in ET.iterparse(svg))
                  if not count:
                      raise ValueError(f"{entry} {name}: no projected geometry")
                  print(f"{entry} {name}: {count} SVG {tag} elements")
                  if name in {"rock_detail", "section"}:
                      shutil.copyfile(svg, dest / svg.name)
          if (root / "review").is_dir():
              shutil.copytree(root / "review", summary / "review")
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always() && env.BLUEPRINT == 'true'
        with:
          name: lind-cliff-blueprint-qa-${{ github.sha }}
          path: /tmp/lind-blueprint-qa/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && env.BLUEPRINT == 'true'
        with:
          name: lind-cliff-blueprint-unapproved-${{ github.sha }}
          path: /tmp/lind-blueprint-package/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && env.SCULPT == 'true'
        with:
          name: lind-cliff-junction-unapproved-${{ github.sha }}
          path: /tmp/lind-junction/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && env.BLUEPRINT != 'true' && env.SCULPT != 'true' && env.RETOPO != 'true'
        with:
          name: lind-cliff-c10-unapproved-${{ github.sha }}
          path: /tmp/c10-render/
          retention-days: 7
          if-no-files-found: warn

name: Lind cliff playable candidate archive
on:
  push:
    branches: [feature/lind-cliff-rock-art-study-20261118]
    paths:
      - .github/workflows/lind-cliff-playable-artifact.yml
      - assets/candidates/lind/windwaiting-cliff-playable/**
      - dev/windwaiting-cliff/**
      - dev/shared/vegetation.mjs
      - tests/field/windwaiting-cliff-*
      - tools/map_blender/lind/build_windwaiting_*.py
      - tools/map_blender/shared/vegetation_placement.py
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            assets/candidates/lind/windwaiting-cliff-playable
            dev/windwaiting-cliff
            dev/shared
            tests/field
            tools/map_blender/lind
            tools/map_blender/shared
      - name: Verify protected baseline
        run: |
          manifest=assets/candidates/lind/windwaiting-cliff-playable/SHA256SUMS
          python3 -c 'import sys; skip={"dev/windwaiting-cliff/"+n+".mjs" for n in ("play","sunset","surface")}; print("".join(line for line in open(sys.argv[1]) if line.split(maxsplit=1)[-1].strip() not in skip),end="")' "$manifest" > /tmp/protected-sha
          sha256sum -c /tmp/protected-sha
          node tests/field/windwaiting-cliff-nav.test.mjs
          node tests/field/windwaiting-cliff-eco.test.mjs
      - name: Reuse verified photo material artifact
        uses: actions/download-artifact@v4
        with:
          name: lind-photo-material-3330d3bcdfc05df9801acaebc17c8abd624f4391
          run-id: 44735960468
          github-token: ${{ github.token }}
          path: assets/candidates/lind/windwaiting-cliff-playable/photo-pbr
      - name: Verify and archive candidate hashes
        run: |
          root=assets/candidates/lind/windwaiting-cliff-playable
          (cd "$root/photo-pbr" && sha256sum -c SHA256SUMS)
          for file in play sunset surface; do node --check "dev/windwaiting-cliff/$file.mjs"; done
          cp "$root/SHA256SUMS" "$root/SHA256SUMS.baseline"
          cp /tmp/protected-sha "$root/SHA256SUMS"
          sha256sum dev/windwaiting-cliff/{play,sunset,surface}.mjs "$root/SHA256SUMS.baseline" >> "$root/SHA256SUMS"
          find "$root/photo-pbr" -type f -print0 | sort -z | xargs -0 sha256sum >> "$root/SHA256SUMS"
          sha256sum -c "$root/SHA256SUMS"
      - name: Render fixed-camera WebGL comparison
        run: |
          python3 -m venv /tmp/photo-qa
          /tmp/photo-qa/bin/pip install playwright==1.51.0
          /tmp/photo-qa/bin/python -m playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/photo-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          /tmp/photo-qa/bin/python tests/field/windwaiting-cliff-photo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-comparison-${{ github.sha }}
          path: photo-comparison/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windwaiting-cliff-playable-${{ github.sha }}
          path: |
            assets/candidates/lind/windwaiting-cliff-playable/
            dev/windwaiting-cliff/
            dev/shared/vegetation.mjs
            tests/field/windwaiting-cliff-*
            tools/map_blender/lind/build_windwaiting_*.py
            tools/map_blender/shared/vegetation_placement.py
          if-no-files-found: error
          retention-days: 14

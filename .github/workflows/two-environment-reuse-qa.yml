name: Environment reuse qualification
on:
  push:
    branches: [infra/environment-reuse-manager-20261124]
    paths:
      - .github/workflows/two-environment-reuse-qa.yml
      - tools/production_qa/environment_reuse/**
permissions:
  contents: read
  actions: read
concurrency:
  group: two-environment-reuse-linux-x64-blender-530
  cancel-in-progress: false
jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    outputs:
      key: ${{ steps.identity.outputs.key }}
      manifest: ${{ steps.build.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify free hosted runner and cache headroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = celticmusic-nagoya/the-windbound-oath
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          usage=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          [[ "$usage" =~ ^[0-9]+$ ]]
          test "$((usage + 2 * 1024 * 1024 * 1024))" -le 10737418240
      - id: identity
        run: echo "key=$(python tools/production_qa/environment_reuse/manager.py key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: lookup
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ steps.identity.outputs.key }}
          lookup-only: true
      - id: build
        name: Rebuild at two different paths and verify identical trees
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" != true || { echo "Exact key exists; use its original proof."; exit 1; }
          manager=tools/production_qa/environment_reuse/manager.py
          python "$manager" cold --root "$RUNNER_TEMP/two-env-cache" --report "$RUNNER_TEMP/cold.json"
          python "$manager" cold --root "$RUNNER_TEMP/two-env-reproducibility-independent-path" --report "$RUNNER_TEMP/rebuild.json"
          cmp "$RUNNER_TEMP/two-env-cache/manifest.json" "$RUNNER_TEMP/two-env-reproducibility-independent-path/manifest.json"
          echo "manifest=$(jq -er .manifest_sha256 "$RUNNER_TEMP/cold.json")" >> "$GITHUB_OUTPUT"
          jq -cs . "$RUNNER_TEMP/cold.json" "$RUNNER_TEMP/rebuild.json"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-reuse-reproducibility
          path: |
            ${{ runner.temp }}/cold.json
            ${{ runner.temp }}/rebuild.json
          if-no-files-found: warn
  warm:
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact runner identity
        env:
          EXPECTED_KEY: ${{ needs.cold.outputs.key }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(python tools/production_qa/environment_reuse/manager.py key)" = "$EXPECTED_KEY"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ needs.cold.outputs.key }}
      - name: Verify warm cache before execution
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          EXPECTED_MANIFEST: ${{ needs.cold.outputs.manifest }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          python tools/production_qa/environment_reuse/manager.py warm --root "$RUNNER_TEMP/two-env-cache" --report "$RUNNER_TEMP/warm.json" --expected "$EXPECTED_MANIFEST"
          jq -e '.installer_calls == 0 and .native_reopen' "$RUNNER_TEMP/warm.json"
      - uses: actions/upload-artifact@v4
        with:
          name: environment-reuse-warm-v2
          path: ${{ runner.temp }}/warm.json
          if-no-files-found: error

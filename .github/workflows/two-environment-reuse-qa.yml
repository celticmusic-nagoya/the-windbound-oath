name: Environment reuse qualification
on:
  push:
    branches: [infra/environment-reuse-manager-20261124]
    paths:
      - .github/workflows/two-environment-reuse-qa.yml
      - tools/production_qa/environment_reuse/**
permissions:
  contents: read
  actions: read
concurrency:
  group: two-environment-reuse-linux-x64-blender-530
  cancel-in-progress: false
jobs:
  verify-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify exact runner image and trusted proof
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = celticmusic-nagoya/the-windbound-oath
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          key=$(python tools/production_qa/environment_reuse/manager.py key)
          role=$(cat tools/production_qa/environment_reuse/publisher-role.txt)
          case "$role" in first|second) ;; *) exit 2;; esac
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "key=$key-p493-blender-race-v1" >> "$GITHUB_OUTPUT"
          PYTHONPATH=tools/production_qa/environment_reuse python - "$key" <<'PYTHON' >> "$GITHUB_OUTPUT"
          import sys
          from ensure import trusted_proof
          if trusted_proof(sys.argv[1]) is not None:
              print("eligible=true")
          else:
              raise SystemExit("runner image is outside qualified exact keys")
          PYTHON
      - uses: actions/cache/restore@v4
        if: steps.identity.outputs.eligible == 'true'
        id: restore
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ steps.identity.outputs.key }}
      - name: Verify reused or isolated Blender and record actual outcome
        env:
          ROLE: ${{ steps.identity.outputs.role }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$ROLE" == first ]]; then test "$CACHE_HIT" != true
          else test "$CACHE_HIT" = true; fi
          flags=()
          readonly=false
          cache="$RUNNER_TEMP/two-env-cache"
          if [[ "$CACHE_HIT" == true ]]; then
            test "$(id -u)" != 0
            test -d "$cache/app" && test ! -L "$cache" && test ! -L "$cache/app"
            sudo mount --bind "$cache/app" "$cache/app"
            trap 'sudo umount "$cache/app"' EXIT
            sudo mount -o remount,bind,ro "$cache/app"
            options=$(findmnt -n -o OPTIONS --mountpoint "$cache/app")
            grep -Eq '(^|,)ro(,|$)' <<< "$options"
            test ! -w "$cache/app/blender"
            readonly=true
            printf 'Cached application mount: %s, effective UID: %s\n' "$options" "$(id -u)"
            flags=(--cache-hit)
          fi
          python tools/production_qa/environment_reuse/ensure.py --cache "$RUNNER_TEMP/two-env-cache" --fallback "$RUNNER_TEMP/two-env-fallback" --report "$RUNNER_TEMP/reuse.json" "${flags[@]}"
          jq --argjson readonly "$readonly" --argjson uid "$(id -u)"             '. + {read_only_cache_mount: $readonly, execution_uid: $uid}'             "$RUNNER_TEMP/reuse.json" > "$RUNNER_TEMP/reuse-record.json"
          mv "$RUNNER_TEMP/reuse-record.json" "$RUNNER_TEMP/reuse.json"
          if [[ "$ROLE" == second ]]; then
            jq -e '.cache_state=="HIT" and .installer_calls==0 and .trusted_manifest_match' "$RUNNER_TEMP/reuse.json"
            sha256sum "$RUNNER_TEMP/warm.blend" > "$RUNNER_TEMP/fixture-sha256.txt"
            python tools/production_qa/environment_reuse/manager.py cold --root "$RUNNER_TEMP/official-xz-benchmark" --report "$RUNNER_TEMP/cold.json"
            sha256sum "$RUNNER_TEMP/cold.blend" >> "$RUNNER_TEMP/fixture-sha256.txt"
            jq -es '.[0].manifest_sha256==.[1].manifest_sha256 and all(.[];.native_reopen)' "$RUNNER_TEMP/reuse.json" "$RUNNER_TEMP/cold.json"
          else
            jq -e '.cache_state=="MISS" and .installer_calls==1 and .trusted_manifest_match' "$RUNNER_TEMP/reuse.json"
            sha256sum "$RUNNER_TEMP/cold.blend" > "$RUNNER_TEMP/fixture-sha256.txt"
          fi
          jq -e '.native_reopen and (if .cache_state == "HIT" then .installer_calls == 0 and .read_only_cache_mount and .execution_uid > 0 else .installer_calls == 1 end)' "$RUNNER_TEMP/reuse.json"
      - name: Check headroom just before a permitted cache save
        id: headroom
        if: steps.identity.outputs.eligible == 'true' && steps.restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -e "$RUNNER_TEMP/two-env-cache" && ! -L "$RUNNER_TEMP/two-env-cache" ]] &&
             jq -e '.cache_state == "MISS" and .trusted_manifest_match and .native_reopen' "$RUNNER_TEMP/reuse.json" &&
             usage=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes) &&
             [[ "$usage" =~ ^[0-9]{1,11}$ ]] &&
             (( usage + 2 * 1024**3 + 256 * 1024**2 <= 10 * 1024**3 )); then
            cp -a -- "$RUNNER_TEMP/two-env-fallback" "$RUNNER_TEMP/two-env-cache"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Eligible for save, existing cache bytes: $usage"
          else
            echo "Shared save skipped: no matching proof or insufficient cache headroom"
          fi
      - uses: actions/cache/save@v4
        if: steps.headroom.outputs.allowed == 'true'
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: environment-blender-race-${{ steps.identity.outputs.role }}
          path: |
            ${{ runner.temp }}/reuse.json
            ${{ runner.temp }}/cold.json
            ${{ runner.temp }}/fixture-sha256.txt
          if-no-files-found: error

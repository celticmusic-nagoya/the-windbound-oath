name: Environment reuse qualification
on:
  push:
    branches: [infra/environment-reuse-manager-20261124]
    paths:
      - .github/workflows/two-environment-reuse-qa.yml
      - tools/production_qa/environment_reuse/**
permissions:
  contents: read
  actions: read
concurrency:
  group: two-environment-reuse-linux-x64-blender-530
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify free hosted runner and cache headroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = celticmusic-nagoya/the-windbound-oath
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          usage=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          [[ "$usage" =~ ^[0-9]+$ ]]
          test "$usage" -le 10737418240
      - id: identity
        run: |
          set -euo pipefail
          python tools/production_qa/environment_reuse/manager.py key
          key=$(jq -er .key tools/production_qa/environment_reuse/blender-530-proof.json)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ steps.identity.outputs.key }}
      - name: Compare trusted cache to fresh official installation
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          PYTHONPATH: tools/production_qa/environment_reuse
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          python tools/production_qa/environment_reuse/manager.py cold --root "$RUNNER_TEMP/two-env-diagnosis" --report "$RUNNER_TEMP/rebuild.json"
          python - "$RUNNER_TEMP" <<'PYTHON'
          import json, sys
          from pathlib import Path
          from manager import verify
          from ensure import PROOF, PROOF_SHA256, sha
          root = Path(sys.argv[1])
          if sha(PROOF) != PROOF_SHA256:
              raise RuntimeError("untrusted baseline")
          proof = json.loads(PROOF.read_text())
          cache = root / "two-env-cache"
          fresh = root / "two-env-diagnosis"
          verify(cache, proof["provenance"], proof["manifest_sha256"], 2**31)
          before = json.loads((cache / "manifest.json").read_text())
          after = json.loads((fresh / "manifest.json").read_text())
          rebuild = json.loads((root / "rebuild.json").read_text())
          verify(fresh, rebuild["provenance"], rebuild["manifest_sha256"], 2**31)
          a, b = before["entries"], after["entries"]
          changes = {key: {"before": a.get(key), "after": b.get(key)}
                     for key in sorted(a.keys() | b.keys()) if a.get(key) != b.get(key)}
          result = dict(baseline_manifest_sha256=proof["manifest_sha256"],
                        rebuild_manifest_sha256=rebuild["manifest_sha256"],
                        same_provenance=before["provenance"] == after["provenance"],
                        baseline_bytes=before["bytes"], rebuild_bytes=after["bytes"],
                        changes=changes)
          (root / "manifest-diff.json").write_text(json.dumps(result, indent=2) + "\n")
          print(f"{len(changes)} changed paths")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: environment-reuse-manifest-diff
          path: ${{ runner.temp }}/manifest-diff.json
          if-no-files-found: error

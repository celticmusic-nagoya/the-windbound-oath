name: Environment reuse qualification
on:
  push:
    branches: [infra/environment-reuse-manager-20261124]
    paths:
      - .github/workflows/two-environment-reuse-qa.yml
      - tools/production_qa/environment_reuse/**
permissions:
  contents: read
  actions: read
concurrency:
  group: two-environment-reuse-linux-x64-blender-530
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        scenario: [corrupt, miss]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify free hosted runner and cache headroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = celticmusic-nagoya/the-windbound-oath
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          usage=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          [[ "$usage" =~ ^[0-9]+$ ]]
          test "$usage" -le 10737418240
      - id: identity
        run: |
          set -euo pipefail
          python tools/production_qa/environment_reuse/manager.py key
          key=$(jq -er .key tools/production_qa/environment_reuse/blender-530-proof.json)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: matrix.scenario != 'miss'
        id: restore
        with:
          path: ${{ runner.temp }}/two-env-cache
          key: ${{ steps.identity.outputs.key }}
      - name: Verify cache selection and isolated rebuild
        id: environment
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/two-env-cache"
          fallback="$RUNNER_TEMP/two-env-fallback"
          report="$RUNNER_TEMP/reuse.json"
          flags=()
          if [[ "$SCENARIO" != miss ]]; then
            test "$CACHE_HIT" = true
            flags=(--cache-hit)
          fi
          if [[ "$SCENARIO" == corrupt ]]; then
            test -d "$cache" && test ! -L "$cache"
            test -f "$cache/manifest.json" && test ! -L "$cache/manifest.json"
            rm -- "$cache/manifest.json"
            printf 'invalid manifest\n' > "$cache/manifest.json"
            PYTHONPATH=tools/production_qa/environment_reuse python - "$cache" <<'PYTHON'
          import json, sys
          from pathlib import Path
          from manager import verify
          from ensure import PROOF
          proof = json.loads(PROOF.read_text())
          try:
              verify(Path(sys.argv[1]), proof["provenance"], proof["manifest_sha256"], 2**31)
          except ValueError as exc:
              if str(exc) != "untrusted manifest SHA":
                  raise
              print("Injected manifest corruption refused before execution")
          else:
              raise SystemExit("Injected manifest was accepted")
          PYTHON
          fi
          python tools/production_qa/environment_reuse/ensure.py --cache "$cache" --fallback "$fallback" --report "$report" "${flags[@]}"
          case "$SCENARIO" in
            corrupt) jq -e '.cache_state == "REJECTED" and .installer_calls == 1 and .native_reopen' "$report"
                     test "$(cat "$cache/manifest.json")" = "invalid manifest" ;;
            miss) jq -e '.cache_state == "MISS" and .installer_calls == 1 and .native_reopen' "$report"
                  test ! -e "$cache" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-reuse-${{ matrix.scenario }}
          path: ${{ runner.temp }}/reuse.json
          if-no-files-found: warn

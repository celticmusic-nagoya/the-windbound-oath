name: Shared native session qualification
on:
  push:
    branches: [infra/shared-native-session-20261122]
    paths: ['.github/workflows/two-shared-native-session-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: two-shared-native-session-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Qualify dynamic controller with remote durable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .visibility)" = public
          test "$RUNNER_ENVIRONMENT" = github-hosted
          gh auth setup-git
          python3 - <<'PY'
          import os,sys,tempfile,json,hashlib,subprocess,base64
          from pathlib import Path
          sys.path.insert(0,'tools/production_qa')
          from shared_session_controller import run
          from shared_asset_lease import assert_owned
          from session_plan import sha
          repo=os.environ['GITHUB_REPOSITORY']; head=os.environ['GITHUB_SHA']
          asset='QA-DAG-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          stages=[dict(id=k,deps=d,qualified=True,seconds=60,fingerprint=hashlib.sha256((head+k).encode()).hexdigest()) for k,d in [('geometry',[]),('material',['geometry']),('qa',['material'])]]
          with tempfile.TemporaryDirectory() as d:
              root=Path(d);done={};calls=[]
              def execute(stage,token):
                  assert_owned('origin',asset,token)
                  p=root/(stage['id']+'.json')
                  p.write_text(json.dumps({'id':stage['id'],'deps':stage['deps']}))
                  assert json.loads(p.read_text())['id']==stage['id']
                  calls.append(stage['id'])
                  return dict(path=p.name,reopened=True,sha256=sha(p),fingerprint=stage['fingerprint'])
              def persist(state,token):
                  assert_owned('origin',asset,token)
                  payload=json.dumps({'state':state,'files':{k:base64.b64encode((root/v['path']).read_bytes()).decode() for k,v in state.items()}},sort_keys=True)
                  obj=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','-f','encoding=utf-8','-f','content='+payload],text=True))['sha']
                  actual=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{obj}'],text=True))
                  assert base64.b64decode(actual['content']).decode()==payload
                  # Pin checkpoint in a Git commit.
                  # A Git blob alone is not durable: pin checkpoint in a tree and commit.
                  tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input','-'],input=json.dumps({'tree':[{'path':'checkpoint.json','mode':'100644','type':'blob','sha':obj}]}),text=True))['sha']
                  commit=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/commits','-f','message=QA synthetic checkpoint '+str(__import__('uuid').uuid4()),'-f','tree='+tree],text=True))['sha']
                  ref='refs/tags/two-session-qa/'+asset+'/'+commit
                  subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/refs','-f','ref='+ref,'-f','sha='+commit],text=True)
                  assert json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/ref/'+ref[5:]],text=True))['object']['sha']==commit
                  return True
              assert run('origin',asset,head,root,stages,done,execute,persist)==['geometry','material','qa']
              assert run('origin',asset,head,root,stages,done,execute,persist)==[]
              assert calls==['geometry','material','qa']
              print('DYNAMIC_DAG_REMOTE_CHECKPOINT_PASS',calls)
          PY
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=two/shared-session-qa -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

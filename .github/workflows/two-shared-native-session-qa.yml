name: Shared native session qualification
on:
  push:
    branches: [infra/shared-native-session-20261122]
    paths: ['.github/workflows/two-shared-native-session-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  statuses: write
concurrency:
  group: two-shared-native-session-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Contract and bounded operation regression
        run: |
          PYTHONPATH=tools/production_qa python3 - <<'PY'
          import sys,time
          from shared_session_contract import fingerprint,FIELDS
          from bounded_operation import run_operation
          h={k:{"fixture":"a"*64} for k in FIELDS}
          a=fingerprint("MORWEN","face",h)
          assert a==fingerprint("MORWEN","face",dict(reversed(list(h.items()))))
          for key in FIELDS:
              changed={**h,key:{"fixture":"b"*64}}
              assert a!=fingerprint("MORWEN","face",changed)
          try:
              fingerprint("unknown","face",h)
          except ValueError: pass
          else: raise AssertionError("unknown asset accepted")
          run_operation([sys.executable,"-c","pass"],time.monotonic()+3,grace=1)
          started=time.monotonic()
          try:
              run_operation([sys.executable,"-c","import time; time.sleep(60)"],started+3,grace=1)
          except TimeoutError: raise
          except __import__("subprocess").TimeoutExpired: pass
          else: raise AssertionError("timeout not enforced")
          assert time.monotonic()-started<5
          print("CONTRACT_AND_BOUNDED_OPERATION_PASS")
          PY
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=two/shared-session-qa -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

name: Shared native session qualification
on:
  push:
    branches: [infra/shared-native-session-20261122]
    paths: ['.github/workflows/two-shared-native-session-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  statuses: write
concurrency:
  group: two-shared-native-session-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore actual native checkpoints on fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14750063737/zip >/tmp/native.zip
          echo '75b570982b7c4aac31808cbac54736bf1c0b79c9bb2c8d84c1b0cc1a29e0c8c3  /tmp/native.zip' | sha256sum -c -
          mkdir /tmp/evidence
          unzip -q /tmp/native.zip -d /tmp/evidence
          cd /tmp/evidence
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libgbm1
          export LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless
          bash tools/production_qa/install_blender_530.sh /tmp/two-blender53
          /tmp/two-blender53/blender -b --disable-autoexec /tmp/evidence/material.blend --python-exit-code 1 --python-expr 'import bpy; assert bpy.context.scene.cycles.samples==32; assert len(bpy.data.objects)>0'
          python3 - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'tools/production_qa')
          from session_plan import ready
          root=Path('/tmp/evidence')
          done=json.loads((root/'ledger.json').read_text())
          stages=[dict(id=k,deps=d,qualified=True,seconds=900,fingerprint=done[k]['fingerprint']) for k,d in [('lighting',[]),('material',['lighting'])]]
          assert ready(stages,done,root,19800,1800)==[]
          print('CROSS_RUN_NATIVE_RESTORE_PASS')
          PY
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=two/shared-session-qa -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

name: Shared native session qualification
on:
  push:
    branches: [infra/shared-native-session-20261122]
    paths: ['.github/workflows/two-shared-native-session-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: two-shared-native-session-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Qualify remote CAS release and ABA rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .visibility)" = public
          test "$RUNNER_ENVIRONMENT" = github-hosted
          gh auth setup-git
          python3 - <<'PY'
          import sys,os,subprocess,concurrent.futures
          sys.path.insert(0,'tools/production_qa')
          from shared_asset_lease import acquire,release,assert_owned
          from shared_asset_reservation import ref_for
          a='QA-CAS-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          h=os.environ['GITHUB_SHA']
          def claim(_):
              try:return acquire('origin',a,h)
              except subprocess.CalledProcessError:return None
          with concurrent.futures.ThreadPoolExecutor(2) as p: outcomes=list(p.map(claim,range(2)))
          assert sum(x is not None for x in outcomes)==1,outcomes
          old=next(x for x in outcomes if x)
          release('origin',a,old)
          new=acquire('origin',a,h)
          assert old!=new
          try:release('origin',a,old)
          except RuntimeError:pass
          else:raise AssertionError('stale release accepted')
          # Bypass preliminary ownership check to test server-side CAS itself.
          ref=ref_for(a)
          p=subprocess.run(['git','push',f'--force-with-lease={ref}:{old}','origin',':'+ref],capture_output=True)
          assert p.returncode!=0,'stale CAS accepted'
          assert_owned('origin',a,new)
          release('origin',a,new)
          assert not subprocess.check_output(['git','ls-remote','--refs','origin',ref],text=True).strip()
          print('REMOTE_CAS_RELEASE_ABA_PASS',old,new)
          PY
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=two/shared-session-qa -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

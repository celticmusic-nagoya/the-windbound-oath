name: LIND Photo PBR Intake QA
on:
  pull_request:
    paths:
      - 'tools/map_blender/lind/validate_photo_pbr_intake.py'
      - 'tests/test_lind_photo_pbr_intake.py'
      - '.github/workflows/lind-photo-pbr-intake-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run photo PBR intake negative controls
        run: python3 -m unittest discover -s tests -p 'test_lind_photo_pbr_intake.py' -v

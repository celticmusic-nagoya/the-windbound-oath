name: LIND Macro Cliff Support Blender Geometry QA
on:
  workflow_dispatch:
concurrency:
  group: lind-macro-support-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  macro-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p out/lind-macro-support
          {
            date -u '+RUN_START_UTC=%Y-%m-%dT%H:%M:%SZ'
            uname -smr
            python3 --version
            free -m
            df -h . /tmp
          } | tee out/lind-macro-support/runner-diagnostics.log
      - name: Preflight Blender Python syntax
        run: python3 -m py_compile tools/map_blender/lind/build_cliff_macro_support.py
      - name: Fetch shared Blender installer from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: shared-main
          persist-credentials: false
      - name: Install SHA-verified Blender 5.2.4
        timeout-minutes: 12
        run: bash shared-main/tools/production_qa/install_blender_524.sh /tmp/two-blender/app
      - name: Validate candidate semantic contract
        run: python3 tools/map_blender/lind/validate_cliff_macro_contract.py docs/production/lind-cliff-macro-support.contract.v1.json
      - name: Check Blender Python startup before geometry
        timeout-minutes: 2
        run: |
          mkdir -p out/lind-macro-support
          set -o pipefail
          PYTHONUNBUFFERED=1 /tmp/two-blender/app/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/map_blender/lind/build_cliff_macro_support.py -- --out out/lind-macro-support --probe-only 2>&1 | tee out/lind-macro-support/blender-probe.log
      - name: Generate actual closed macro support and render
        run: |
          set -euo pipefail
          mkdir -p out/lind-macro-support
          memory_events="/sys/fs/cgroup$(awk -F: '$1 == 0 {print $3}' /proc/self/cgroup)/memory.events"
          diagnostics=out/lind-macro-support/runner-diagnostics.log
          if [[ -r "$memory_events" ]]; then
            { echo 'CGROUP_MEMORY_EVENTS_BEFORE'; cat "$memory_events"; } >> "$diagnostics"
          fi
          set +e
          PYTHONUNBUFFERED=1 timeout --verbose --kill-after=15s 480s /tmp/two-blender/app/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/map_blender/lind/build_cliff_macro_support.py -- --out out/lind-macro-support 2>&1 | tee out/lind-macro-support/blender.log
          result=("${PIPESTATUS[@]}")
          set -e
          printf 'BLENDER_TIMEOUT_WRAPPER_EXIT=%s\nLOG_TEE_EXIT=%s\n' "${result[@]}" | tee -a "$diagnostics"
          if [[ -r "$memory_events" ]]; then
            { echo 'CGROUP_MEMORY_EVENTS_AFTER'; cat "$memory_events"; } >> "$diagnostics"
          fi
          if (( result[0] != 0 )); then exit "${result[0]}"; fi
          exit "${result[1]}"
      - name: Verify candidate topology and hashes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('out/lind-macro-support')
          m=json.loads((d/'macro_support_metrics.json').read_text())
          assert m['units']=='NORMALIZED_NON_METRIC' and m['approved_world_scale'] is None
          assert m['source_scan_embedded'] is False and m['production_ready'] is False
          assert m['boundary_edges']==0 and m['nonmanifold_edges']==0
          assert m['closed_volume']>0 and m['G2']=='NOT_RUN'
          assert m['render_engine']=='BLENDER_WORKBENCH'
          assert set(m['outputs']) == {'macro_support_candidate.blend', 'macro_support_clay.png'}
          for n,h in m['outputs'].items():
           p=d/n
           assert p.is_file() and p.stat().st_size > 0
           assert hashlib.sha256(p.read_bytes()).hexdigest()==h
           if n.endswith('.png'):assert p.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          print('MACRO_TOPOLOGY_QA_PASS')
          PY
      - name: Reopen generated Blender file
        timeout-minutes: 2
        run: |
          /tmp/two-blender/app/blender --background --factory-startup --disable-autoexec out/lind-macro-support/macro_support_candidate.blend --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects.get('CLIFF_MACRO_SUPPORT_CANDIDATE_NOT_CANON') is not None; print('BLEND_REOPEN_PASS')"
      - name: Upload source and render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lind-macro-support-blender-candidate
          path: out/lind-macro-support/
          retention-days: 14

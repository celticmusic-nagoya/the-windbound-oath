name: LIND Macro Cliff Support Blender Geometry QA
on:
  workflow_dispatch:
  push:
    branches:
      - feature/lind-cliff-rock-art-study-20261118
    paths:
      - .github/workflows/lind-cliff-macro-support.yml
permissions:
  contents: read
jobs:
  macro-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Blender Python syntax
        run: python3 -m py_compile tools/map_blender/lind/build_cliff_macro_support.py
      - name: Fetch shared Blender installer from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: shared-main
          persist-credentials: false
      - name: Install SHA-verified Blender 5.2.4
        timeout-minutes: 12
        run: bash shared-main/tools/production_qa/install_blender_524.sh /tmp/two-blender/app
      - name: Validate candidate semantic contract
        run: python3 tools/map_blender/lind/validate_cliff_macro_contract.py docs/production/lind-cliff-macro-support.contract.v1.json
      - name: Generate actual closed macro support and render
        run: |
          set -euo pipefail
          mkdir -p out/lind-macro-support
          date -u '+RUN_START_UTC=%Y-%m-%dT%H:%M:%SZ' | tee out/lind-macro-support/runner-diagnostics.log
          free -m | tee -a out/lind-macro-support/runner-diagnostics.log
          df -h . /tmp | tee -a out/lind-macro-support/runner-diagnostics.log
          PYTHONUNBUFFERED=1 /tmp/two-blender/app/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/map_blender/lind/build_cliff_macro_support.py -- --out out/lind-macro-support --geometry-only 2>&1 | tee out/lind-macro-support/blender.log
      - name: Verify candidate topology and hashes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('out/lind-macro-support')
          m=json.loads((d/'macro_support_metrics.json').read_text())
          assert m['units']=='NORMALIZED_NON_METRIC' and m['approved_world_scale'] is None
          assert m['source_scan_embedded'] is False and m['production_ready'] is False
          assert m['boundary_edges']==0 and m['nonmanifold_edges']==0
          assert m['closed_volume']>0 and m['G2']=='NOT_RUN'
          assert m['render_engine']=='BLENDER_WORKBENCH'
          for n,h in m['outputs'].items():
           p=d/n
           assert hashlib.sha256(p.read_bytes()).hexdigest()==h
           if n.endswith('.png'):assert p.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          print('MACRO_TOPOLOGY_QA_PASS')
          PY
      - name: Reopen generated Blender file
        run: |
          /tmp/two-blender/app/blender --background --factory-startup --disable-autoexec out/lind-macro-support/macro_support_candidate.blend --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects.get('CLIFF_MACRO_SUPPORT_CANDIDATE_NOT_CANON') is not None; print('BLEND_REOPEN_PASS')"
      - name: Upload source and render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lind-macro-support-blender-candidate
          path: out/lind-macro-support/
          retention-days: 14

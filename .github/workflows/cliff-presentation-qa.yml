name: Cliff CG presentation QA
on:
  pull_request:
    paths:
      - 'js/field/cliff-presentation.js'
      - 'js/field/field-scene.js'
      - 'tests/moss/cliff_presentation.test.js'
      - '.github/workflows/cliff-presentation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/field/cliff-presentation.js
          node --check js/field/field-scene.js
      - name: CG presentation mock regression
        run: node tests/moss/cliff_presentation.test.js

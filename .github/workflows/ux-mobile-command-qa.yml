name: UX Mobile Command QA
on:
  pull_request:
    paths:
      - 'tools/qa/measure_command_mobile.py'
      - 'tools/qa/browser_support.py'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/ux-mobile-command-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Measure mobile battle command geometry
        run: python tools/qa/measure_command_mobile.py
      - name: Upload measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-mobile-command-geometry
          path: docs/qa/command-initial-open-mobile-20261013/
          if-no-files-found: warn

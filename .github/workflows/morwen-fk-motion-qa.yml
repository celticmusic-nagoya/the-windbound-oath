name: Morwen FK Motion Rig QA
on:
  push:
    branches:
      - feature/morwen-production-pipeline-01
    paths:
      - 'tools/blender/morwen_production/validate_rig_motion.py'
      - 'tools/blender/morwen_production/build_master_rig.py'
      - '.github/workflows/morwen-fk-motion-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libopengl0
      - name: Validate Python syntax
        run: python3 -m py_compile tools/blender/morwen_production/validate_rig_motion.py
      - name: Verify FK rig and cycle
        run: blender -b -noaudio -t 2 --python tools/blender/morwen_production/validate_rig_motion.py
      - name: Verify artifact metadata
        run: |
          python3 -m py_compile tools/blender/morwen_production/verify_motion_artifact.py
          python3 tools/blender/morwen_production/verify_motion_artifact.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morwen-fk-motion-template-qa
          path: render_output/morwen_motion_qa/
          retention-days: 30
          if-no-files-found: warn

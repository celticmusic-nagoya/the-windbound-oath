name: MORWEN-3V import approved images
on:
  push:
    branches:
      - feature/morwen-official-3v-registration
    paths:
      - .github/workflows/morwen-3v-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/feature/morwen-official-3v-registration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch approved Google Drive ZIP
        run: |
          python -m pip install --quiet gdown
          gdown --id 1JenHyeJdNHWF_j2_MOiHUeDZxQDTLp0w -O /tmp/morwen-3v.zip
      - name: Extract and verify original PNGs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, zipfile, pathlib
          archive='/tmp/morwen-3v.zip'
          root=pathlib.Path('assets/official/characters/morwen/turnaround')
          expected={
              'morwen_right_official.png':'7eeff76ac07f631c14cb536e0e08346cfe815247a88520fb5a68cf0e877e5548',
              'morwen_left_official.png':'d858c428c64007596302057453f414dd43c580bc1546b9578c3d1dfb0af17591',
              'morwen_back_official.png':'9cf2f27448303aa60c603f0f32a7baada234fec8cae5108bf8103a9ae7547e69',
          }
          with zipfile.ZipFile(archive) as z:
              for name,sha in expected.items():
                  raw=z.read('game/assets/official/characters/morwen/turnaround/'+name)
                  actual=hashlib.sha256(raw).hexdigest()
                  if actual!=sha: raise RuntimeError(f'SHA-256 mismatch: {name}: {actual}')
                  dest=root/name
                  if dest.exists() and dest.read_bytes()!=raw:
                      raise RuntimeError(f'Refusing to overwrite different existing asset: {dest}')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(raw)
                  print(f'PASS {dest} {sha}')
          PY
      - name: Commit verified images to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/official/characters/morwen/turnaround/
          if ! git diff --cached --quiet; then
            git commit -m "assets: import SHA-verified Morwen official three views"
            git push
          fi

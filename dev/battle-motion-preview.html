<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../"><title>DEV · Battle Motion PLAYER QA</title>
<link rel="icon" type="image/png" href="img/field/lind/props/lind_sign.png">
<link rel="stylesheet" href="css/battle-idle-motion.css">
<style>
body{margin:0;background:#14231e;color:#e3dcc1;font:16px system-ui}header{padding:12px}button,select{font:inherit;color:inherit;background:#26372d;border:1px solid #b19b62;padding:8px;margin:4px}
.stage{height:65vh;min-height:250px;position:relative;background:radial-gradient(ellipse,#344733,#14251e);overflow:hidden}
#bAidan2{position:absolute;width:180px;height:230px;left:8%;bottom:5%}.bat{position:absolute;width:210px;height:170px;right:7%;bottom:40%}.bat:nth-of-type(2){right:25%;bottom:15%}.bat:nth-of-type(3){right:3%;bottom:3%}
.sprite{position:relative;width:100%;height:100%}#bAidan2>img,.sprite>img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 10px #0008)}.bat .sprite>img,.bat canvas{transform:scaleX(-1)}.label{position:absolute;top:-24px;font-size:12px}footer{padding:12px;font-size:14px}
@media(max-width:600px){#bAidan2{width:110px;height:160px;left:3%}.bat{width:145px;height:135px;right:2%;bottom:55%}.bat:nth-of-type(2){right:3%;bottom:30%}.bat:nth-of-type(3){right:2%;bottom:2%}}
@media(max-height:450px){.stage{height:60vh;min-height:180px}#bAidan2{width:110px;height:160px}.bat{width:140px;height:110px}.label{top:-16px}}
</style></head><body class="normalBattleMode">
<header>DEV · Idleのみの視覚比較（戦闘AI・ダメージなし）<br>
<label>Forest Bat <select id="count"><option>1</option><option>2</option><option>3</option></select></label>
<button id="pause">一時停止／再開</button><button id="reset">IDLEへ戻る</button></header>
<main class="stage"><div id="bAidan2"><span class="label">Aidan · GROUNDED</span><img alt="Aidan"></div><div id="bats"></div></main>
<footer>胴体位置・羽ばたき・呼吸の違いを確認してください。通常の戦闘回帰確認はゲーム本体のDEV Event Jumpから行います。<a href="index.html">ゲーム本体へ</a></footer>
<script src="js/assets.js"></script><script src="js/battle-idle-motion.js"></script><script src="js/battle-motion.js"></script>
<script>
document.querySelector('#bAidan2 img').src=BATTLE_ASSETS.aidan.idle;
function setAll(state){BattleMotion.onState('#bAidan2 img','aidan',state);for(let i=0;i<Number(count.value);i++)BattleMotion.onState('#bat'+i+' img','forest_bat',state);}
function populate(){
 for(let i=0;i<3;i++)BattleIdleMotion.unregister('#bat'+i+' img');
 document.querySelector('#bats').replaceChildren();
 for(let i=0;i<Number(count.value);i++){
  const unit=document.createElement('div');unit.id='bat'+i;unit.className='bat';
  const label=document.createElement('span');label.className='label';label.textContent='Forest Bat '+(i+1)+' · FLYING';
  const sprite=document.createElement('div');sprite.className='sprite';const image=document.createElement('img');image.alt='Forest Bat';image.src=FOREST_BAT_IDLE_ASSETS.frames[0].path;sprite.append(image);unit.append(label,sprite);document.querySelector('#bats').append(unit);
  const selector='#bat'+i+' img';BattleIdleMotion.register({context:'normal',actor:'forest_bat',selector,assets:FOREST_BAT_IDLE_ASSETS});BattleMotion.begin(selector);BattleMotion.onState(selector,'forest_bat','idle');
 }
}
const count=document.querySelector('#count');count.addEventListener('change',populate);populate();BattleMotion.begin('#bAidan2 img');setAll('idle');
document.querySelector('#pause').onclick=()=>document.body.classList.toggle('battlePresentationBusy');
document.querySelector('#reset').onclick=()=>{document.body.classList.remove('battlePresentationBusy');setAll('attack');setAll('idle');};
</script></body></html>

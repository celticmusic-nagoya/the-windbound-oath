<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TalkPortrait preview</title>
<!-- Dev preview of the common conversation-portrait system (Phase 3). Uses the real modules and css/style.css; no game state is touched.
     Open via the local server: http://localhost:8765/dev/talk-portrait-preview.html -->
<link rel="stylesheet" href="../css/style.css?v=20261027tp1">
<style>
  html,body{margin:0;height:100%;background:#1d2a22;color:#eee;font:14px/1.5 system-ui,sans-serif}
  body{background:linear-gradient(#3a5440,#1d2a22)}
  #panel{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:500;background:#0008;padding:8px;border-radius:8px}
  #panel button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #bbab70;background:#14251f;color:#fff;cursor:pointer}
  #panel button[aria-pressed="true"]{background:#bbab70;color:#14251f}
  #status{position:fixed;left:8px;bottom:8px;font:12px ui-monospace,monospace;z-index:500;background:#0008;padding:4px 8px;border-radius:6px}
  #msg{position:fixed;left:4%;right:4%;bottom:4%;min-height:84px;background:#0c1712e6;border:1px solid #bbab70;border-radius:10px;padding:12px 16px;display:block}
</style></head><body class="dialogueOpen">
<div id="panel"></div>
<div id="msg"><div class="talkName">エイダン</div><div class="talkText" id="line">「プレビュー」</div></div>
<div id="status"></div>
<script src="../js/field/portrait-registry.js?v=20261027tp1"></script>
<script>PortraitRegistry.setRoot('../');   // this page lives in dev/; the game itself uses the registry paths as they are</script>
<script src="../js/field/portrait-blink.js?v=20261027tp1"></script>
<script src="../js/field/talk-portrait.js?v=20261027tp1"></script>
<script>
  const P=document.getElementById('panel'),R=window.PortraitRegistry;let face='normal',side=null;
  const btn=(t,f,group)=>{const b=document.createElement('button');b.textContent=t;b.dataset.g=group||'';b.onclick=()=>{f();if(group)P.querySelectorAll('[data-g="'+group+'"]').forEach(x=>x.setAttribute('aria-pressed',x===b));};P.append(b);return b;};
  const label={normal:'通常',smile:'微笑み',angry:'怒り',worried:'困り顔',sad:'伏し目',surprised:'驚き'};
  const show=()=>{document.getElementById('line').textContent='「'+label[face]+'」';TalkPortrait.show('aidan',face,undefined,side||undefined);};
  for(const f of R.get('aidan').faces)btn(label[f],()=>{face=f;show();},'face').setAttribute('aria-pressed',f==='normal');
  btn('左（既定）',()=>{side=null;show();},'side').setAttribute('aria-pressed','true'); btn('右',()=>{side='right';show();},'side');
  btn('今すぐ瞬き',()=>TalkPortrait.blinkNow()); btn('隠す',()=>TalkPortrait.hide()); btn('再表示',show);
  setInterval(()=>{const s=TalkPortrait.status;document.getElementById('status').textContent=`${s.char||'-'} / ${s.face||'-'} / side ${s.side||'-'} / eye ${s.eye} / timers ${s.blink?s.blink.timers:0} / reduced ${s.reduced}`;},100);
  show();
</script>
</body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LIND isolated WebGL2 capability benchmark</title>
<style>body{margin:0;background:#10141b;color:#f2f2f2;font:14px system-ui}header{padding:12px}canvas{display:block;width:100%;height:58vh;touch-action:none}pre{white-space:pre-wrap;padding:12px}button{padding:10px;margin:5px}</style></head>
<body><header><strong>THE WINDBOUND OATH — isolated WebGL2 diagnostic</strong><p>候補レンダラー比較の前段階。ゲーム本体・正式素材を読み込みません。</p>
<button id="run">30秒測定</button><button id="stop">停止</button><button id="copy">結果コピー</button></header>
<canvas id="view" aria-label="WebGL2 diagnostic scene"></canvas><pre id="report"></pre>
<script>
'use strict';
const canvas=document.getElementById('view'),out=document.getElementById('report');
let gl,program,buffer,vao,raf=0,start=0,last=0,frames=[],running=false,losses=0;
const state={schema:1,renderer:'native-webgl2-baseline',engine:'none',userAgent:navigator.userAgent,webgl2:false,losses:0,frames:0,elapsedMs:0,meanFrameMs:null,p95FrameMs:null,devicePixelRatio:devicePixelRatio,viewport:[innerWidth,innerHeight],notes:'Technical diagnostic only; no production art or Android PASS'};
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function init(){
 gl=canvas.getContext('webgl2',{antialias:false,powerPreference:'default',alpha:false});
 if(!gl){out.textContent='BLOCKED: WebGL2 unavailable';return false}
 state.webgl2=true;state.vendor=gl.getParameter(gl.VENDOR);state.rendererLabel=gl.getParameter(gl.RENDERER);
 state.maxTextureSize=gl.getParameter(gl.MAX_TEXTURE_SIZE);
 const v=shader(gl.VERTEX_SHADER,'#version 300 es\nin vec2 position;uniform float angle;void main(){float c=cos(angle),s=sin(angle);gl_Position=vec4(position.x*c-position.y*s,position.x*s+position.y*c,0.,1.);}');
 const f=shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision mediump float;out vec4 color;void main(){color=vec4(.2,.65,.8,1.);}');
 program=gl.createProgram();gl.attachShader(program,v);gl.attachShader(program,f);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 vao=gl.createVertexArray();gl.bindVertexArray(vao);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,.5,-.5,-.5,.5,-.5]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 return true;
}
function report(){const sorted=[...frames].sort((a,b)=>a-b);state.frames=frames.length;state.elapsedMs=last-start;state.meanFrameMs=frames.length?frames.reduce((a,b)=>a+b,0)/frames.length:null;state.p95FrameMs=sorted.length?sorted[Math.ceil(sorted.length*.95)-1]:null;state.losses=losses;out.textContent=JSON.stringify(state,null,2)}
function stop(){running=false;cancelAnimationFrame(raf);report()}
function tick(now){
 if(!running)return;
 if(!start){start=now;last=now}
 const dt=now-last;if(dt>0&&dt<1000)frames.push(dt);last=now;
 const ratio=Math.min(devicePixelRatio,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 gl.viewport(0,0,w,h);gl.clearColor(.03,.06,.1,1);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.useProgram(program);gl.bindVertexArray(vao);gl.uniform1f(gl.getUniformLocation(program,'angle'),now*.001);gl.drawArrays(gl.TRIANGLES,0,3);
 if(now-start>=30000){stop();return}raf=requestAnimationFrame(tick);
}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();losses++;stop()});
canvas.addEventListener('webglcontextrestored',()=>{gl=null;init();report()});
document.getElementById('run').onclick=()=>{stop();frames=[];start=0;last=0;try{if(!gl&&!init())return;running=true;raf=requestAnimationFrame(tick)}catch(e){out.textContent='FAIL: '+e.message}};
document.getElementById('stop').onclick=stop;
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(state,null,2)).catch(e=>out.textContent='Clipboard unavailable: '+e.message);
out.textContent='NOT_RUN: Start a 30-second baseline. No engine/GLB/animation benchmark yet.';
</script></body></html>

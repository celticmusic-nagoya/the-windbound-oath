<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIND same-GLB runtime comparison</title>
<style>body{margin:0;background:#101923;color:#eef4f8;font:14px system-ui}header{padding:14px}button,input,select{padding:9px;margin:5px}button:disabled{opacity:.5}canvas{display:block;width:100%;height:52vh}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px}label{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.40.3/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.40.3/babylonjs.loaders.min.js"></script>
</head><body><header><strong>LIND｜同一GLB比較（独立技術検証）</strong>
<p>同じローカルGLBを両エンジンへ読み込みます。CDNライブラリのバージョンは固定済みですが、SRI・正式アセット照合は未完了です。結果は正式採用判定ではありません。</p>
<label>GLB <input id="file" type="file" accept=".glb,model/gltf-binary"></label>
<label>エンジン <select id="engine"><option value="three">Three.js 0.170.0</option><option value="babylon">Babylon.js 7.40.3</option></select></label>
<button id="run">3秒準備＋30秒測定</button><button id="stop">停止</button><button id="copy">結果コピー</button></header>
<canvas id="view"></canvas><pre id="report">NOT_RUN</pre>
<script type="module">
let canvas=document.querySelector('#view');
const file=document.querySelector('#file'),selector=document.querySelector('#engine'),report=document.querySelector('#report'),run=document.querySelector('#run');
let token=0,active=null,result={status:'NOT_RUN'};
const show=()=>report.textContent=JSON.stringify(result,null,2);
const percentile=(a,q=.95)=>{const s=[...a].sort((a,b)=>a-b);return s.length?s[Math.ceil(s.length*q)-1]:null};
const VEC_LIGHT=[3,5,4],FOV=55;
function renderEnvironment(canvas){const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');if(!gl)throw Error('WebGL context unavailable');const ext=gl.getExtension('WEBGL_debug_renderer_info');return {width:gl.drawingBufferWidth,height:gl.drawingBufferHeight,version:gl.getParameter(gl.VERSION),renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),vendor:ext?gl.getParameter(ext.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR),contextAttributes:gl.getContextAttributes()};}
const dimensions=()=>{const dpr=Math.min(devicePixelRatio,2);return {width:Math.max(1,Math.round(canvas.clientWidth*dpr)),height:Math.max(1,Math.round(canvas.clientHeight*dpr)),dpr}};
function cleanup(){if(active){active.dispose();active=null}}
function cancel(status){token++;run.disabled=false;cleanup();if(result.status==='LOADING'||result.status==='WARMUP'||result.status==='RUNNING'){result.status=status;show()}}
document.querySelector('#stop').onclick=()=>cancel('STOPPED_EARLY');
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(result,null,2)).catch(e=>{result.copyError=String(e);show()});
async function sha(buffer){const b=await crypto.subtle.digest('SHA-256',buffer);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// Each session owns a fresh canvas and a locally parsed asset. No shared texture cache.
function disposeThreeAsset(root){
 const geometries=new Set(),materials=new Set(),textures=new Set(),skeletons=new Set(),bitmaps=new Set();
 root?.traverse(o=>{
  if(o.geometry)geometries.add(o.geometry);
  if(o.skeleton)skeletons.add(o.skeleton);
  for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m)materials.add(m);
 });
 for(const m of materials)for(const value of Object.values(m))if(value?.isTexture)textures.add(value);
 for(const t of textures){
  const image=t.source?.data;
  for(const item of (Array.isArray(image)?image:[image]))if(typeof ImageBitmap!=='undefined'&&item instanceof ImageBitmap)bitmaps.add(item);
 }
 for(const s of skeletons)s.dispose();
 for(const g of geometries)g.dispose();
 for(const m of materials)m.dispose();
 for(const t of textures)t.dispose();
 for(const b of bitmaps)b.close();
}
function releaseContext(gl){if(gl&&!gl.isContextLost())gl.getExtension('WEBGL_lose_context')?.loseContext();}
function threeSession(THREE,GLTFLoader,bytes,dims,canvas){
 const renderer=new THREE.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(1);renderer.setSize(dims.width,dims.height,false);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x132033);
 const camera=new THREE.PerspectiveCamera(FOV,dims.width/dims.height,.1,1000);
 renderer.toneMapping=THREE.NoToneMapping;
 scene.add(new THREE.HemisphereLight(0xffffff,0x555555,0.7));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(...VEC_LIGHT);scene.add(light);
 const loader=new GLTFLoader(),mixerState={mixer:null},gl=renderer.getContext();
 let roots=[],disposed=false;
 const dispose=()=>{if(disposed)return;disposed=true;try{
  // All loaded scenes can share resources; collect once through a temporary group.
  const group=new THREE.Group();for(const root of roots)group.add(root);disposeThreeAsset(group);roots=[];
 }finally{try{renderer.dispose()}finally{releaseContext(gl)}}};
 return new Promise((resolve,reject)=>{
 const fail=error=>{try{dispose()}catch(cleanupError){console.warn('session cleanup',cleanupError)}reject(error)};
 try{loader.parse(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),'',gltf=>{
  roots=gltf.scenes?.length?gltf.scenes:[gltf.scene];
  try{
  const root=gltf.scene;scene.add(root);
  const bounds=new THREE.Box3().setFromObject(root),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),radius=Math.max(size.length(),1);
  camera.position.copy(center).add(new THREE.Vector3(0,radius*.25,radius*1.5));camera.lookAt(center);camera.far=Math.max(1000,radius*10);camera.updateProjectionMatrix();
  // Static reference pose in both engines; no time-dependent animation comparison.
  let meshes=0,skinned=0,triangles=0;root.traverse(o=>{if(o.isMesh){meshes++;if(o.isSkinnedMesh)skinned++;const g=o.geometry;const n=g.index?g.index.count:g.attributes.position?.count||0;triangles+=Math.floor(n/3)}});
  resolve({meta:{meshes,skinned,animations:gltf.animations.length,triangles,materials:gltf.parser.json.materials?.length||0},
   camera:{min:bounds.min.toArray(),max:bounds.max.toArray(),eye:camera.position.toArray(),target:center.toArray(),near:camera.near,far:camera.far,verticalFovDegrees:FOV,rightHanded:true},environment:renderEnvironment(canvas),
   draw(dt){mixerState.mixer?.update(dt);renderer.render(scene,camera)},
   stats(){return {drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles}},
   dispose});
  }catch(error){fail(error)}
 },fail)}catch(error){fail(error)}
 });
}
async function babylonSession(bytes,dims,canvas){
 const B=window.BABYLON;if(!B?.SceneLoader)throw Error('Babylon loader unavailable');
 const engine=new B.Engine(canvas,false,{preserveDrawingBuffer:false,stencil:false},false);engine.setHardwareScalingLevel(1);engine.setSize(dims.width,dims.height);
 const scene=new B.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new B.Color4(19/255,32/255,51/255,1);scene.imageProcessingConfiguration.toneMappingEnabled=false;
 const camera=new B.FreeCamera('camera',new B.Vector3(0,1,5),scene);camera.fov=FOV*Math.PI/180;camera.fovMode=B.Camera.FOVMODE_VERTICAL_FIXED;camera.minZ=.1;camera.maxZ=1000;scene.activeCamera=camera;
 const ambient=new B.HemisphericLight('ambient',new B.Vector3(0,1,0),scene);ambient.intensity=.7;ambient.groundColor=B.Color3.FromHexString('#555555').toLinearSpace();
 const light=new B.DirectionalLight('key',new B.Vector3(...VEC_LIGHT.map(x=>-x)),scene);light.intensity=2;
 const glbFile=new File([bytes],'benchmark.glb',{type:'model/gltf-binary'}),gl=canvas.getContext('webgl2')||canvas.getContext('webgl');
 let disposed=false;
 const dispose=()=>{if(disposed)return;disposed=true;try{scene.dispose()}finally{try{engine.dispose()}finally{releaseContext(gl)}}};
 try{
  const loaded=await B.SceneLoader.ImportMeshAsync('','',glbFile,scene,undefined,'.glb');
  const meshes=loaded.meshes.filter(m=>m.getTotalVertices&&m.getTotalVertices()>0);
  const vectors=meshes.map(m=>{m.computeWorldMatrix(true);return m.getBoundingInfo().boundingBox;});
  const lo=new B.Vector3(Infinity,Infinity,Infinity),hi=new B.Vector3(-Infinity,-Infinity,-Infinity);
  vectors.forEach(b=>{lo.minimizeInPlace(b.minimumWorld);hi.maximizeInPlace(b.maximumWorld)});
  const center=vectors.length?lo.add(hi).scale(.5):B.Vector3.Zero();
  const radius=vectors.length?Math.max(hi.subtract(lo).length(),1):1;
  camera.position=center.add(new B.Vector3(0,radius*.25,radius*1.5));camera.setTarget(center);camera.maxZ=Math.max(1000,radius*10);
  loaded.animationGroups.forEach(g=>g.stop());
  return {meta:{meshes:meshes.length,skinned:meshes.filter(m=>m.skeleton).length,animations:loaded.animationGroups.length,triangles:meshes.reduce((n,m)=>n+Math.floor((m.getTotalIndices?.()||m.getTotalVertices())/3),0),materials:scene.materials.length},
   camera:{min:lo.asArray(),max:hi.asArray(),eye:camera.position.asArray(),target:center.asArray(),near:camera.minZ,far:camera.maxZ,verticalFovDegrees:FOV,rightHanded:scene.useRightHandedSystem},environment:renderEnvironment(canvas),
   draw(){scene.render()},stats(){return {drawCalls:null,triangles:null}},dispose};
 }catch(e){dispose();throw e}
}
run.onclick=async()=>{
 cancel('STOPPED_EARLY');const id=token;const f=file.files?.[0];if(!f){result={status:'NO_FILE'};show();return}
 run.disabled=true;const engine=selector.value;
 const runCanvas=canvas.cloneNode(false);canvas.replaceWith(runCanvas);canvas=runCanvas;
 result={status:'LOADING',engine,filename:f.name,bytes:f.size,userAgent:navigator.userAgent,dimensions:dimensions(),warmupMs:3000,measurementMs:30000,warning:'Technical-only. No engine adoption, G2 or Android G4 PASS'};show();
 try{
  const buffer=await f.arrayBuffer();if(id!==token)return;
  const digest=await sha(buffer);if(id!==token)return;result.sha256=digest;
  const bytes=new Uint8Array(buffer),view=new DataView(buffer);
  if(buffer.byteLength<20||view.getUint32(0,true)!==0x46546c67||view.getUint32(4,true)!==2||view.getUint32(8,true)!==buffer.byteLength||view.getUint32(16,true)!==0x4e4f534a||view.getUint32(12,true)>Math.min(buffer.byteLength-20,8*1024*1024))throw Error('Invalid or oversized GLB JSON header');
  const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(buffer,20,view.getUint32(12,true))));
  if((doc.meshes||[]).some(m=>m.primitives.some(p=>(p.mode??4)!==4)))throw Error('Benchmark supports TRIANGLES primitives only');
  if([...(doc.buffers||[]),...(doc.images||[])].some(x=>typeof x.uri==='string'&&!x.uri.startsWith('data:')))throw Error('External resources not supported');
  if((doc.extensionsUsed||[]).includes('EXT_mesh_gpu_instancing'))throw Error('Instancing benchmark not qualified');
  const t0=performance.now();
  let session;
  if(engine==='three'){const [THREE,addon]=await Promise.all([import('three'),import('three/addons/loaders/GLTFLoader.js')]);if(id!==token)return;session=await threeSession(THREE,addon.GLTFLoader,bytes,result.dimensions,runCanvas)}
  else session=await babylonSession(bytes,result.dimensions,runCanvas);
  if(id!==token){session.dispose();return}
  active=session;
  result.loadMs=performance.now()-t0;result.asset=active.meta;result.camera=active.camera;result.environment=active.environment;result.animationPolicy='static';result.lighting={hemisphereIntensity:.7,groundColorSRGB:'#555555',directionalIntensity:2,lightPosition:VEC_LIGHT,backgroundSRGB:'#132033',equivalence:'nominal only; PBR and color pipelines differ'};result.engineVersion=engine==='babylon'?window.BABYLON?.Engine?.Version:'0.170.0';result.status='WARMUP';show();
  let phaseStart=0,last=0,samples=[],elapsed=0;
  const tick=t=>{
   if(id!==token)return;
   if(document.visibilityState!=='visible'){result.status='FAIL_RENDER';result.error='page hidden during measurement';cleanup();show();run.disabled=false;return;}
   if(!phaseStart){phaseStart=t;last=t}
   const dt=t-last;last=t;
   try{active.draw(Math.min(dt/1000,.1))}catch(e){result.status='FAIL_RENDER';result.error=String(e);cleanup();show();run.disabled=false;return}
   elapsed=t-phaseStart;
   if(result.status==='WARMUP'&&elapsed>=3000){result.status='RUNNING';phaseStart=t;last=t;samples=[];result.renderInfo=active.stats();show()}
   else if(result.status==='RUNNING'){
    if(dt>0&&Number.isFinite(dt))samples.push(dt);
    if(elapsed>=30000){result.status='COMPLETED';result.frames=samples.length;result.meanFrameMs=samples.length?samples.reduce((a,b)=>a+b,0)/samples.length:null;result.p50FrameMs=percentile(samples,.5);result.p95FrameMs=percentile(samples);result.p99FrameMs=percentile(samples,.99);result.maxFrameMs=samples.length?Math.max(...samples):null;result.longFrames=samples.filter(x=>x>33.3).length;result.stalls=samples.filter(x=>x>=1000).length;result.frameIntervalsMs=samples;result.elapsedMs=elapsed;result.renderInfo=active.stats();cleanup();show();run.disabled=false;return}
   }
   requestAnimationFrame(tick);
  };requestAnimationFrame(tick);
 }catch(e){if(id===token){result.status='FAIL_LOAD';result.error=String(e);cleanup();show()}}finally{if(id===token&&result.status!=='WARMUP'&&result.status!=='RUNNING')run.disabled=false}
};
</script></body></html>

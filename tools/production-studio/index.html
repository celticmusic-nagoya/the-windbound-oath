<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TWO Production Studio</title><link rel="stylesheet" href="studio.css"><script src="studio.js" defer></script></head><body><header><small>THE WINDBOUND OATH / DEVELOPMENT</small><h1>Production Studio</h1><p>制作状況・成果物・品質管理</p></header><main><section class="toolbar"><button id="refresh">最新情報を取得</button><span id="status" role="status">未取得</span></section><section id="summary" class="grid" aria-label="集計"></section><h2>制作領域</h2><section id="projects" class="grid"></section><h2>成果物ギャラリー</h2><p>取得済みの実画像を端末内で比較できます。画像はアップロードされません。</p><label for="images">JPG・PNGを選択（複数可）</label><input id="images" type="file" accept="image/jpeg,image/png" multiple><button id="clear-images" type="button">画像をクリア</button><p id="image-status" role="status">画像未選択</p><section id="gallery" class="grid"></section><h2>GitHub Actions</h2><section id="runs" class="grid"></section><p class="note">公開GitHub APIの読み取り専用表示。PRの状態やCI成功は成果物完成・品質PASSを意味しません。非公開成果物・認証操作は未対応です。</p></main></body></html>

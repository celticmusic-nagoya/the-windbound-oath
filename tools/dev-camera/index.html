<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TWO | Development 3D Camera</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#121b21;color:#edf1f0;font:14px system-ui}header{padding:12px 16px;background:#1d2b33;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}main{position:relative;height:calc(100dvh - 155px);min-height:300px}canvas{display:block;width:100%;height:100%;touch-action:none}aside{padding:12px;display:flex;flex-wrap:wrap;gap:8px;background:#1d2b33}button,input{font:inherit}button{background:#314751;color:white;border:1px solid #667b80;border-radius:7px;padding:8px 12px;cursor:pointer}button:focus-visible{outline:3px solid #d3b977}#status{color:#b6c6c8;font-size:12px}#layers{display:flex;gap:8px;flex-wrap:wrap}label{white-space:nowrap}#drop{position:absolute;inset:0;display:none;place-items:center;background:#16272bd9;border:3px dashed #b2ccce;pointer-events:none}#drop.active{display:grid}small{display:block;color:#b6c6c8}</style></head>
<body><header><div><strong>THE WINDBOUND OATH｜開発用3Dカメラ</strong><small>ゲーム本体とは独立したQAビューア</small></div><div><input id="file" type="file" accept=".glb" aria-label="GLBモデルを読み込む"><span id="status" role="status">モデル未読込</span></div></header>
<main id="stage"><div id="drop">GLBファイルをここにドロップ</div></main>
<aside><button data-view="game">27°俯瞰</button><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="left">左</button><button data-view="right">右</button><button data-view="top">真上</button><button id="fit">全体表示</button><div id="layers"></div></aside>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status'),layers=document.getElementById('layers');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x25313a);
const camera=new THREE.PerspectiveCamera(45,1,.01,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.screenSpacePanning=true;
scene.add(new THREE.HemisphereLight(0xcce5ff,0x665a4b,2.0));const sun=new THREE.DirectionalLight(0xffe5bf,2.2);sun.position.set(8,10,12);scene.add(sun);
const grid=new THREE.GridHelper(30,30,0x55717c,0x354a54);grid.rotation.x=Math.PI/2;scene.add(grid);scene.add(new THREE.AxesHelper(2));
let model=null,center=new THREE.Vector3(),radius=5,blobUrl=null;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
new ResizeObserver(resize).observe(stage);resize();
function aim(key){const d={game:[1,-1,.51],front:[0,-1,0],back:[0,1,0],left:[-1,0,0],right:[1,0,0],top:[0,0,1]}[key]||[1,-1,.51];const v=new THREE.Vector3(...d).normalize();camera.up.set(key==='top'?0:0,key==='top'?1:0,key==='top'?0:1);camera.position.copy(center).addScaledVector(v,radius*2.9);controls.target.copy(center);controls.update()}
function fit(){if(!model)return;const box=new THREE.Box3().setFromObject(model);if(box.isEmpty())return;box.getCenter(center);radius=Math.max(box.getSize(new THREE.Vector3()).length()/2,1);camera.near=Math.max(.01,radius/1000);camera.far=radius*100;camera.updateProjectionMatrix();aim('game')}
function groupName(name){const n=(name||'other').replace(/\\.\\d+$/,'').toLowerCase();if(/slate|roof|ridge|eave|rafter/.test(n))return '屋根';if(/stone|wall|foundation|mortar/.test(n))return '石壁・基礎';if(/timber|beam|post|frame|brace/.test(n))return '木組み';if(/door|window|shutter|glass/.test(n))return '建具';if(/porch|step|stair/.test(n))return '玄関';return 'その他'}
function showLayers(){layers.replaceChildren();if(!model)return;const groups=new Map();model.traverse(o=>{if(!o.isMesh)return;const key=groupName(o.name);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(o)});for(const [key,objects] of groups){const label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.addEventListener('change',()=>{for(const o of objects)o.visible=cb.checked});label.append(cb,document.createTextNode(' '+key+' ('+objects.length+')'));layers.append(label)}}
async function load(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.glb')){status.textContent='GLBファイルのみ対応';return}status.textContent='読み込み中…';if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(file);
try{const gltf=await new GLTFLoader().loadAsync(blobUrl);if(model){scene.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){for(const m of [].concat(o.material))m.dispose()}})}model=gltf.scene;scene.add(model);fit();showLayers();status.textContent=file.name+' 読込完了'}catch(e){status.textContent='読み込み失敗: '+e.message;console.error(e)}}
document.getElementById('file').addEventListener('change',e=>load(e.target.files[0]));document.getElementById('fit').addEventListener('click',fit);
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>aim(b.dataset.view)));
const drop=document.getElementById('drop');stage.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('active')});stage.addEventListener('dragleave',()=>drop.classList.remove('active'));stage.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('active');load(e.dataTransfer.files[0])});
aim('game');renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
